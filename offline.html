<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6b18">
<meta name="robots" content="noindex">
<title>오프라인 | 춘봉 팬허브</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg">
<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 18%,rgba(255,107,24,.16),transparent 34%),#080808;color:#fff}
main{width:min(100%,560px);padding:30px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(16,16,16,.94);box-shadow:0 30px 90px rgba(0,0,0,.36)}
.mark{display:grid;place-items:center;width:64px;height:64px;margin-bottom:22px;border-radius:18px;background:#ff6b18;color:#fff;font-weight:900;font-size:24px}
small{color:#ff985c;font-weight:800;letter-spacing:.14em}
h1{margin:10px 0 12px;font-size:clamp(2rem,9vw,3.4rem);line-height:1}
p{margin:0;color:rgba(255,255,255,.72);line-height:1.7}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
a,button{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:13px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
a{background:#ff6b18;color:#fff}
button{border:1px solid rgba(255,255,255,.18);background:#171717;color:#fff}
.note{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem}
@media(max-width:520px){main{padding:24px 20px;border-radius:20px}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">CB</div>
<small>CHUNBONG FAN HUB</small>
<h1>오프라인 상태입니다.</h1>
<p>인터넷 연결이 끊겨 최신 방송 정보는 불러올 수 없지만, 저장된 기본 화면은 계속 열 수 있습니다.</p>
<div class="actions">
<a href="/index.html">홈으로</a>
<button type="button" onclick="location.reload()">다시 연결</button>
</div>
<p class="note">연결이 복구되면 새로고침해 최신 공지·일정·데이터를 확인해 주세요.</p>
</main>
</body>
</html>
