<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b18">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>운영자 센터 | 춘봉 팬허브</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css" data-theme-styles>
  <link rel="stylesheet" href="site-design-system.css">
  <link rel="stylesheet" href="operator.css?v=8">
  <link rel="stylesheet" href="operator-history-audit.css?v=1">
  <link rel="stylesheet" href="operator-budget-extra.css?v=1">
  <link rel="stylesheet" href="operator-redis-diagnostics.css?v=1">
</head>
<body data-page="operator">
<a class="operator-skip-link" href="#main-content">본문 바로가기</a>
<main class="operator-page" id="main-content">
  <header class="operator-topbar">
    <a href="index.html" class="operator-back">← 팬사이트</a>
    <div><small>CHUNBONG FAN HUB</small><strong>OPERATOR CENTER</strong></div>
    <button id="operator-logout" type="button" hidden>로그아웃</button>
  </header>

  <section id="operator-login" class="operator-login-card">
    <span class="operator-kicker">OWNER ONLY</span>
    <h1>운영자 인증</h1>
    <p>실사용 분석 데이터와 피드백 상세는 소유주 인증 후에만 확인할 수 있습니다. 인증이 완료되면 이 기기에서 최대 1년 동안 로그인 상태를 유지합니다.</p>
    <a id="operator-github-login" class="operator-auth-button github" href="/api/operator/github/start?return=%2Foperator.html">GitHub로 인증</a>
    <div class="operator-divider"><span>또는</span></div>
    <form id="operator-email-form">
      <label for="operator-email">이메일로 인증</label>
      <div class="operator-email-row">
        <input id="operator-email" type="email" autocomplete="email" placeholder="운영자 이메일" required>
        <button type="submit">인증 메일 보내기</button>
      </div>
      <small>등록된 소유주 이메일로만 인증할 수 있습니다.</small>
    </form>
    <p id="operator-login-status" class="operator-status" aria-live="polite"></p>
  </section>

  <div id="operator-dashboard-host" aria-live="polite"></div>
</main>
<script src="history-data.js?v=6"></script>
<script src="operator-auth-loader.js?v=1"></script>
</body>
</html>
