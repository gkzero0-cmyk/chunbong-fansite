name: Chunbong data snapshot

on:
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture production snapshot
        run: node scripts/update-chunbong-data.mjs
      - name: Commit changed history
        run: |
          if git diff --quiet -- data/chunbong-data-history.json; then
            echo 'No snapshot change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chunbong-data-history.json
          git commit -m 'data: update Chunbong daily snapshot'
          git push
