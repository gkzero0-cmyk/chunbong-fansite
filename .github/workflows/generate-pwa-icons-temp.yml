name: Generate PWA PNG icons

on:
  push:
    branches:
      - perf/pwa-icon-compat-20260919
    paths:
      - '.github/workflows/generate-pwa-icons-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pwa-icon-compat-20260919
      - name: Install SVG renderer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin
      - name: Render PWA icons
        run: |
          rsvg-convert -w 192 -h 192 assets/app-icon.svg -o assets/app-icon-192.png
          rsvg-convert -w 512 -h 512 assets/app-icon.svg -o assets/app-icon-512.png
          rsvg-convert -w 180 -h 180 assets/app-icon.svg -o assets/apple-touch-icon.png
          file assets/app-icon-192.png assets/app-icon-512.png assets/apple-touch-icon.png
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/app-icon-192.png assets/app-icon-512.png assets/apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: generate PWA PNG icons"
          git push origin HEAD:perf/pwa-icon-compat-20260919
