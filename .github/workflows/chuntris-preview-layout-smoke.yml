name: Chuntris preview layout smoke

on:
  pull_request:
    paths:
      - 'chuntris.html'
      - 'chuntris.css'
      - 'chuntris-fullscreen.css'
      - 'chuntris-immersive.css'
      - 'chuntris-engine.js'
      - 'chuntris-audio.js'
      - 'chuntris-ranking-core.js'
      - 'chuntris.js'
      - 'api/content.js'
      - 'lib/chuntris-ranking-api.js'
      - 'assets/chuntris/**'
      - '.github/workflows/chuntris-preview-layout-smoke.yml'

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chuntris-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/chuntris.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chuntris-http.log
          exit 1
      - name: Verify immersive responsive layout and interaction flow
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const URL = 'http://127.0.0.1:4173/chuntris.html';

          async function verify(browser, options, label) {
            const page = await browser.newPage(options);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(URL, { waitUntil:'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.ChuntrisApp?.getGame?.()));

            const viewport = page.viewportSize();
            assert.ok(viewport, `${label} viewport missing`);
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'), 'start-mode');
            assert.ok(await page.locator('#chuntris-start-view').isVisible(), `${label} start view missing`);
            assert.equal(await page.locator('#chuntris-play-view').isVisible(), false, `${label} play view must start hidden`);
            assert.equal(await page.locator('.chuntris-ranking-rail').count(), 0, `${label} ranking rail must be removed`);
            assert.equal(await page.locator('.chuntris-help-rail').count(), 0, `${label} help rail must be removed`);

            await page.locator('#chuntris-mode-classic').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'), 'start-player');
            assert.ok(await page.locator('#chuntris-player-step').isVisible(), `${label} player step missing`);
            await page.locator('#chuntris-nickname').fill('');
            await page.locator('#chuntris-start').click();
            await page.waitForFunction(() => document.querySelector('#chuntris-game')?.dataset.gameStatus === 'playing');
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'), 'playing');
            assert.ok(await page.locator('#chuntris-play-view').isVisible(), `${label} play view missing after start`);

            const documentWidth = await page.evaluate(() => document.documentElement.scrollWidth);
            const gameBox = await page.locator('#chuntris-game').boundingBox();
            const boardBox = await page.locator('.chuntris-board-wrap').boundingBox();
            assert.ok(gameBox && boardBox, `${label} core layout missing`);
            assert.ok(documentWidth <= viewport.width + 1, `${label} horizontal overflow: ${documentWidth} > ${viewport.width}`);
            assert.ok(gameBox.x >= -1 && gameBox.x + gameBox.width <= viewport.width + 1, `${label} game frame outside viewport`);
            assert.ok(boardBox.width > 0 && boardBox.height > 0, `${label} board has invalid size`);
            assert.ok(boardBox.width <= viewport.width + 1, `${label} board wider than viewport`);

            for (const id of ['#chuntris-utility-ranking','#chuntris-utility-sound','#chuntris-utility-controls','#chuntris-pause']) {
              assert.ok(await page.locator(id).isVisible(), `${label} utility missing: ${id}`);
            }

            if (viewport.width > 1180) {
              const [left,board,right] = await Promise.all([
                page.locator('.chuntris-left-panel').boundingBox(),
                page.locator('.chuntris-board-wrap').boundingBox(),
                page.locator('.chuntris-right-panel').boundingBox()
              ]);
              assert.ok(left && board && right, `${label} three-region layout missing`);
              assert.ok(left.x < board.x && board.x < right.x, `${label} three-region order invalid`);
              assert.ok(board.width >= 280, `${label} enlarged board unexpectedly narrow: ${board.width}`);
              const [hold,next,stats,reaction] = await Promise.all([
                page.locator('#chuntris-hold').boundingBox(),
                page.locator('#chuntris-next').boundingBox(),
                page.locator('.chuntris-stats').boundingBox(),
                page.locator('#chuntris-reaction').boundingBox()
              ]);
              assert.ok(hold && next && stats && reaction, `${label} side content missing`);
              assert.ok(stats.y > hold.y, `${label} score must be below HOLD`);
              assert.ok(reaction.y > next.y, `${label} reaction must be below NEXT`);
            }

            const reactionImage = await page.locator('#chuntris-reaction').evaluate(el => getComputedStyle(el).backgroundImage);
            assert.match(reactionImage, /fl_preserve_transparency/, `${label} reaction must use alpha-preserving HD sprite`);

            await page.locator('#chuntris-utility-ranking').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'paused', `${label} ranking modal must auto-pause`);
            assert.ok(await page.locator('#chuntris-modal').isVisible(), `${label} ranking modal missing`);
            assert.ok(await page.locator('[data-chuntris-panel="ranking"]').isVisible(), `${label} ranking panel missing`);
            await page.locator('.chuntris-modal-close').click();
            await page.waitForFunction(() => document.querySelector('#chuntris-game')?.dataset.gameStatus === 'playing');

            await page.locator('#chuntris-pause').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'paused', `${label} manual pause failed`);
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(), `${label} pause panel missing`);
            await page.locator('[data-chuntris-panel="pause"] [data-chuntris-open="sound"]').click();
            assert.ok(await page.locator('[data-chuntris-panel="sound"]').isVisible(), `${label} sound panel missing from pause`);
            await page.locator('.chuntris-modal-close').click();
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(), `${label} closing pause child must return to pause menu`);
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'paused', `${label} pause child must not resume`);
            await page.locator('#chuntris-pause-continue').click();
            await page.waitForFunction(() => document.querySelector('#chuntris-game')?.dataset.gameStatus === 'playing');

            await page.keyboard.press('Space');
            assert.ok(await page.locator('#chuntris-harddrop-fx').evaluate(el => el.classList.contains('is-active')), `${label} hard-drop effect missing`);
            await page.evaluate(() => window.ChuntrisApp.showClearEffect(4));
            assert.equal(await page.locator('#chuntris-clear-label').textContent(), 'QUAD', `${label} clear label mismatch`);

            assert.deepEqual(errors, [], `${label} page errors: ${errors.join(' | ')}`);
            console.log(`${label} passed: board=${boardBox.width}x${boardBox.height}`);
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless:true });
            try {
              await verify(browser, { viewport:{ width:1440, height:900 } }, 'Desktop 1440x900');
              await verify(browser, { viewport:{ width:1024, height:768 } }, 'Tablet 1024x768');
              await verify(browser, { viewport:{ width:390, height:844 }, isMobile:true, hasTouch:true }, 'Mobile 390x844');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
