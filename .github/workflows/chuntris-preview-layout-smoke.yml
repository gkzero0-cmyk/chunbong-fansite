name: Chuntris preview layout smoke

on:
  pull_request:
    paths:
      - 'chuntris.html'
      - 'chuntris.css'
      - 'chuntris-engine.js'
      - 'chuntris-audio.js'
      - 'chuntris-ranking-core.js'
      - 'chuntris.js'
      - 'api/content.js'
      - 'lib/chuntris-ranking-api.js'
      - 'assets/chuntris/**'
      - '.github/workflows/chuntris-preview-layout-smoke.yml'

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chuntris-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/chuntris.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/chuntris-http.log
          exit 1
      - name: Verify responsive layout and transparent HD reaction source
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const URL = 'http://127.0.0.1:4173/chuntris.html';

          async function verify(browser, options, label) {
            const page = await browser.newPage(options);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(URL, { waitUntil:'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.ChuntrisApp?.getGame?.()));
            const viewport = page.viewportSize();
            assert.ok(viewport, `${label} viewport missing`);
            const documentWidth = await page.evaluate(() => document.documentElement.scrollWidth);
            const gameBox = await page.locator('#chuntris-game').boundingBox();
            const boardBox = await page.locator('.chuntris-board-wrap').boundingBox();
            assert.ok(gameBox && boardBox, `${label} core layout missing`);
            assert.ok(documentWidth <= viewport.width + 1, `${label} horizontal overflow: ${documentWidth} > ${viewport.width}`);
            assert.ok(gameBox.x >= -1 && gameBox.x + gameBox.width <= viewport.width + 1, `${label} game frame outside viewport`);
            assert.ok(boardBox.width > 0 && boardBox.height > 0, `${label} board has invalid size`);
            assert.ok(boardBox.width <= viewport.width + 1, `${label} board wider than viewport`);
            assert.ok(boardBox.height <= viewport.height - 40, `${label} board too tall: ${boardBox.height}`);

            if (viewport.width > 1180) {
              const selectors = ['.chuntris-ranking-rail','.chuntris-left-panel','.chuntris-board-wrap','.chuntris-right-panel','.chuntris-help-rail'];
              const [ranking,left,board,right,help] = await Promise.all(selectors.map(selector => page.locator(selector).boundingBox()));
              assert.ok(ranking && left && board && right && help, `${label} five-region layout missing`);
              assert.ok(ranking.x < left.x && left.x < board.x && board.x < right.x && right.x < help.x, `${label} five-region order invalid`);
              const [hold,next,stats,reaction] = await Promise.all([
                page.locator('#chuntris-hold').boundingBox(),
                page.locator('#chuntris-next').boundingBox(),
                page.locator('.chuntris-stats').boundingBox(),
                page.locator('#chuntris-reaction').boundingBox()
              ]);
              assert.ok(hold && next && stats && reaction, `${label} side content missing`);
              assert.ok(next.width > hold.width, `${label} NEXT must be larger than HOLD`);
              assert.ok(stats.y > hold.y, `${label} score must be below HOLD`);
              assert.ok(reaction.y > next.y, `${label} reaction must be below NEXT`);
              assert.ok(reaction.width >= 120, `${label} reaction character too small`);
            }

            const reactionImage = await page.locator('#chuntris-reaction').evaluate(el => getComputedStyle(el).backgroundImage);
            assert.match(reactionImage, /fl_preserve_transparency/, `${label} reaction must use alpha-preserving HD sprite`);
            await page.locator('#chuntris-nickname').fill('PreviewTester');
            await page.locator('#chuntris-start').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
            assert.deepEqual(errors, [], `${label} page errors: ${errors.join(' | ')}`);
            console.log(`${label} passed: board=${boardBox.width}x${boardBox.height}`);
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless:true });
            try {
              await verify(browser, { viewport:{ width:1280, height:900 } }, 'Desktop 1280x900');
              await verify(browser, { viewport:{ width:1280, height:740 } }, 'Desktop 1280x740');
              await verify(browser, { viewport:{ width:900, height:800 } }, 'Desktop 900x800');
              await verify(browser, { viewport:{ width:390, height:844 }, isMobile:true, hasTouch:true }, 'Mobile 390x844');
              await verify(browser, { viewport:{ width:360, height:800 }, isMobile:true, hasTouch:true }, 'Mobile 360x800');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
