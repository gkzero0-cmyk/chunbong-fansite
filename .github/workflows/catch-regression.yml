name: Legacy Node regression (manual)

on:
  workflow_dispatch:

jobs:
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check script.js
          node --check page.js
          node --check tarot-data.js
          node --check tarot.js
          for file in api/*.js; do node --check "$file"; done
          node --check lib/push-notifications-api.js
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "=== $file ==="
            node "$file"
            count=$((count + 1))
          done
          echo "TOTAL_TEST_FILES=$count"
