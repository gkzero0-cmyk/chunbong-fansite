name: Site regression

on:
  push:
    branches: [main, feat/tarot-78-card]
  workflow_dispatch:

jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check API syntax
        run: |
          node --check api/clips.js
          node --check api/notice.js
          node --check api/_shared.js
      - name: Run Catch source regression
        run: node tests/catch-page-source-regression.mjs
      - name: Run Catch embed regression
        run: node tests/catch-playback-schedule-removal-regression.mjs
      - name: Run notice single-board regression
        run: node tests/notice-single-board-regression.mjs
      - name: Run Tarot asset regression
        run: node tests/tarot-assets-regression.mjs
