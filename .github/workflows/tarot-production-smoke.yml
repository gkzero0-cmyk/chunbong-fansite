name: Tarot production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tarot.html'
      - 'tarot.css'
      - 'tarot-quality.css'
      - 'tarot-composite.css'
      - 'tarot.js'
      - 'tarot-composite.js'
      - 'tarot-data.js'
      - 'api/tarot-reading.js'
      - '.github/workflows/tarot-production-smoke.yml'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Wait for production tarot deployment and cropped originals
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          DELIVERY='https://res.cloudinary.com/lyppgyei/image/upload'
          CARD0="$DELIVERY/c_crop,g_north_west,h_1488,w_898,x_0,y_0/q_100/f_avif/chunbong-fansite/tarot-original/sheet-0.avif"
          CARD77="$DELIVERY/c_crop,g_north_west,h_1488,w_898,x_10776,y_0/q_100/f_avif/chunbong-fansite/tarot-original/sheet-5.avif"

          for attempt in $(seq 1 60); do
            PAGE_HTTP=$(curl -L -sS -o /tmp/tarot-page -w '%{http_code}' "$BASE/tarot.html" || true)
            JS_HTTP=$(curl -L -sS -o /tmp/tarot-js -w '%{http_code}' "$BASE/tarot.js" || true)
            COMPOSITE_HTTP=$(curl -L -sS -o /tmp/tarot-composite-js -w '%{http_code}' "$BASE/tarot-composite.js" || true)
            CARD0_HTTP=$(curl -L -sS -o /tmp/tarot-card-0 -w '%{http_code}' "$CARD0" || true)
            CARD77_HTTP=$(curl -L -sS -o /tmp/tarot-card-77 -w '%{http_code}' "$CARD77" || true)

            if [ "$PAGE_HTTP" = 200 ] && [ "$JS_HTTP" = 200 ] && [ "$COMPOSITE_HTTP" = 200 ]               && [ "$CARD0_HTTP" = 200 ] && [ "$CARD77_HTTP" = 200 ]               && grep -q 'q_100/f_avif' /tmp/tarot-js               && grep -q 'originalCardCropUrl' /tmp/tarot-composite-js; then
              node <<'NODE'
          const fs=require('fs');
          function size(path){
            const b=fs.readFileSync(path);
            if(b.subarray(4,12).toString('ascii')!=='ftypavif') throw new Error('not avif');
            const o=b.indexOf(Buffer.from('ispe'));
            return {w:b.readUInt32BE(o+8),h:b.readUInt32BE(o+12),bytes:b.length};
          }
          for(const p of ['/tmp/tarot-card-0','/tmp/tarot-card-77']){
            const s=size(p);
            if(s.w!==898||s.h!==1488||s.bytes>=1024*1024) throw new Error(JSON.stringify(s));
          }
          NODE
              echo "PROD_READY=1"
              exit 0
            fi
            echo "PROD_WAIT_ATTEMPT=$attempt PAGE=$PAGE_HTTP JS=$JS_HTTP COMPOSITE=$COMPOSITE_HTTP CARD0=$CARD0_HTTP CARD77=$CARD77_HTTP"
            sleep 5
          done
          exit 1

      - name: Verify 12-card API
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          cat > /tmp/payload.json <<'JSON'
          {"question":"앞으로의 방향","topic":"direction","spreadId":"twelveCompass","cards":[
            {"id":"major-00","orientation":"upright","position":"현재 상태"},{"id":"major-01","orientation":"reversed","position":"내면"},
            {"id":"major-02","orientation":"upright","position":"외부 환경"},{"id":"major-03","orientation":"reversed","position":"관계"},
            {"id":"major-04","orientation":"upright","position":"강점"},{"id":"major-05","orientation":"reversed","position":"약점"},
            {"id":"major-06","orientation":"upright","position":"기회"},{"id":"major-07","orientation":"reversed","position":"장애물"},
            {"id":"major-08","orientation":"upright","position":"조언"},{"id":"major-09","orientation":"reversed","position":"가까운 흐름"},
            {"id":"major-10","orientation":"upright","position":"장기 흐름"},{"id":"major-11","orientation":"reversed","position":"최종 방향"}]}
          JSON
          curl -fsS -X POST "$BASE/api/tarot-reading" -H 'content-type: application/json' --data-binary @/tmp/payload.json >/tmp/tarot-response
          node -e "const p=require('/tmp/tarot-response');if(!p.reading||p.reading.cards.length!==12)process.exit(1)"

      - name: Verify cropped original artwork in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:1000},deviceScaleFactor:2});
          await page.goto('https://chunbong-fansite.vercel.app/tarot.html',{waitUntil:'networkidle'});
          await page.locator('input[name="spread"][value="threeFlow"]').check();
          await page.locator('input[name="selection-mode"][value="cards"]').check();
          await page.locator('#tarot-shuffle').click();
          await page.locator('#tarot-deck [data-card-index]').nth(0).click();
          await page.locator('#tarot-deck [data-card-index]').nth(1).click();
          await page.locator('#tarot-deck [data-card-index]').nth(2).click();
          await page.locator('#tarot-confirm-selection').click();
          await page.waitForFunction(()=>document.querySelectorAll('#tarot-reading-grid .tarot-composite-svg').length===3);
          const hrefs=await page.locator('#tarot-reading-grid .tarot-composite-art-image').evaluateAll(nodes=>nodes.map(n=>n.getAttribute('href')||''));
          assert.ok(hrefs.every(h=>h.includes('/c_crop,')&&h.includes('/q_100/f_avif/')&&h.includes('/tarot-original/sheet-')),JSON.stringify(hrefs));
          assert.ok(hrefs.every(h=>!h.includes('/image/upload/chunbong-fansite/tarot-original/')),JSON.stringify(hrefs));
          await page.locator('#tarot-reading-grid .tarot-card-art-button').first().click();
          await page.waitForFunction(()=>document.querySelector('#tarot-card-zoom')?.open===true);
          const zoom=await page.locator('#tarot-card-zoom .tarot-composite-art-image').getAttribute('href');
          assert.ok(zoom.includes('/c_crop,')&&zoom.includes('/q_100/f_avif/'),zoom);
          await browser.close();
          NODE
