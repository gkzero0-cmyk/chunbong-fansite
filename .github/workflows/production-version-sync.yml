name: Production version sync

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'tests/**'
      - 'docs/**'
      - 'scripts/**'
      - '**/*.md'
      - 'data/last-known-good.json'
      - 'data/soop-sessions.json'
      - 'data/soop-external-history.json'
      - 'data/youtube-engagement-cache.json'
      - 'data/soop-follower-history.json'
      - 'data/trackify-soop-cache.json'
      - 'data/chunbong-data-history.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production readiness gate
        id: production_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-readiness-gate.mjs

      - name: Compare main and production commit
        if: steps.production_gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(git rev-parse HEAD)"
          BASE='https://chunbong-fansite.vercel.app'
          BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'cache-control: no-cache' "${BASE}/api/version?_ts=$(date +%s)")"
          ACTUAL="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);process.stdout.write(p.sha||'')})")"
          RUNTIME_SYNCED="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);process.stdout.write(String(p.runtimeSynced===true||p.synced===true))})")"
          echo "expected=${EXPECTED} actual=${ACTUAL:-missing} runtime_synced=${RUNTIME_SYNCED}"
          if [ "$ACTUAL" = "$EXPECTED" ] || [ "$RUNTIME_SYNCED" = 'true' ]; then
            echo 'Production runtime is synced.'
            exit 0
          fi
          echo "::error::Production runtime changed after readiness gate. deployment=${ACTUAL:-missing} main=${EXPECTED}."
          exit 1

      - name: Production blocked
        if: steps.production_gate.outputs.blocked == 'true'
        run: echo 'Production sync is waiting for the Vercel cooldown; no code failure is reported.'
