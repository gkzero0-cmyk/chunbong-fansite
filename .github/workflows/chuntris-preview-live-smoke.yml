name: Chuntris preview live smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'chuntris.html'
      - 'chuntris.js'
      - 'chuntris-postgame-ranking.js'
      - 'api/content.js'
      - 'lib/chuntris-ranking-api.js'
      - '.github/workflows/chuntris-preview-live-smoke.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  live-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'vercel-preview') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and wait for current Vercel Preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "Preview discovery attempt ${attempt}/60"
            comments=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            preview=$(printf '%s' "$comments" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const rows=JSON.parse(s).filter(x=>x.user?.login==="vercel[bot]");
                for(const row of rows.reverse()){
                  const m=String(row.body||"").match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                  if(m){process.stdout.write(m[1]);return;}
                }
              });')
            if [ -n "$preview" ]; then
              stamp=$(date +%s)
              if curl -fsS -H 'cache-control: no-cache' "$preview/chuntris.html?_smoke=$stamp" -o /tmp/chuntris-preview.html && \
                 curl -fsS -H 'cache-control: no-cache' "$preview/chuntris-postgame-ranking.js?_smoke=$stamp" -o /tmp/chuntris-postgame-ranking.js && \
                 grep -q 'id="chuntris-ranking-register"' /tmp/chuntris-preview.html && \
                 ! grep -q 'id="chuntris-nickname"' /tmp/chuntris-preview.html && \
                 grep -q 'submitTerminalRanking' /tmp/chuntris-postgame-ranking.js && \
                 curl -fsS -H 'cache-control: no-cache' "$preview/api/content?type=chuntris-ranking&mode=classic&_smoke=$stamp" -o /tmp/chuntris-preview-ranking.json && \
                 node -e "const p=require('/tmp/chuntris-preview-ranking.json');if(p.mode!=='classic'||!Array.isArray(p.entries))process.exit(1)"; then
                echo "PREVIEW_BASE=$preview" >> "$GITHUB_ENV"
                echo "Preview ready with postgame ranking flow: $preview"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Current Vercel Preview did not become ready with the postgame ranking flow.' >&2
          exit 1
      - name: Verify ranking API validation without leaderboard pollution
        run: |
          set -euo pipefail
          host=${PREVIEW_BASE#https://}
          status=$(curl -sS -o /tmp/chuntris-invalid.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H "origin: https://$host" \
            --data '{"mode":"classic","nickname":"x","score":1,"lines":1,"level":1,"timeMs":1}' \
            "$PREVIEW_BASE/api/content?type=chuntris-ranking")
          test "$status" = '400'
          node -e "const p=require('/tmp/chuntris-invalid.json');if(p.error!=='invalid_nickname')process.exit(1)"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live immersive preview flow and layout
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const { chromium }=require('playwright');
          const BASE=process.env.PREVIEW_BASE;

          async function verify(browser, options, label) {
            const page=await browser.newPage(options);
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${BASE}/chuntris.html?_smoke=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.ChuntrisApp?.getGame?.()));
            await page.waitForFunction(()=>Boolean(window.ChuntrisPostgameRanking));

            const viewport=page.viewportSize();
            assert.ok(viewport,`${label} viewport missing`);
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-mode');
            assert.ok(await page.locator('#chuntris-start-view').isVisible(),`${label} start view missing`);
            assert.equal(await page.locator('#chuntris-play-view').isVisible(),false,`${label} play view must start hidden`);
            assert.equal(await page.locator('#chuntris-nickname').count(),0,`${label} pre-game nickname must be removed`);
            assert.ok(await page.locator('#chuntris-ranking-register').count(),`${label} postgame ranking button missing`);
            assert.equal(await page.locator('.chuntris-ranking-rail').count(),0,`${label} ranking rail must be removed`);
            assert.equal(await page.locator('.chuntris-help-rail').count(),0,`${label} help rail must be removed`);

            await page.locator('#chuntris-mode-classic').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-difficulty');
            assert.ok(await page.locator('#chuntris-difficulty-step').isVisible(),`${label} difficulty step missing`);
            assert.ok(await page.locator('[data-chuntris-difficulty="normal"]').isVisible(),`${label} normal difficulty missing`);
            await page.locator('[data-chuntris-difficulty="normal"]').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-difficulty');
            assert.ok(await page.locator('#chuntris-player-step').isVisible(),`${label} start action missing in difficulty step`);
            await page.locator('#chuntris-start').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'playing');

            const documentWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
            const game=await page.locator('#chuntris-game').boundingBox();
            const board=await page.locator('.chuntris-board-wrap').boundingBox();
            assert.ok(game&&board,`${label} play layout missing`);
            assert.ok(documentWidth<=viewport.width+1,`${label} horizontal overflow: ${documentWidth} > ${viewport.width}`);
            assert.ok(board.width>0&&board.height>0,`${label} board invalid`);
            assert.ok(board.width<=viewport.width+1,`${label} board wider than viewport`);

            for(const id of ['#chuntris-utility-ranking','#chuntris-utility-sound','#chuntris-utility-controls','#chuntris-pause']){
              assert.ok(await page.locator(id).isVisible(),`${label} utility missing: ${id}`);
            }

            if(viewport.width>1180){
              const [left,center,right]=await Promise.all([
                page.locator('.chuntris-left-panel').boundingBox(),
                page.locator('.chuntris-board-wrap').boundingBox(),
                page.locator('.chuntris-right-panel').boundingBox()
              ]);
              assert.ok(left&&center&&right,`${label} three-region layout missing`);
              assert.ok(left.x<center.x&&center.x<right.x,`${label} three-region order invalid`);
              assert.ok(center.width>=280,`${label} enlarged board unexpectedly narrow: ${center.width}`);
              const [hold,next,stats,reaction]=await Promise.all([
                page.locator('#chuntris-hold').boundingBox(),page.locator('#chuntris-next').boundingBox(),
                page.locator('.chuntris-stats').boundingBox(),page.locator('#chuntris-reaction').boundingBox()
              ]);
              assert.ok(hold&&next&&stats&&reaction,`${label} side content missing`);
              assert.ok(stats.y>hold.y,`${label} score not below HOLD`);
              assert.ok(reaction.y>next.y,`${label} reaction not below NEXT`);
            }

            await page.locator('#chuntris-utility-ranking').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'),'paused',`${label} ranking modal must auto-pause`);
            assert.ok(await page.locator('[data-chuntris-panel="ranking"]').isVisible(),`${label} ranking modal missing`);
            await page.locator('.chuntris-modal-close').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');

            await page.locator('#chuntris-pause').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'),'paused',`${label} manual pause failed`);
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(),`${label} pause panel missing`);
            await page.locator('[data-chuntris-panel="pause"] [data-chuntris-open="sound"]').click();
            assert.ok(await page.locator('[data-chuntris-panel="sound"]').isVisible(),`${label} sound panel missing`);
            await page.locator('.chuntris-modal-close').click();
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(),`${label} pause child must return to pause`);
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'),'paused',`${label} pause child must not resume`);
            await page.locator('#chuntris-pause-continue').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');

            await page.keyboard.press('Space');
            assert.ok(await page.locator('#chuntris-harddrop-fx').evaluate(el=>el.classList.contains('is-active')),`${label} hard-drop effect missing`);
            await page.evaluate(()=>window.ChuntrisApp.showClearEffect(4));
            assert.equal(await page.locator('#chuntris-clear-label').textContent(),'QUAD',`${label} QUAD label mismatch`);

            const reactionImage=await page.locator('#chuntris-reaction').evaluate(el=>getComputedStyle(el).backgroundImage);
            assert.match(reactionImage,/fl_preserve_transparency/,`${label} reaction must use alpha-preserving HD sprite`);
            assert.deepEqual(errors,[],`${label} page errors: ${errors.join(' | ')}`);
            console.log(`${label} passed: board=${board.width}x${board.height}`);
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              await verify(browser,{viewport:{width:1440,height:900}},'1440x900');
              await verify(browser,{viewport:{width:1024,height:768}},'1024x768');
              await verify(browser,{viewport:{width:390,height:844},isMobile:true,hasTouch:true},'390x844');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
