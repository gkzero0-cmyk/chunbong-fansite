name: One-shot content card race fix
on:
  push:
    branches: [fix/content-source-cards-and-collector-tabs-20261003]
    paths: ['.github/workflows/one-shot-content-card-race-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-source-cards-and-collector-tabs-20261003
      - name: Apply asserted source-card ownership fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return text.replace(old,new,1)

          p=Path('chunbong-posts-runtime.js')
          s=p.read_text()
          old="""function cardMarkup(row,index){
  const url=safeUrl(row.url),previewable=url&&sourceEligible(url),date=row.datePrecision==='unknown'||!row.date?'날짜 확인 중':row.date,type=TYPE_LABELS[row.type]||'게시글';
  return`<article class=\"archive-post-card\" data-archive-post-card data-source-url=\"${escapeHtml(url)}\"><div class=\"archive-post-card-head\"><span class=\"archive-post-index\">${String(index+1).padStart(2,'0')}</span><div class=\"archive-post-main\"><strong data-post-title>${escapeHtml(row.title||'게시글')}</strong><small>${escapeHtml(type)} · ${escapeHtml(date)}</small></div><div class=\"archive-post-actions\">${previewable?'<button type=\"button\" data-source-preview-toggle aria-expanded=\"false\">본문 펼치기</button>':''}${url?`<a data-source-external-link=\"true\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noreferrer noopener\">원문 보기 ↗</a>`:''}</div></div>${previewable?'<div class=\"archive-post-detail\" data-source-notice-detail hidden></div>':''}</article>`;
}"""
          new="""function cardMarkup(row,index){
  const url=safeUrl(row.url),previewable=url&&sourceEligible(url),known=row.datePrecision!=='unknown'&&Boolean(row.date),date=known?row.date:'날짜 확인 중',type=TYPE_LABELS[row.type]||'게시글',title=escapeHtml(row.title||'게시글');
  return`<article class=\"archive-post-card archive-source-card\" data-archive-post-card data-source-card=\"true\" data-source-url=\"${escapeHtml(url)}\"><div class=\"archive-post-card-head\"><span class=\"archive-post-index\">${String(index+1).padStart(2,'0')}</span><div class=\"archive-post-main\"><small>${escapeHtml(type)}</small>${previewable?`<button class=\"archive-post-title-toggle\" type=\"button\" data-source-title-toggle=\"true\" data-source-preview-toggle=\"true\" aria-expanded=\"false\"><span data-post-title data-source-title>${title}</span></button>`:`<strong data-post-title data-source-title>${title}</strong>`}<span class=\"archive-source-card-date${known?'':' is-unknown'}\" data-source-date=\"${known?escapeHtml(row.date):''}\">${escapeHtml(date)}</span></div><div class=\"archive-post-actions\">${url?`<a data-source-external-link=\"true\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noreferrer noopener\">원문 보기 ↗</a>`:''}</div></div>${previewable?'<div class=\"archive-post-detail archive-post-preview archive-source-card-body\" data-source-preview-body data-source-notice-detail hidden><div data-source-preview-content></div></div>':''}</article>`;
}"""
          s=once(s,old,new,'posts card markup')
          old="""  document.addEventListener('click',event=>{const toggle=event.target.closest?.('[data-source-preview-toggle]');if(toggle){event.preventDefault();event.stopPropagation();void toggleCard(toggle);return}if(event.target.closest?.('[data-archive-tab=\"posts\"]'))setTimeout(schedule,0)},true);"""
          new="""  document.addEventListener('click',event=>{if(event.target.closest?.('[data-archive-tab=\"posts\"]'))setTimeout(schedule,0)},true);"""
          s=once(s,old,new,'posts preview ownership')
          p.write_text(s)

          p=Path('content-source-card-unifier.js')
          s=p.read_text()
          s=once(s,"  detail.querySelectorAll('.archive-post-card').forEach(upgradePostCard);\n",'', 'posts unifier race')
          s=once(s,'data-source-preview-body hidden><div data-source-preview-content>','data-source-preview-body data-source-notice-detail hidden><div data-source-preview-content>','shared detail compatibility')
          s=once(s,"  if(text.includes('적자생존'))return true;\n  if(!text.includes('그냥서버'))return false;\n  if(/휴방|마병대|리캡|사자컴퍼니/.test(raw))return false;\n  const context=raw.replace(/그냥\\s*서버/gi,' ');\n  return /(입주|신청|모집|합격|섭주|운영자|불침번|서버|오픈|설명회|개발|작업|api|지통실|낚시|일정|접수|위키|공지|방송)/i.test(context);",
                 "  if(text.includes('적자생존'))return true;\n  return false;",
                 'client justserver strictness')
          p.write_text(s)

          p=Path('lib/chunbong-content-auto-ingest.js')
          s=p.read_text()
          s=once(s,"const JUSTSERVER_CONTEXT_RE=/(입주|신청|모집|합격|섭주|운영자|불침번|서버|오픈|설명회|개발|작업|api|지통실|낚시|일정|접수|위키|공지|방송)/i;\n",'', 'remove generic justserver context')
          old="""    const genericJustserver=item.series?.id==='justserver'&&search.includes('그냥서버');
    const justserverContext=rawSearch.replace(/그냥\\s*서버/gi,' ');
    const genericJustserverContext=genericJustserver&&JUSTSERVER_CONTEXT_RE.test(justserverContext);
    if(genericJustserverContext&&inWindow)score+=5;
    if(inWindow)score+=3;
    if(!matched.length&&!genericJustserverContext)continue;"""
          new="""    if(item.series?.id==='justserver'&&!matched.length)continue;
    if(inWindow)score+=3;
    if(!matched.length)continue;"""
          s=once(s,old,new,'server justserver strictness')
          p.write_text(s)

          p=Path('mobile-runtime-loader.js')
          s=p.read_text()
          s=once(s,"addScript('content-page-enhancements.js?v=8'","addScript('content-page-enhancements.js?v=9'",'enhancement cache')
          s=once(s,"addScript('chunbong-posts-runtime.js?v=1'","addScript('chunbong-posts-runtime.js?v=2'",'posts cache')
          s=once(s,"addStyle('content-source-card-unifier.css?v=1'","addStyle('content-source-card-unifier.css?v=2'",'source css cache')
          s=once(s,"addScript('content-source-card-unifier.js?v=1'","addScript('content-source-card-unifier.js?v=2'",'source runtime cache')
          p.write_text(s)

          p=Path('tests/chunbong-content-shared-ux-regression.mjs')
          s=p.read_text()
          s=once(s,"assert.match(runtime,/notice-card/,'linked posts must reuse the fan-site notice card UI');\nassert.match(runtime,/notice-toggle/,'linked posts must use the same expandable notice header pattern');\nassert.match(runtime,/notice-body/,'linked posts must render inside the existing notice body pattern');\n",
                 "assert.doesNotMatch(runtime,/insertAdjacentElement\\(['\\\"]afterend['\\\"]\\)/,'source previews must not create sibling cards');\nassert.match(runtime,/data-source-title-toggle/,'the source title itself must control expand/collapse');\nassert.match(runtime,/data-source-preview-body/,'linked posts must render inside the existing card body');\n",
                 'shared ux architecture')
          s=once(s,"assert.match(loader,/content-page-enhancements\\.js\\?v=7/,'content enhancement runtime version must refresh the SOOP body sanitizer');",
                 "assert.match(loader,/content-page-enhancements\\.js\\?v=9/,'content enhancement runtime version must refresh the unified source-card behavior');\nassert.match(loader,/content-source-card-unifier\\.js\\?v=2/,'timeline and source archive rows must load the unified source-card runtime');",
                 'shared ux loader version')
          p.write_text(s)
          PY
          node --check chunbong-posts-runtime.js
          node --check content-source-card-unifier.js
          node --check content-page-enhancements.js
          node --check lib/chunbong-content-auto-ingest.js
          node tests/content-relevance-regression.mjs
          node tests/content-unified-source-cards-regression.mjs || true
      - name: Update unified source-card regression cache expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/content-unified-source-cards-regression.mjs')
          s=p.read_text().replace("content-source-card-unifier\\.js\\?v=1","content-source-card-unifier\\.js\\?v=2")
          p.write_text(s)
          PY
          node tests/content-unified-source-cards-regression.mjs
          node tests/chunbong-content-shared-ux-regression.mjs
      - name: Commit source-card ownership fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chunbong-posts-runtime.js content-source-card-unifier.js lib/chunbong-content-auto-ingest.js mobile-runtime-loader.js tests/chunbong-content-shared-ux-regression.mjs tests/content-unified-source-cards-regression.mjs
          git diff --cached --check
          git commit -m 'fix: unify source-card ownership and relevance'
          git push origin HEAD:fix/content-source-cards-and-collector-tabs-20261003