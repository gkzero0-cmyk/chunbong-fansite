name: Apply SOOP collector diagnostics
on:
  push:
    branches:
      - fix/soop-collector-diagnostics-20261003
    paths:
      - .github/workflows/apply-soop-collector-diagnostics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soop-collector-diagnostics-20261003
      - name: Patch diagnostics
        run: python .github/scripts/apply-soop-collector-diagnostics.py
      - name: Remove temporary patch files and commit
        run: |
          rm .github/workflows/apply-soop-collector-diagnostics.yml
          rm .github/scripts/apply-soop-collector-diagnostics.py
          git config user.name "gkzero0-cmyk"
          git config user.email "gkzero0@gmail.com"
          git add chunbong-content-collector.user.js lib/chunbong-content-archive-api.js api/content.js .github/workflows/apply-soop-collector-diagnostics.yml .github/scripts/apply-soop-collector-diagnostics.py
          git commit -m "feat: add privacy-safe SOOP collector diagnostics"
          git push origin HEAD:fix/soop-collector-diagnostics-20261003
