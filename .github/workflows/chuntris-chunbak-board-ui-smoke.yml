name: Chuntris Chunbak board UI browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'chuntris.html'
      - 'chuntris.js'
      - 'minigame-multiplayer.css'
      - 'chuntris-multiplayer.js'
      - 'chuntris-engine.js'
      - 'chuntris-board-start-ui.css'
      - 'chunbak.html'
      - 'chunbak.js'
      - 'chunbak.css'
      - 'chungwagame.html'
      - 'chungwagame.js'
      - 'minigame-multiplayer.js'
      - 'score-race-multiplayer.js'
      - 'chunbak-board-start-ui.css'
      - '.github/workflows/chuntris-chunbak-board-ui-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/board-ui-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/chuntris.html >/dev/null && curl -fsS http://127.0.0.1:4173/chunbak.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/board-ui-http.log
          exit 1
      - name: Verify local Chuntris multiplayer mode and difficulty matrix
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          const modes=['classic','sprint40','score180'];
          const difficulties=['normal','hard','extreme'];
          try{
            for(const mode of modes){
              for(const difficulty of difficulties){
                const page=await browser.newPage({viewport:{width:1280,height:800}});
                let requested=null;
                let room={
                  code:'ABC234',game:'chuntris',mode,difficulty,seed:123456,round:1,state:'waiting',startAt:null,winnerId:null,
                  players:[
                    {id:'p1',nickname:'로컬A',ready:false,score:0,lines:0,timeMs:0,status:'waiting',finished:false,finishedAt:null,rematch:false},
                    {id:'p2',nickname:'로컬B',ready:false,score:0,lines:0,timeMs:0,status:'waiting',finished:false,finishedAt:null,rematch:false}
                  ],
                  selfId:'p1',serverNow:Date.now()
                };
                await page.route('**/api/content?type=minigame-multiplayer**',async route=>{
                  const req=route.request();
                  if(req.method()==='GET'){
                    room.serverNow=Date.now();
                    await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({room})});return;
                  }
                  const body=JSON.parse(req.postData()||'{}');
                  if(body.action==='create'){
                    requested={mode:body.mode,difficulty:body.difficulty};
                    room={...room,mode:body.mode,difficulty:body.difficulty,selfId:'p1',serverNow:Date.now()};
                    await route.fulfill({status:201,contentType:'application/json',body:JSON.stringify({token:'token-a',room})});return;
                  }
                  if(body.action==='ready'){
                    room={...room,state:'countdown',startAt:Date.now()+200,serverNow:Date.now(),players:room.players.map(player=>({...player,ready:true}))};
                    await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({room})});return;
                  }
                  if(body.action==='progress'){
                    room={...room,state:'playing',serverNow:Date.now()};
                    await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({room})});return;
                  }
                  await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({room})});
                });

                await page.goto(process.env.BASE_URL+'/chuntris.html?_local_mp='+mode+'_'+difficulty,{waitUntil:'domcontentloaded'});
                await page.waitForFunction(()=>Boolean(window.ChuntrisApp?.startMultiplayer&&window.MinigameMultiplayer));
                await page.locator('[data-chuntris-multiplayer]').click();
                await page.locator('[data-mp-nickname]').fill('로컬멀티');
                await page.locator('[data-mp-chuntris-mode="'+mode+'"]').click();
                await page.locator('[data-mp-chuntris-difficulty="'+difficulty+'"]').click();
                await page.locator('[data-mp-create]').click();
                await page.waitForFunction(()=>document.querySelector('[data-mp-room-code]')?.textContent?.trim()==='ABC234');
                assert.deepEqual(requested,{mode,difficulty});
                const roomLabel=await page.locator('[data-mp-room-mode]').innerText();
                assert.match(roomLabel,new RegExp(mode==='classic'?'클래식':mode==='sprint40'?'40줄':'3분'));
                assert.match(roomLabel,new RegExp(difficulty==='normal'?'노말':difficulty==='hard'?'하드':'익스트림'));
                await page.locator('[data-mp-ready]').click();
                await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing',{timeout:5000});
                assert.equal(await page.locator('#chuntris-game').getAttribute('data-mode'),mode);
                assert.equal(await page.locator('#chuntris-game').getAttribute('data-difficulty'),difficulty);
                await page.close();
              }
            }
          }finally{await browser.close();}
          EOF_NODE

      - name: Verify seeded Chunbak and Chungwagame starts
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          try{
            const seed=246813579;

            const bakA=await browser.newPage({viewport:{width:900,height:800}});
            const bakB=await browser.newPage({viewport:{width:900,height:800}});
            await Promise.all([
              bakA.goto(process.env.BASE_URL+'/chunbak.html?_seed=a',{waitUntil:'domcontentloaded'}),
              bakB.goto(process.env.BASE_URL+'/chunbak.html?_seed=b',{waitUntil:'domcontentloaded'})
            ]);
            await Promise.all([
              bakA.waitForFunction(()=>Boolean(window.ChunbakGame&&window.MinigameMultiplayer)),
              bakB.waitForFunction(()=>Boolean(window.ChunbakGame&&window.MinigameMultiplayer))
            ]);
            const bakStateA=await bakA.evaluate(seed=>{
              window.ChunbakGame.resetGame({autoStart:false,random:window.MinigameMultiplayer.seededRandom(seed)});
              return window.ChunbakGame.getDebugState();
            },seed);
            const bakStateB=await bakB.evaluate(seed=>{
              window.ChunbakGame.resetGame({autoStart:false,random:window.MinigameMultiplayer.seededRandom(seed)});
              return window.ChunbakGame.getDebugState();
            },seed);
            assert.equal(bakStateA.currentStage,bakStateB.currentStage,'Chunbak seeded current stage mismatch');
            assert.equal(bakStateA.nextStage,bakStateB.nextStage,'Chunbak seeded next stage mismatch');
            await bakA.close();await bakB.close();

            const gwaA=await browser.newPage({viewport:{width:1100,height:800}});
            const gwaB=await browser.newPage({viewport:{width:1100,height:800}});
            await Promise.all([
              gwaA.goto(process.env.BASE_URL+'/chungwagame.html?_seed=a',{waitUntil:'domcontentloaded'}),
              gwaB.goto(process.env.BASE_URL+'/chungwagame.html?_seed=b',{waitUntil:'domcontentloaded'})
            ]);
            await Promise.all([
              gwaA.waitForFunction(()=>Boolean(window.ChungwagameApp&&window.MinigameMultiplayer)),
              gwaB.waitForFunction(()=>Boolean(window.ChungwagameApp&&window.MinigameMultiplayer))
            ]);
            const valuesA=await gwaA.evaluate(seed=>{
              window.ChungwagameApp.startGame({random:window.MinigameMultiplayer.seededRandom(seed)});
              return [...document.querySelectorAll('.cg-fruit-shape')].slice(0,60).map(node=>node.dataset.value);
            },seed);
            const valuesB=await gwaB.evaluate(seed=>{
              window.ChungwagameApp.startGame({random:window.MinigameMultiplayer.seededRandom(seed)});
              return [...document.querySelectorAll('.cg-fruit-shape')].slice(0,60).map(node=>node.dataset.value);
            },seed);
            assert.deepEqual(valuesA,valuesB,'Chungwagame seeded board mismatch');
            await gwaA.close();await gwaB.close();
          }finally{
            await browser.close();
          }
          EOF_NODE
      - name: Verify board-sized starts countdown and viewport fit
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          const viewports=[
            {width:1440,height:900},
            {width:1280,height:720},
            {width:1024,height:768},
            {width:900,height:800},
            {width:390,height:844},
            {width:360,height:800}
          ];

          function insideViewport(box,viewport,label){
            assert.ok(box,`${label} missing`);
            assert.ok(box.x>=-1,`${label} clips left`);
            assert.ok(box.x+box.width<=viewport.width+1,`${label} clips right: ${box.x+box.width} > ${viewport.width}`);
            assert.ok(box.y>=-1,`${label} clips top`);
            assert.ok(box.y+box.height<=viewport.height+2,`${label} clips bottom: ${box.y+box.height} > ${viewport.height}`);
          }

          async function verifyChuntris(viewport){
            const mobile=viewport.width<=390;
            const page=await browser.newPage({viewport,isMobile:mobile,hasTouch:mobile});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${process.env.BASE_URL}/chuntris.html?_smoke=${Date.now()}`,{waitUntil:'networkidle'});
            await page.waitForFunction(()=>Boolean(window.ChuntrisApp));
            const startCard=page.locator('.chuntris-start-card');
            assert.ok(await startCard.isVisible(),'Chuntris start card missing');
            const startBox=await startCard.boundingBox();
            insideViewport(startBox,viewport,'Chuntris start card');
            assert.ok(Math.abs((startBox.height/startBox.width)-2)<0.04,`Chuntris start card ratio mismatch: ${startBox.width}x${startBox.height}`);
            assert.ok(await page.locator('#chuntris-mode-classic').isVisible(),'classic mode missing');
            assert.ok(await page.locator('#chuntris-mode-sprint40').isVisible(),'sprint mode missing');
            assert.equal(await page.locator('#chuntris-start').isVisible(),false,'start button must stay hidden before difficulty selection');
            for(const selector of ['[data-chuntris-open="ranking"]','[data-chuntris-open="sound"]','[data-chuntris-open="controls"]']){
              assert.ok(await page.locator(`.chuntris-start-utils ${selector}`).isVisible(),`start utility missing: ${selector}`);
            }
            assert.ok((await startCard.evaluate(el=>el.scrollHeight<=el.clientHeight+1)),'Chuntris mode step overflows board-sized card');

            const startScrollY=await page.evaluate(()=>window.scrollY);
            await page.locator('#chuntris-mode-classic').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-difficulty','Chuntris did not enter difficulty selection');
            assert.ok(await page.locator('#chuntris-difficulty-step').isVisible(),'difficulty step missing');
            assert.ok(await page.locator('[data-chuntris-difficulty="normal"]').isVisible(),'normal difficulty missing');
            assert.ok(await page.locator('#chuntris-start').isVisible(),'start button must be visible with the default normal difficulty');
            assert.ok((await startCard.evaluate(el=>el.scrollHeight<=el.clientHeight+1)),'Chuntris difficulty step overflows board-sized card');

            await page.locator('[data-chuntris-difficulty="normal"]').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-player','Chuntris did not enter final start step');
            assert.ok(await page.locator('#chuntris-player-step').isVisible(),'final start step missing');
            assert.ok(await page.locator('#chuntris-start').isVisible(),'start button missing after difficulty selection');
            assert.ok((await startCard.evaluate(el=>el.scrollHeight<=el.clientHeight+1)),'Chuntris final start step overflows board-sized card');

            await page.locator('#chuntris-start').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'countdown','Chuntris did not enter countdown state');
            assert.ok(await page.locator('#chuntris-countdown').isVisible(),'countdown layer missing');
            assert.equal((await page.locator('#chuntris-countdown-value').textContent())?.trim(),'3','countdown must start at 3');
            assert.notEqual(await page.evaluate(()=>window.ChuntrisApp.getGame().getSnapshot().status),'playing','engine started before countdown');

            await page.waitForFunction(()=>document.querySelector('#chuntris-countdown-value')?.textContent?.trim()==='2',{timeout:1800});
            await page.waitForFunction(()=>document.querySelector('#chuntris-countdown-value')?.textContent?.trim()==='1',{timeout:1800});
            await page.waitForFunction(()=>window.ChuntrisApp.getGame().getSnapshot().status==='playing',{timeout:2500});
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'playing','play view did not start after countdown');
            await page.waitForTimeout(420);
            const playScrollY=await page.evaluate(()=>window.scrollY);
            assert.ok(Math.abs(playScrollY-startScrollY)<=1,`Chuntris transition changed scrollY: ${startScrollY} -> ${playScrollY}`);

            const boardBox=await page.locator('.chuntris-board-wrap').boundingBox();
            insideViewport(boardBox,viewport,'Chuntris play board');
            assert.ok(Math.abs(startBox.width-boardBox.width)<=3,`Chuntris start/play widths differ: ${startBox.width} vs ${boardBox.width}`);
            assert.ok(Math.abs(startBox.y-boardBox.y)<=2,`Chuntris start/play top positions differ: ${startBox.y} vs ${boardBox.y}`);
            assert.ok(Math.abs((boardBox.height/boardBox.width)-2)<0.04,'Chuntris board ratio changed');
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'Chuntris horizontal overflow');

            await page.locator('#chuntris-pause').click();
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(),'Chuntris pause panel missing');
            const ctPauseReturn=page.locator('[data-chuntris-panel="pause"] .chuntris-return-link');
            assert.ok(await ctPauseReturn.isVisible(),'Chuntris pause return-to-minigames link missing');
            assert.equal(await ctPauseReturn.getAttribute('href'),'minigames.html');
            await page.locator('#chuntris-pause-continue').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');

            await page.evaluate(()=>{
              const game=window.ChuntrisApp.getGame();
              game.state.status='gameover';
              window.ChuntrisApp.render();
            });
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='gameover');
            const ctGameOverReturn=page.locator('#chuntris-overlay .chuntris-return-link');
            assert.ok(await ctGameOverReturn.isVisible(),'Chuntris game-over return-to-minigames link missing');
            assert.equal(await ctGameOverReturn.getAttribute('href'),'minigames.html');

            assert.deepEqual(errors,[],`Chuntris page errors: ${errors.join(' | ')}`);
            await page.close();
          }

          async function verifyChunbak(viewport){
            const mobile=viewport.width<=390;
            const page=await browser.newPage({viewport,isMobile:mobile,hasTouch:mobile});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${process.env.BASE_URL}/chunbak.html?_smoke=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.ChunbakGame));
            await page.waitForFunction(()=>!document.querySelector('#chunbak-start')?.disabled);
            await page.waitForFunction(()=>getComputedStyle(document.querySelector('#chunbak-game')).transform==='none');

            const startCard=page.locator('.chunbak-start-card');
            assert.ok(await startCard.isVisible(),'Chunbak start card missing');
            const startBox=await startCard.boundingBox();
            insideViewport(startBox,viewport,'Chunbak start card');
            assert.ok(Math.abs((startBox.height/startBox.width)-(680/420))<0.04,`Chunbak start card ratio mismatch: ${startBox.width}x${startBox.height}`);
            assert.ok(await page.locator('#chunbak-start').isVisible(),'Chunbak start button missing');
            for(const selector of ['[data-chunbak-open="ranking"]','[data-chunbak-open="sound"]','[data-chunbak-open="controls"]']){
              assert.ok(await page.locator(`.chunbak-start-utils ${selector}`).isVisible(),`Chunbak start utility missing: ${selector}`);
            }
            assert.ok((await startCard.evaluate(el=>el.scrollHeight<=el.clientHeight+1)),'Chunbak start UI overflows board-sized card');

            await page.locator('#chunbak-start').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');
            const stageBox=await page.locator('#chunbak-stage').boundingBox();
            insideViewport(stageBox,viewport,'Chunbak play stage');
            assert.ok(Math.abs(startBox.width-stageBox.width)<=3,`Chunbak start/play widths differ: ${startBox.width} vs ${stageBox.width}`);
            assert.ok(Math.abs(startBox.y-stageBox.y)<=2,`Chunbak start/play top positions differ: ${startBox.y} vs ${stageBox.y}`);
            assert.ok(Math.abs((stageBox.height/stageBox.width)-(680/420))<0.04,'Chunbak play stage ratio changed');
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'Chunbak horizontal overflow');

            await page.evaluate(()=>window.scrollTo(0,0));
            await page.locator('#chunbak-pause').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='paused');
            const cbPauseReturn=page.locator('[data-chunbak-panel="pause"] .chunbak-return-link');
            assert.ok(await cbPauseReturn.isVisible(),'Chunbak pause return-to-minigames link missing');
            assert.equal(await cbPauseReturn.getAttribute('href'),'minigames.html');
            await page.locator('[data-chunbak-action="resume"]').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');

            await page.evaluate(()=>window.ChunbakGame.setGameOver());
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='gameover');
            const cbGameOverReturn=page.locator('#chunbak-overlay .chunbak-return-link');
            assert.ok(await cbGameOverReturn.isVisible(),'Chunbak game-over return-to-minigames link missing');
            assert.equal(await cbGameOverReturn.getAttribute('href'),'minigames.html');

            assert.deepEqual(errors,[],`Chunbak page errors: ${errors.join(' | ')}`);
            await page.close();
          }

          try{
            for(const viewport of viewports){
              await verifyChuntris(viewport);
              await verifyChunbak(viewport);
            }
          }finally{
            await browser.close();
          }
          EOF_NODE
