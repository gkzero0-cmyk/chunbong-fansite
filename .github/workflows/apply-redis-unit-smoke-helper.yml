name: Apply Redis unit smoke helper
on:
  push:
    branches:
      - chore/redis-unit-smoke-patch-20260930
    paths:
      - .github/workflows/apply-redis-unit-smoke-helper.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/redis-unit-smoke-patch-20260930
          fetch-depth: 0
      - name: Update browser smoke expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/operator-center-browser-smoke.yml')
          s=p.read_text()
          pairs={
            "assert.equal((await page.locator('#system-redis-monthly-used').textContent())?.trim(),'327,412 / 500,000');":"assert.equal((await page.locator('#system-redis-monthly-used').textContent())?.trim(),'327,412회');",
            "assert.equal((await page.locator('#system-redis-monthly-remaining').textContent())?.trim(),'172,588회');":"assert.equal((await page.locator('#system-redis-monthly-remaining').textContent())?.trim(),'정확 계산 불가');",
            "assert.equal((await page.locator('#system-redis-monthly-pct').textContent())?.trim(),'65.5%');":"assert.equal((await page.locator('#system-redis-monthly-pct').textContent())?.trim(),'계산 안 함');"
          }
          for old,new in pairs.items():
              if s.count(old)!=1: raise SystemExit(f'expected one match for {old}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit smoke update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/operator-center-browser-smoke.yml
          git commit -m 'test: align Redis usage smoke with request-command units'
          git push origin HEAD:chore/redis-unit-smoke-patch-20260930
