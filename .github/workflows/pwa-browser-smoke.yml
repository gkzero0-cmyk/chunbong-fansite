name: PWA browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline.html'
      - 'page.js'
      - 'site-quality.css'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'assets/app-icon.*'
      - 'vercel.json'
      - 'tests/pwa-regression.mjs'
      - '.github/workflows/pwa-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static regression
        run: node tests/pwa-regression.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pwa-site.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pwa-site.log
          exit 1
      - name: Verify install metadata, service worker, and offline fallback
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));

          await page.goto(process.env.BASE_URL + '/index.html', { waitUntil: 'networkidle' });
          assert.equal(await page.locator('link[rel="manifest"]').getAttribute('href'), '/manifest.webmanifest');
          await page.waitForFunction(async () => {
            if (!('serviceWorker' in navigator)) return false;
            const registration = await navigator.serviceWorker.ready;
            return Boolean(registration?.active);
          }, null, { timeout: 10000 });

          await page.reload({ waitUntil: 'networkidle' });
          await page.waitForFunction(() => Boolean(navigator.serviceWorker.controller), null, { timeout: 10000 });

          const scope = await page.evaluate(async () => (await navigator.serviceWorker.ready).scope);
          assert.ok(scope.endsWith('/'));

          await context.setOffline(true);
          await page.goto(process.env.BASE_URL + '/offline-check-not-cached.html', { waitUntil: 'domcontentloaded' });
          assert.match(await page.locator('body').innerText(), /오프라인 상태입니다/);
          assert.equal(errors.length, 0, errors.join('\n'));

          await context.setOffline(false);
          await browser.close();
          EOF_NODE
