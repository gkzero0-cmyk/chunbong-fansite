name: Chunbak bootstrap assets

on:
  push:
    branches: [feat/chunbak-minigame-20260917]
    paths:
      - '.github/workflows/chunbak-bootstrap-assets.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbak-minigame-20260917
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser for temporary asset download
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Download uploaded Chunbak source ZIP
        env:
          SHARE_URL: https://firestorage.ai/ja/f/oHrXQoSZ0MGl
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto(process.env.SHARE_URL, {waitUntil:'networkidle', timeout:120000});
          const candidates = [
            page.getByText('춘박게임(1).zip', {exact:false}),
            page.locator('a').filter({hasText:'.zip'}),
            page.locator('button').filter({hasText:'.zip'})
          ];
          let target = null;
          for (const candidate of candidates) {
            if (await candidate.count()) { target = candidate.first(); break; }
          }
          if (!target) throw new Error('ZIP download control not found on firestorage share page');
          const downloadPromise = page.waitForEvent('download', {timeout:120000});
          await target.click();
          const download = await downloadPromise;
          await download.saveAs('/tmp/chunbak.zip');
          await browser.close();
          const stat = fs.statSync('/tmp/chunbak.zip');
          if (stat.size < 7_000_000) throw new Error(`unexpected ZIP size: ${stat.size}`);
          EOF_NODE
          unzip -t /tmp/chunbak.zip

      - name: Install exact 1-11 stage PNGs
        run: |
          rm -rf /tmp/chunbak-source assets/chunbak
          mkdir -p /tmp/chunbak-source assets/chunbak
          unzip -j /tmp/chunbak.zip -d /tmp/chunbak-source
          for n in $(seq 1 11); do
            test -f "/tmp/chunbak-source/${n}단계.png"
            cp "/tmp/chunbak-source/${n}단계.png" "assets/chunbak/${n}.png"
          done
          python - <<'PY'
          import pathlib, struct
          for n in range(1, 12):
              p = pathlib.Path(f'assets/chunbak/{n}.png')
              data = p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', p
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == (1254, 1254), (p, width, height)
              assert len(data) > 10000, (p, len(data))
              print(p, width, height, len(data))
          PY

      - name: Vendor Matter.js 0.20.0 locally
        run: |
          mkdir -p assets/vendor
          curl -L --fail --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/liabru/matter-js/0.20.0/build/matter.min.js \
            -o assets/vendor/matter-0.20.0.min.js
          test "$(wc -c < assets/vendor/matter-0.20.0.min.js)" -gt 70000
          grep -q 'matter-js 0.20.0' assets/vendor/matter-0.20.0.min.js
          ! grep -q 'cdnjs.cloudflare.com' assets/vendor/matter-0.20.0.min.js
          ! grep -q 'document.write' assets/vendor/matter-0.20.0.min.js

      - name: Verify asset contracts before commit
        run: |
          node tests/chunbak-assets-regression.mjs
          node tests/chunbak-asset-vendor-regression.mjs
          node tests/chunbak-asset-gate-regression.mjs
          node tests/chunbak-a-danger-tracker-regression.mjs

      - name: Commit verified assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chunbak assets/vendor/matter-0.20.0.min.js
          if git diff --cached --quiet; then
            echo 'Assets already up to date.'
            exit 0
          fi
          git commit -m 'feat: add Chunbak stage assets and vendor Matter.js'
          git push origin HEAD:feat/chunbak-minigame-20260917
