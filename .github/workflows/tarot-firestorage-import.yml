name: Tarot Firestorage import

on:
  push:
    branches: ['fix/tarot-original-art-centered-numbers']
    paths: ['.github/workflows/tarot-firestorage-import.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Inspect firestorage download URLs
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ acceptDownloads: true });
            await page.goto('https://firestorage.ai/ja/f/NXaEyykYgfuX', { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForFunction(() => document.body.innerText.includes('保存ファイル 6件'), null, { timeout: 30000 });
            const buttons = page.getByRole('button', { name: 'ダウンロード', exact: true });
            const count = await buttons.count();
            console.log(`DOWNLOAD_BUTTONS=${count}`);
            for (let index = 0; index < count; index += 1) {
              const [download] = await Promise.all([
                page.waitForEvent('download', { timeout: 30000 }),
                buttons.nth(index).click()
              ]);
              console.log(`DOWNLOAD_${index}_NAME=${download.suggestedFilename()}`);
              console.log(`DOWNLOAD_${index}_URL=${download.url()}`);
              await download.cancel();
            }
            await browser.close();
            process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
