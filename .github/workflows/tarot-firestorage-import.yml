name: Tarot Firestorage import

on:
  push:
    branches: ['fix/tarot-original-art-centered-numbers']
    paths: ['.github/workflows/tarot-firestorage-import.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect firestorage download client
        run: |
          set -euo pipefail
          BASE='https://firestorage.ai'
          SHARE="$BASE/ja/f/NXaEyykYgfuX"
          curl -L -sS "$SHARE" -o /tmp/share.html
          CHUNK=$(grep -Eo '/_next/static/chunks/app/\(files\)/ja/f/page-[a-z0-9]+\.js' /tmp/share.html | head -1)
          echo "CHUNK=$CHUNK"
          test -n "$CHUNK"
          curl -L -sS "$BASE$CHUNK" -o /tmp/page.js
          echo "CHUNK_BYTES=$(wc -c </tmp/page.js)"
          echo '=== API/download markers ==='
          grep -Eo '.{0,180}(fetch\(|/api/|download|shareId|fileId|file_id|publicId|signed|presign).{0,260}' /tmp/page.js | head -160 || true
          exit 1
