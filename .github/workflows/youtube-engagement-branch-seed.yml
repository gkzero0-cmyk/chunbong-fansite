name: YouTube engagement branch seed

on:
  push:
    branches: [feat/youtube-engagement-rankings]
    paths:
      - '.github/workflows/youtube-engagement-branch-seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect complete YouTube engagement cache
        run: node scripts/update-youtube-engagement-cache.mjs
      - name: Verify and commit cache
        run: |
          node <<'NODE'
          const cache = require('./data/youtube-engagement-cache.json');
          const items = Array.isArray(cache.items) ? cache.items : [];
          const views = items.filter(item => Number.isFinite(item.viewCount)).length;
          const comments = items.filter(item => Number.isFinite(item.commentCount)).length;
          const published = items.filter(item => /^20\d{2}-\d{2}-\d{2}/.test(String(item.publishedAt || ''))).length;
          console.log(JSON.stringify({ itemCount: items.length, views, comments, published, capturedAt: cache.capturedAt }, null, 2));
          if (!(items.length >= 150 && views > 0 && comments > 0 && published > 0)) process.exit(1);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/youtube-engagement-cache.json
          git commit -m 'data: seed YouTube engagement cache'
          git push origin HEAD:feat/youtube-engagement-rankings
