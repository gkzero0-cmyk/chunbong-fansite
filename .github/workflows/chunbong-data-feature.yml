name: Chunbong data feature tests

on:
  push:
    branches: [feat/chunbong-data-dashboard]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply data navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = ['index.html','schedule.html','notice.html','vod.html','clips.html','fanart.html','tarot.html','youtube.html']
          youtube_link = '<a data-nav="youtube" href="youtube.html">유튜브</a>'
          data_link = '<a data-nav="data" href="data.html">춘봉 데이터</a>'
          for name in pages:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if data_link not in text:
                  if youtube_link not in text:
                      raise SystemExit(f'{name}: youtube nav marker missing')
                  text = text.replace(youtube_link, youtube_link + data_link, 1)
                  path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if '08 / DATA' not in text:
              marker = '</div><div class="official-strip reveal">'
              if marker not in text:
                  raise SystemExit('index.html: portal marker missing')
              card = '<a class="portal-card reveal" href="data.html"><small>08 / DATA</small><strong>춘봉 데이터</strong><p>SOOP 방송 활동과 춘봉TV 공개 지표를 한눈에 확인합니다.</p><b>→</b></a>'
              text = text.replace(marker, card + marker, 1)
              index.write_text(text, encoding='utf-8')
          PY
      - name: Target regressions
        run: |
          set -e
          node tests/chunbong-data-api-regression.mjs
          node tests/chunbong-data-snapshot-regression.mjs
          node tests/chunbong-data-ui-regression.mjs
      - name: Commit navigation changes
        run: |
          if git diff --quiet -- '*.html'; then
            echo 'No navigation changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html schedule.html notice.html vod.html clips.html fanart.html tarot.html youtube.html
          git commit -m 'chore: apply data navigation'
          git push
