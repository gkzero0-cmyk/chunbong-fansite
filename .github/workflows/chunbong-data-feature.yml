name: Chunbong data feature tests

on:
  push:
    branches: [feat/chunbong-data-dashboard]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Keep data aggregation outside Vercel api functions
        run: |
          python - <<'PY'
          from pathlib import Path
          api_path = Path('api/chunbong-data.js')
          lib_path = Path('lib/chunbong-data.js')
          if api_path.exists():
              text = api_path.read_text(encoding='utf-8')
              replacements = {
                  "require('./vod')": "require('../api/vod')",
                  "require('./clips')": "require('../api/clips')",
                  "require('./youtube')": "require('../api/youtube')",
                  "require('./_shared')": "require('../api/_shared')",
              }
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'missing import marker: {old}')
                  text = text.replace(old, new, 1)
              lib_path.parent.mkdir(parents=True, exist_ok=True)
              lib_path.write_text(text, encoding='utf-8')
              api_path.unlink()

          content = Path('api/content.js')
          text = content.read_text(encoding='utf-8')
          text = text.replace("require('./chunbong-data')", "require('../lib/chunbong-data')")
          content.write_text(text, encoding='utf-8')

          test = Path('tests/chunbong-data-api-regression.mjs')
          text = test.read_text(encoding='utf-8')
          text = text.replace("require('../api/chunbong-data.js')", "require('../lib/chunbong-data.js')")
          test.write_text(text, encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          set -e
          node --check data.js
          node --check lib/chunbong-data.js
          node --check scripts/update-chunbong-data.mjs
          for file in api/*.js; do node --check "$file"; done
      - name: Run all regressions
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "=== $file ==="
            node "$file"
            count=$((count + 1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit Vercel function-limit fix
        run: |
          if git diff --quiet -- api/content.js api/chunbong-data.js lib/chunbong-data.js tests/chunbong-data-api-regression.mjs; then
            echo 'Aggregation already outside api directory'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A api/chunbong-data.js api/content.js lib/chunbong-data.js tests/chunbong-data-api-regression.mjs
            git commit -m 'fix: keep data aggregation outside Vercel functions'
            git push
          fi
      - name: Verify Vercel preview data page and API
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite-git-feat-chunbong-data-dashboard-gkzero0-9465.vercel.app'
          for attempt in $(seq 1 60); do
            PAGE_HTTP=$(curl -L -sS -o /tmp/data-page -w '%{http_code}' "$BASE/data.html" || true)
            API_HTTP=$(curl -L -sS -o /tmp/data-api -w '%{http_code}' "$BASE/api/content?type=data" || true)
            if [ "$PAGE_HTTP" = '200' ] && [ "$API_HTTP" = '200' ] && grep -q 'id="data-summary-grid"' /tmp/data-page; then
              if node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/data-api', 'utf8'));
          if (!payload || typeof payload !== 'object') process.exit(1);
          if (!payload.capturedAt || !payload.soop || !payload.youtube || !payload.topContent) process.exit(1);
          if (!Array.isArray(payload.errors) || !Array.isArray(payload.trends)) process.exit(1);
          if (payload.fallback !== false) process.exit(1);
          console.log(`PREVIEW_CAPTURED_AT=${payload.capturedAt}`);
          console.log(`PREVIEW_SOOP_VOD=${payload.soop.recentVod?.length || 0}`);
          console.log(`PREVIEW_YOUTUBE_VIDEOS=${payload.youtube.recentVideos?.length || 0}`);
          console.log(`PREVIEW_ERRORS=${payload.errors.length}`);
          NODE
              then
                echo "PREVIEW_READY=1"
                exit 0
              fi
            fi
            echo "PREVIEW_WAIT=$attempt PAGE=$PAGE_HTTP API=$API_HTTP"
            sleep 5
          done
          echo 'PREVIEW_READY=0'
          exit 1
