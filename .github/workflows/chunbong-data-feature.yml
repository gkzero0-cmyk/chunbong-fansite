name: Chunbong data feature tests

on:
  push:
    branches: [feat/chunbong-data-dashboard]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair data history bundling
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/chunbong-data.js')
          text = path.read_text(encoding='utf-8')
          if "const fs = require('node:fs');" in text:
              old_head = "const fs = require('node:fs');\nconst path = require('node:path');\n"
              new_head = "const snapshotHistory = require('../data/chunbong-data-history.json');\n"
              if old_head not in text:
                  raise SystemExit('dynamic fs/path imports not found')
              text = text.replace(old_head, new_head, 1)
              old_const = "const HISTORY_PATH = path.join(__dirname, '..', 'data', 'chunbong-data-history.json');\n"
              if old_const not in text:
                  raise SystemExit('HISTORY_PATH not found')
              text = text.replace(old_const, '', 1)
              old_fn = "function readSnapshotHistory() {\n  try {\n    const parsed = JSON.parse(fs.readFileSync(HISTORY_PATH, 'utf8'));\n    return parsed && Array.isArray(parsed.snapshots) ? parsed : { version: 1, snapshots: [] };\n  } catch (_) {\n    return { version: 1, snapshots: [] };\n  }\n}\n"
              new_fn = "function readSnapshotHistory() {\n  return snapshotHistory && Array.isArray(snapshotHistory.snapshots)\n    ? snapshotHistory\n    : { version: 1, snapshots: [] };\n}\n"
              if old_fn not in text:
                  raise SystemExit('dynamic readSnapshotHistory implementation not found')
              text = text.replace(old_fn, new_fn, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          set -e
          node --check data.js
          node --check api/chunbong-data.js
          node --check scripts/update-chunbong-data.mjs
          for file in api/*.js; do node --check "$file"; done
      - name: Run all regressions
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "=== $file ==="
            node "$file"
            count=$((count + 1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Commit bundle repair
        run: |
          if git diff --quiet -- api/chunbong-data.js; then
            echo 'Bundle already static'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api/chunbong-data.js
            git commit -m 'fix: statically bundle data history'
            git push
          fi
      - name: Verify Vercel preview data page and API
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite-git-feat-chunbong-data-dashboard-gkzero0-9465.vercel.app'
          for attempt in $(seq 1 60); do
            PAGE_HTTP=$(curl -L -sS -o /tmp/data-page -w '%{http_code}' "$BASE/data.html" || true)
            API_HTTP=$(curl -L -sS -o /tmp/data-api -w '%{http_code}' "$BASE/api/content?type=data" || true)
            if [ "$PAGE_HTTP" = '200' ] && [ "$API_HTTP" = '200' ] && grep -q 'id="data-summary-grid"' /tmp/data-page; then
              if node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/data-api', 'utf8'));
          if (!payload || typeof payload !== 'object') process.exit(1);
          if (!payload.capturedAt || !payload.soop || !payload.youtube || !payload.topContent) process.exit(1);
          if (!Array.isArray(payload.errors) || !Array.isArray(payload.trends)) process.exit(1);
          if (payload.fallback !== false) process.exit(1);
          console.log(`PREVIEW_CAPTURED_AT=${payload.capturedAt}`);
          console.log(`PREVIEW_SOOP_VOD=${payload.soop.recentVod?.length || 0}`);
          console.log(`PREVIEW_YOUTUBE_VIDEOS=${payload.youtube.recentVideos?.length || 0}`);
          console.log(`PREVIEW_ERRORS=${payload.errors.length}`);
          NODE
              then
                echo "PREVIEW_READY=1"
                exit 0
              fi
            fi
            echo "PREVIEW_WAIT=$attempt PAGE=$PAGE_HTTP API=$API_HTTP"
            sleep 5
          done
          echo 'PREVIEW_READY=0'
          exit 1
