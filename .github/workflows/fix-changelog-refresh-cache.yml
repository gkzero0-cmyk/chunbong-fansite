name: Fix changelog refresh cache

on:
  push:
    branches: [improve/observability-ci-round3-20261001]
    paths:
      - 'scripts/fix-changelog-refresh-cache.mjs'
      - '.github/workflows/fix-changelog-refresh-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-changelog-refresh-cache
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/observability-ci-round3-20261001
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/fix-changelog-refresh-cache.mjs
      - run: node --check changelog.js
      - name: Commit product fix
        shell: bash
        run: |
          set -euo pipefail
          git add changelog.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bypass stale cache on changelog refresh'
          git push origin HEAD:improve/observability-ci-round3-20261001
