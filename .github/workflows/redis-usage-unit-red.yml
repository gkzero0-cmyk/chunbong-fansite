name: Redis usage unit RED check
on:
  push:
    branches:
      - fix/redis-usage-units-20260930
    paths:
      - tests/redis-usage-unit-labels-regression.mjs
      - .github/workflows/redis-usage-unit-red.yml
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redis-usage-units-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/redis-usage-unit-labels-regression.mjs
