name: Temporary port SOOP backfill

on:
  push:
    branches: [feat/chunbong-soop-history-backfill]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbong-soop-history-backfill
          fetch-depth: 0
      - name: Fetch source branch and cherry-pick backfill
        run: |
          git fetch origin feat/chunbong-soop-analytics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 54d9242b09de08dbcc7a9943260d1fe35e94e945
          git cherry-pick 4b825fd0315187bda57b38ccdc9992bde23db645
          git cherry-pick 5bf939df13bf2bebe6f1d744dc349105e926c105
          git cherry-pick 81854f038ed531396508e9b575ff7b3d6faca52a
          git cherry-pick 5d7a8ff7ccb9507650d5e6648efcf892065700a7
          rm -f .github/workflows/tmp-port-soop-backfill.yml
          git add -A
          git commit -m "ci: remove temporary SOOP backfill port workflow"
          git push origin HEAD:feat/chunbong-soop-history-backfill
