name: Chunbak production marker check

on:
  push:
    branches: ['feat/chunbak-audio-nav-order-20260917']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production markers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          stamp=$(date +%s)
          curl -fsSL -H 'cache-control: no-cache' "$BASE/index.html?_prod_marker=$stamp" -o /tmp/index.html
          curl -fsSL -H 'cache-control: no-cache' "$BASE/chunbak.html?_prod_marker=$stamp" -o /tmp/chunbak.html
          curl -fsSL -H 'cache-control: no-cache' "$BASE/chunbak-audio.js?_prod_marker=$stamp" -o /tmp/chunbak-audio.js
          grep -Fq '08 / MINIGAMES' /tmp/index.html
          grep -Fq '10 / DATA' /tmp/index.html
          grep -Fq 'id="chunbak-sound"' /tmp/chunbak.html
          grep -Fq 'id="chunbak-volume"' /tmp/chunbak.html
          grep -Fq 'chunbak.sound.enabled.v1' /tmp/chunbak-audio.js
          grep -Fq 'chunbak.sound.volume.v1' /tmp/chunbak-audio.js
          python - <<'PY'
          from pathlib import Path
          index = Path('/tmp/index.html').read_text()
          nav_start = index.index('<nav class="main-nav"')
          nav = index[nav_start:index.index('</nav>', nav_start)]
          labels = ['>팬아트</a>', '>유튜브</a>', '>TAROT</a>', '>미니게임</a>']
          positions = [nav.index(label) for label in labels]
          assert positions == sorted(positions), positions
          print('production contains requested markers')
          PY
