name: Apply PR414 Push health patch

on:
  push:
    branches:
      - fix/operator-push-health-state-20260930
    paths:
      - .github/workflows/apply-pr414-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operator-push-health-state-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              if old not in text:
                  raise SystemExit(f'expected snippet not found: {path}: {old[:100]!r}')
              if text.count(old)!=1:
                  raise SystemExit(f'expected exactly one snippet: {path}: count={text.count(old)}')
              p.write_text(text.replace(old,new,1))

          push='lib/push-notifications-api.js'
          marker="async function handleConfig(req,res){"
          insert="""async function status({probe=false}={}){\n  const env=vapidEnv();\n  if(env.publicKey&&env.privateKey)return{checked:true,ready:true,source:'env',storageConfigured:hasRedis()};\n  if(!hasRedis())return{checked:true,ready:false,source:'unconfigured',storageConfigured:false};\n  if(!probe)return{checked:false,ready:null,source:'realtime-redis',storageConfigured:true};\n  try{\n    const stored=await redisCommand('GET',VAPID_KEY);\n    if(!stored)return{checked:true,ready:false,source:'realtime-redis',storageConfigured:true};\n    const parsed=typeof stored==='string'?JSON.parse(stored):stored;\n    return{checked:true,ready:Boolean(parsed?.publicKey&&parsed?.privateKey),source:'realtime-redis',storageConfigured:true};\n  }catch(error){\n    return{checked:true,ready:false,source:'realtime-redis',storageConfigured:true,error:String(error?.message||error||'push_status_failed')};\n  }\n}\n\n"""
          replace_once(push,marker,insert+marker)
          replace_once(push,
            "module.exports={handleConfig,handleSubscription,handleDispatch,dispatch,_internals:{normalizedPreferences,classifySchedule,validSubscription,subId,resolveVapid,authorizedGitHubOidc,SUB_HASH}};",
            "module.exports={handleConfig,handleSubscription,handleDispatch,dispatch,_internals:{normalizedPreferences,classifySchedule,validSubscription,subId,status,resolveVapid,authorizedGitHubOidc,SUB_HASH}};")

          api='lib/operator-center-api.js'
          replace_once(api,
            "const minigameMultiplayer=require('./minigame-multiplayer-api');\n",
            "const minigameMultiplayer=require('./minigame-multiplayer-api');\nconst pushNotifications=require('./push-notifications-api');\n")
          replace_once(api,
            "  let redisOk=circuitLimited?false:null,recordedDays=null,feedbackTotal=null,pushReady=Boolean(process.env.WEB_PUSH_VAPID_PUBLIC_KEY&&process.env.WEB_PUSH_VAPID_PRIVATE_KEY);\n",
            "  let redisOk=circuitLimited?false:null,recordedDays=null,feedbackTotal=null;\n  const pushState=await pushNotifications._internals.status({probe:deepStorage});\n")
          replace_once(api,
            "        ['PING'],\n        ['ZCARD',ANALYTICS_DAYS_KEY],\n        ['ZCARD',FEEDBACK_INDEX],\n        ['GET','push:vapid:v1']\n      ]);\n      const [pong,days,feedbackCount,managedVapid]=values;\n      redisOk=String(pong).toUpperCase()==='PONG';recordedDays=Number(days)||0;feedbackTotal=Number(feedbackCount)||0;\n      pushReady=pushReady||Boolean(managedVapid);",
            "        ['PING'],\n        ['ZCARD',ANALYTICS_DAYS_KEY],\n        ['ZCARD',FEEDBACK_INDEX]\n      ]);\n      const [pong,days,feedbackCount]=values;\n      redisOk=String(pong).toUpperCase()==='PONG';recordedDays=Number(days)||0;feedbackTotal=Number(feedbackCount)||0;")
          replace_once(api,
            "  if(!pushReady&&deepStorage)healthIssues.push('Push 알림 설정을 확인해야 합니다.');",
            "  if(pushState.checked&&pushState.ready===false)healthIssues.push('Push 알림 설정을 확인해야 합니다.');")
          replace_once(api,
            "    services:{githubAuth:githubReady(),emailAuth:firebaseReady(),push:pushReady,analytics:hasDedicatedOperatorRedis()&&!circuitLimited,feedback:redisConfigured&&!circuitLimited},",
            "    services:{githubAuth:githubReady(),emailAuth:firebaseReady(),push:pushState.checked?pushState.ready:null,analytics:hasDedicatedOperatorRedis()&&!circuitLimited,feedback:redisConfigured&&!circuitLimited},")

          ui='operator.js'
          replace_once(ui,
            "function healthLabel(ok){return ok?'<span class=\"operator-health ok\">● 정상</span>':'<span class=\"operator-health bad\">● 확인 필요</span>'}",
            "function healthLabel(ok){if(ok===null||ok===undefined)return'<span class=\"operator-health warn\">● 미조회</span>';return ok?'<span class=\"operator-health ok\">● 정상</span>':'<span class=\"operator-health bad\">● 확인 필요</span>'}")
          replace_once(ui,
            "  if(currentSystem&&(!services.analytics||!services.feedback||!services.push))rows.push({level:'warn',title:'서비스 설정 확인',detail:[!services.analytics&&'실사용 분석',!services.feedback&&'피드백 저장',!services.push&&'Push'].filter(Boolean).join(' · '),tab:'system'});",
            "  if(currentSystem&&(!services.analytics||!services.feedback||services.push===false))rows.push({level:'warn',title:'서비스 설정 확인',detail:[!services.analytics&&'실사용 분석',!services.feedback&&'피드백 저장',services.push===false&&'Push'].filter(Boolean).join(' · '),tab:'system'});")
          replace_once(ui,
            "  $('#system-push').innerHTML=services.push?'<span class=\"operator-health ok\">● 준비됨</span>':'<span class=\"operator-health warn\">● 상세 미조회</span>';$('#system-push-meta').textContent=services.push?'VAPID 준비됨':storage.liveChecked?'Push 설정 확인 필요':'Redis 절약을 위해 기본 화면에서는 저장형 Push 설정을 읽지 않습니다.';",
            "  $('#system-push').innerHTML=services.push===true?'<span class=\"operator-health ok\">● 준비됨</span>':services.push===false?'<span class=\"operator-health bad\">● 확인 필요</span>':'<span class=\"operator-health warn\">● 상세 미조회</span>';$('#system-push-meta').textContent=services.push===true?'Realtime Redis의 VAPID 준비됨':services.push===false?'Realtime Redis의 Push 설정 확인 필요':'Redis 절약을 위해 기본 화면에서는 저장형 Push 설정을 읽지 않습니다.';")
          replace_once(ui,
            "  $('#operator-service-health').innerHTML=serviceRows.map(([label,ok])=>`<div><span>${label}</span>${healthLabel(Boolean(ok))}</div>`).join('');",
            "  $('#operator-service-health').innerHTML=serviceRows.map(([label,ok])=>`<div><span>${label}</span>${healthLabel(ok)}</div>`).join('');")
          PY
          node tests/operator-push-health-regression.mjs
          node --check lib/push-notifications-api.js
          node --check lib/operator-center-api.js
          node --check operator.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/push-notifications-api.js lib/operator-center-api.js operator.js
          git commit -m 'fix: align operator Push health with realtime Redis'
          git push origin HEAD:fix/operator-push-health-state-20260930
