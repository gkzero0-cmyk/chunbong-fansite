name: Temporary site share polish patch

on:
  push:
    branches:
      - perf/share-data-polish-20260930

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[share-polish]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/share-data-polish-20260930
          fetch-depth: 0
      - name: Patch public metadata and data preloads
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = {
            'schedule.html': ('춘봉 방송 일정과 예정된 주요 콘텐츠를 한국 시간 기준으로 확인하고 공지와 함께 최신 변경 내용을 빠르게 확인하세요.', 'assets/schedule-hero-banner.jpg'),
            'notice.html': ('춘봉 SOOP 방송국의 최신 공지를 팬사이트 안에서 바로 읽고 원문까지 빠르게 확인하세요.', 'assets/notice-hero-banner.jpg'),
            'vod.html': ('춘봉의 최신 SOOP 다시보기를 목록에서 골라 팬사이트 안의 공식 플레이어로 편하게 시청하세요.', 'assets/vod-hero-banner.jpg'),
            'clips.html': ('춘봉의 최신 SOOP CATCH와 일반 클립을 한곳에서 골라 팬사이트 안에서 바로 재생하세요.', 'assets/clips-hero-banner.jpg'),
            'fanart.html': ('춘봉 팬카페의 공개 팬아트를 갤러리로 모아 큰 이미지로 감상하고 원본 게시글까지 확인하세요.', 'assets/fanart-hero-banner.jpg'),
            'youtube.html': ('춘봉TV의 최신 동영상과 Shorts를 한곳에서 확인하고 팬사이트 안에서 바로 재생하세요.', 'assets/youtube-hero-banner.jpg'),
            'tarot.html': ('춘봉 타로 78장 풀덱으로 주제별 빠른 타로와 상세 리딩을 선택해 나만의 카드 흐름을 확인하세요.', 'assets/tarot-consult-banner.jpg'),
            'minigames.html': ('춘트리스·춘박게임·춘과게임·춘컬타일까지 춘봉 팬게임과 내 기록·오늘의 도전을 한곳에서 즐겨보세요.', 'assets/minigames-hero-hq.webp?v=20260919c'),
            'history.html': ('춘봉의 방송 역사를 연도·월별로 훑고 마인크래프트 서버, 게임, VRC, 노래 콘텐츠 기록을 확인하세요.', 'assets/history-hero-banner.jpg'),
            'data.html': ('춘봉의 SOOP 방송 기록과 YouTube 공개 데이터를 방송시간·시청자·카테고리·업로드 흐름으로 확인하세요.', 'assets/data-hero-banner.jpg'),
          }

          import re
          base = 'https://chunbong-fansite.vercel.app/'
          for filename, (desc, image) in pages.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{desc}">', text, count=1)
              text = re.sub(r'<meta property="og:description" content="[^"]*">', f'<meta property="og:description" content="{desc}">', text, count=1)
              text = re.sub(r'<meta name="twitter:description" content="[^"]*">', f'<meta name="twitter:description" content="{desc}">', text, count=1)
              absolute = base + image
              text = re.sub(r'<meta property="og:image" content="[^"]*">', f'<meta property="og:image" content="{absolute}">', text, count=1)
              text = re.sub(r'<meta name="twitter:image" content="[^"]*">', f'<meta name="twitter:image" content="{absolute}">', text, count=1)
              path.write_text(text, encoding='utf-8')

          data = Path('data.html')
          text = data.read_text(encoding='utf-8')
          marker = '<!-- data-script-preloads -->'
          if marker not in text:
              preload = marker + '<link rel="preload" href="data-soop-periods-v3.js" as="script"><link rel="preload" href="data-core.js" as="script"><link rel="preload" href="data-recent-session-metrics.js" as="script">'
              text = text.replace('</head>', preload + '</head>', 1)
              data.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html notice.html vod.html clips.html fanart.html youtube.html tarot.html minigames.html history.html data.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: polish public sharing and preload data scripts [share-polish]"
          git push origin HEAD:perf/share-data-polish-20260930
