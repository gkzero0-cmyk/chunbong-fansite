name: SOOP low-data v1.4.7 TDD

on:
  push:
    branches:
      - fix/soop-low-data-watch-20261003

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic implementation patch
        run: node scripts/soop-v147-apply.mjs
      - name: Run SOOP low-data watcher regression
        run: node tests/soop-low-data-watch-recapture-v147-regression.mjs
      - name: Commit generated implementation
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/content.js operator-soop-recapture-guard.js chunbong-content-collector.user.js
          git commit -m "feat: switch SOOP watcher to low-data exact recapture"
          git push origin HEAD:fix/soop-low-data-watch-20261003
