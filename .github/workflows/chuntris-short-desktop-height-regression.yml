name: Chuntris short desktop height regression

on:
  pull_request:
    paths:
      - 'chuntris-immersive.css'
      - 'tests/chuntris-short-desktop-height-regression.mjs'
      - '.github/workflows/chuntris-short-desktop-height-regression.yml'

jobs:
  short-height:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/chuntris-short-desktop-height-regression.mjs
