name: Apply operator Redis isolation patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operator-redis-isolation-migration-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/apply-operator-redis-isolation-patch.mjs
      - name: Verify targeted regression
        run: node tests/operator-dedicated-store-cutover-regression.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/operator-center-api.js operator-redis-diagnostics.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: isolate operator data from shared Redis"
          git push origin HEAD:feat/operator-redis-isolation-migration-20260930
