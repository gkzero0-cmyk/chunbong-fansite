name: Restore Upstash usage link

on:
  push:
    branches: [improve/observability-ci-round3-20261001]
    paths:
      - 'scripts/restore-upstash-usage-link.mjs'
      - '.github/workflows/restore-upstash-usage-link.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-upstash-usage-link
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/observability-ci-round3-20261001
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/restore-upstash-usage-link.mjs
      - run: |
          node --check operator-redis-diagnostics.js
          node tests/redis-command-diagnostics-regression.mjs
      - name: Commit product source fix
        shell: bash
        run: |
          set -euo pipefail
          git add operator-redis-diagnostics.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep Upstash Usage as official Redis source'
          git push origin HEAD:improve/observability-ci-round3-20261001
