name: Apply SOOP protocol-relative and restricted recheck fix

on:
  push:
    branches:
      - fix/soop-protocol-relative-recheck-20261003
    paths:
      - .github/workflows/apply-soop-protocol-relative-recheck.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/soop-protocol-relative-recheck-20261003
          fetch-depth: 0
      - name: Patch collector
        shell: python
        run: |
          from pathlib import Path
          p=Path('chunbong-content-collector.user.js')
          s=p.read_text()
          replacements=[
            ('// @version      1.4.3','// @version      1.4.4'),
            ("const VERSION='1.4.3';","const VERSION='1.4.4';"),
            ('const SOOP_MEDIA_COLLECTOR_VERSION=5;','const SOOP_MEDIA_COLLECTOR_VERSION=6;'),
            ("if(state==='restricted')return true;","if(state==='restricted'){if(recheckAuthenticated&&Number(row?.collectorVersion||0)<SOOP_MEDIA_COLLECTOR_VERSION)return false;return true}"),
            ("markSoopHistory(postId,'restricted');setCollectorStatus", "markSoopHistory(postId,'restricted',{collectorVersion:SOOP_MEDIA_COLLECTOR_VERSION});setCollectorStatus"),
            ("renderedHtml.matchAll(/https?:\\/\\/[^\\s\\\"'<>)]*\\/NORMAL_BBS\\/[^\\s\\\"'<>)]*/gi)", "renderedHtml.matchAll(/(?:https?:)?\\/\\/[^\\s\\\"'<>)]*\\/NORMAL_BBS\\/[^\\s\\\"'<>)]*/gi)")
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('missing expected collector fragment: '+old)
            s=s.replace(old,new,1)
          p.write_text(s)
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/apply-soop-protocol-relative-recheck.yml
          git add chunbong-content-collector.user.js
          git config user.name "gkzero0-cmyk"
          git config user.email "gkzero0@gmail.com"
          git commit -m "fix: recover protocol-relative SOOP media and stale restricted posts"
          git push origin HEAD:fix/soop-protocol-relative-recheck-20261003
