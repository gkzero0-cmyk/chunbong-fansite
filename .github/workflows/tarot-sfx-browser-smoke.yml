name: Tarot SFX browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tarot.html'
      - 'tarot.js'
      - 'tarot-sfx-v2.js'
      - 'tarot-sfx-v2-preload.js'
      - 'tarot-effects-v2.css'
      - 'tests/tarot-sfx-single-controller-regression.mjs'
      - '.github/workflows/tarot-sfx-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static SFX regression
        run: node tests/tarot-sfx-single-controller-regression.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/tarot-sfx-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/tarot.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tarot-sfx-http.log
          exit 1
      - name: Verify single sound controls and reveal effects
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:900}});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',error=>errors.push(String(error)));

          await page.goto(process.env.BASE_URL+'/tarot.html?_sfx='+Date.now(),{waitUntil:'networkidle'});
          const sound=page.locator('#tarot-sound-toggle');
          assert.equal(await sound.getAttribute('aria-pressed'),'true');
          await sound.click();
          assert.equal(await sound.getAttribute('aria-pressed'),'false','one click must toggle sound exactly once');
          assert.equal(await page.evaluate(()=>localStorage.getItem('chunbongTarotSound')),'off');
          await sound.click();
          assert.equal(await sound.getAttribute('aria-pressed'),'true');
          assert.equal(await page.evaluate(()=>localStorage.getItem('chunbongTarotSound')),'on');

          await page.locator('#tarot-volume-toggle').click();
          await page.locator('#tarot-volume-range').fill('42');
          assert.equal(await page.locator('#tarot-volume-value').textContent(),'42%');
          assert.equal(await page.evaluate(()=>localStorage.getItem('chunbongTarotVolume')),'0.42');

          await page.locator('#tarot-number-inputs input').first().fill('1');
          await page.locator('#tarot-shuffle').click();
          await page.waitForFunction(()=>document.querySelector('#tarot-results')?.hidden===false);
          await page.waitForFunction(()=>document.querySelector('#tarot-results')?.classList.contains('is-revealing'));
          assert.ok(await page.locator('.tarot-card-result').count()>=1,'tarot result card missing');
          assert.equal(errors.length,0,errors.join('\n'));

          await browser.close();
          EOF_NODE
