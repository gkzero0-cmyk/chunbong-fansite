name: Chunbak production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chunbak.html'
      - 'chunbak.css'
      - 'chunbak-postgame-ranking.css'
      - 'chunbak-board-start-ui.css'
      - 'chunbak.js'
      - 'chunbak-postgame-ranking.js'
      - 'chunbak-game-core.js'
      - 'chunbak-ranking-core.js'
      - 'chunbak-audio.js'
      - 'assets/chunbak/**'
      - 'api/content.js'
      - 'lib/chunbak-ranking-api.js'
      - 'minigames.html'
      - '.github/workflows/chunbak-production-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for immersive postgame production pages and verify HTTP/API
        env:
          BASE_URL: https://chunbong-fansite.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            stamp=$(date +%s)
            if curl -fsS -H 'cache-control: no-cache' "$BASE_URL/chunbak.html?_smoke=$stamp" -o /tmp/chunbak.html && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/chunbak.js?_smoke=$stamp" -o /tmp/chunbak.js && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/chunbak-postgame-ranking.js?_smoke=$stamp" -o /tmp/chunbak-postgame-ranking.js && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/chunbak-board-start-ui.css?_smoke=$stamp" -o /tmp/chunbak-board-start-ui.css && \
               grep -q 'id="chunbak-start-view"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-play-view"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-pause"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-fx-layer"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-combo"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-ranking-register"' /tmp/chunbak.html && \
               grep -q 'id="chunbak-ranking-nickname"' /tmp/chunbak.html && \
               grep -q 'chunbak-return-link' /tmp/chunbak.html && \
               ! grep -q 'id="chunbak-nickname"' /tmp/chunbak.html && \
               grep -q 'function pauseGame' /tmp/chunbak.js && \
               grep -q 'function showMergeEffect' /tmp/chunbak.js && \
               grep -q 'submitTerminalRanking' /tmp/chunbak-postgame-ranking.js && \
               grep -Fq 'width:min(420px,44svh,calc(100vw - 28px))' /tmp/chunbak-board-start-ui.css && \
               grep -Fq 'aspect-ratio:420/680' /tmp/chunbak-board-start-ui.css; then
              break
            fi
            test "$attempt" != "40"
            sleep 15
          done
          curl -fsS "$BASE_URL/minigames.html" >/dev/null
          for n in $(seq 1 11); do curl -fsS "$BASE_URL/assets/chunbak/$n.png" >/dev/null; done
          curl -fsS "$BASE_URL/api/content?type=chunbak-ranking&mode=classic" >/tmp/chunbak-ranking.json
          status=$(curl -sS -o /tmp/chunbak-invalid.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -H "origin: $BASE_URL" \
            -X POST \
            --data '{"mode":"classic","nickname":"x","score":1,"maxLevel":1}' \
            "$BASE_URL/api/content?type=chunbak-ranking")
          test "$status" = "400"
          node -e "const p=require('/tmp/chunbak-ranking.json');if(p.mode!=='classic'||!Array.isArray(p.entries))process.exit(1)"
      - name: Browser smoke
        env:
          BASE_URL: https://chunbong-fansite.vercel.app
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({headless:true});
          for (const viewport of [{width:1440,height:900},{width:1280,height:720},{width:1024,height:768},{width:390,height:844}]) {
            const page = await browser.newPage({viewport,isMobile:viewport.width<=390,hasTouch:viewport.width<=390});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${process.env.BASE_URL}/minigames.html?_smoke=${Date.now()}`, {waitUntil:'domcontentloaded'});
            assert.ok(await page.locator('a[href="chuntris.html"]').count());
            assert.ok(await page.locator('a[href="chunbak.html"]').count());
            assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1));

            await page.goto(`${process.env.BASE_URL}/chunbak.html?_smoke=${Date.now()}`, {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => Boolean(window.ChunbakGame&&window.ChunbakPostgameRanking));
            await page.waitForFunction(() => !document.querySelector('#chunbak-start')?.disabled);
            await page.waitForFunction(()=>getComputedStyle(document.querySelector('#chunbak-game')).transform==='none');
            assert.equal(await page.locator('#chunbak-nickname').count(),0,'pre-game nickname must be removed');
            assert.ok(await page.locator('#chunbak-start-view').isVisible(),'start view missing');
            assert.equal(await page.locator('#chunbak-play-view').isVisible(),false,'play view must start hidden');
            assert.ok(await page.locator('#chunbak-ranking-register').count(),'postgame ranking register missing');
            assert.ok(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1));
            const startCardBox=await page.locator('.chunbak-start-card').boundingBox();
            assert.ok(startCardBox,'start card missing');
            assert.ok(startCardBox.y>=-1&&startCardBox.y+startCardBox.height<=viewport.height+1,`start card bottom clipped: ${startCardBox.y+startCardBox.height} > ${viewport.height}`);
            assert.ok(Math.abs(startCardBox.height/startCardBox.width-(680/420))<0.04,'start card ratio mismatch');
            for(const selector of ['[data-chunbak-open="ranking"]','[data-chunbak-open="sound"]','[data-chunbak-open="controls"]']){
              assert.ok(await page.locator(`.chunbak-start-utils ${selector}`).isVisible(),`start utility missing: ${selector}`);
            }

            await page.locator('#chunbak-start').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');
            assert.ok(await page.locator('#chunbak-play-view').isVisible(),'play view missing');
            const canvas = page.locator('#chunbak-canvas');
            const box = await canvas.boundingBox();
            const stageBox=await page.locator('#chunbak-stage').boundingBox();
            assert.ok(box && box.x >= -1 && box.x + box.width <= viewport.width + 1);
            assert.ok(stageBox&&stageBox.y>=-1&&stageBox.y+stageBox.height<=viewport.height+1,`play stage bottom clipped: ${stageBox?.y+stageBox?.height} > ${viewport.height}`);
            assert.ok(Math.abs(startCardBox.width-stageBox.width)<=3,`start/play stage widths differ: ${startCardBox.width} vs ${stageBox.width}`);
            assert.ok(Math.abs(startCardBox.y-stageBox.y)<=2,`start/play stage top positions differ: ${startCardBox.y} vs ${stageBox.y}`);
            assert.ok(Math.abs(stageBox.height/stageBox.width-(680/420))<0.04,'play stage ratio mismatch');

            await page.evaluate(() => {ChunbakGame.createPiece(1,190,520);ChunbakGame.createPiece(1,215,520);});
            await page.waitForFunction(() => Number(document.querySelector('#chunbak-score')?.textContent || 0) > 0);
            assert.ok(Number(await page.locator('#chunbak-score').textContent()) > 0);
            assert.ok(await page.locator('#chunbak-fx-layer').evaluate(el=>el.childElementCount>0),'merge effect missing');
            await page.evaluate(()=>ChunbakGame.showCombo(2,210,420));
            assert.equal((await page.locator('#chunbak-combo').textContent())?.trim(),'COMBO x2');

            await page.locator('[data-chunbak-open="ranking"]').last().click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='paused');
            assert.ok(await page.locator('[data-chunbak-panel="ranking"]').isVisible(),'ranking utility modal missing');
            await page.locator('#chunbak-modal-close').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');

            const scoreBefore=(await page.locator('#chunbak-score').textContent())?.trim();
            const nextBefore=await page.locator('#chunbak-next img').getAttribute('src');
            await page.locator('#chunbak-pause').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='paused');
            assert.ok(await page.locator('[data-chunbak-panel="pause"]').isVisible(),'pause panel missing');
            const pauseReturn=page.locator('[data-chunbak-panel="pause"] .chunbak-return-link');
            assert.ok(await pauseReturn.isVisible(),'pause minigames return link missing');
            assert.equal(await pauseReturn.getAttribute('href'),'minigames.html');
            await page.waitForTimeout(150);
            assert.equal((await page.locator('#chunbak-score').textContent())?.trim(),scoreBefore,'paused score changed');
            assert.equal(await page.locator('#chunbak-next img').getAttribute('src'),nextBefore,'paused next stage changed');
            await page.locator('[data-chunbak-action="resume"]').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');

            await page.evaluate(()=>ChunbakGame.setGameOver());
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='gameover');
            const terminalReturn=page.locator('#chunbak-overlay .chunbak-return-link');
            assert.ok(await terminalReturn.isVisible(),'game-over minigames return link missing');
            assert.equal(await terminalReturn.getAttribute('href'),'minigames.html');
            await page.locator('#chunbak-ranking-register').click();
            assert.ok(await page.locator('#chunbak-ranking-submit-panel').isVisible(),'postgame nickname panel missing');
            await page.locator('#chunbak-ranking-nickname').fill('x');
            await page.locator('#chunbak-ranking-submit').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-ranking-submit-status')?.textContent.includes('2~16자'));
            await page.locator('#chunbak-ranking-cancel').click();

            await page.locator('[data-chunbak-overlay-restart]').click();
            await page.waitForFunction(()=>document.querySelector('#chunbak-game')?.dataset.gameStatus==='playing');
            assert.equal((await page.locator('#chunbak-score').textContent())?.trim(), '0');
            assert.deepEqual(errors,[],`page errors: ${errors.join(' | ')}`);
            await page.close();
          }
          await browser.close();
          EOF_NODE
