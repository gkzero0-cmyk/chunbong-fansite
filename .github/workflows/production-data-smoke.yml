name: Production data smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-data-smoke.yml'
      - 'api/content.js'
      - 'api/youtube.js'
      - 'lib/chunbong-data.js'
      - 'lib/soop-external.js'
      - 'lib/soop-analytics.js'
      - 'lib/youtube-engagement.js'
      - 'scripts/update-trackify-soop-cache.mjs'
      - 'scripts/update-youtube-engagement-cache.mjs'
      - 'data.js'
      - 'data.css'
      - 'data-enhancements.js'
      - 'data-enhancements.css'
      - 'data.html'
      - 'data/soop-external-history.json'
      - 'data/soop-sessions.json'
      - 'data/trackify-soop-cache.json'
      - 'data/youtube-engagement-cache.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for production deployment
        run: sleep 25
      - name: Fetch production endpoints
        shell: bash
        run: |
          set -u
          BASE='https://chunbong-fansite.vercel.app'
          mkdir -p .smoke data
          fetch_one() {
            local path="$1"
            local out="$2"
            local headers="$3"
            curl -L -sS --connect-timeout 15 --max-time 60 \
              -H 'cache-control: no-cache' \
              -D "$headers" \
              -o "$out" -w '%{http_code}' "${BASE}${path}" || printf '000'
          }
          DATA_JS_STATUS="$(fetch_one '/data.js' '.smoke/data.js' '.smoke/data-js.headers')"
          DATA_ENHANCEMENTS_JS_STATUS="$(fetch_one '/data-enhancements.js' '.smoke/data-enhancements.js' '.smoke/data-enhancements-js.headers')"
          DATA_ENHANCEMENTS_CSS_STATUS="$(fetch_one '/data-enhancements.css' '.smoke/data-enhancements.css' '.smoke/data-enhancements-css.headers')"
          DATA_HTML_STATUS="$(fetch_one '/data.html' '.smoke/data.html' '.smoke/data-html.headers')"
          TS="$(date +%s%3N)"
          API_STATUS="$(fetch_one "/api/content?type=data&refresh=1&_ts=${TS}" '.smoke/api.json' '.smoke/api.headers')"
          export DATA_JS_STATUS DATA_ENHANCEMENTS_JS_STATUS DATA_ENHANCEMENTS_CSS_STATUS DATA_HTML_STATUS API_STATUS BASE
          node <<'NODE'
          const fs = require('fs');
          const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };
          const size = (p) => { try { return fs.statSync(p).size; } catch { return 0; } };
          const js = read('.smoke/data.js');
          const enhancementsJs = read('.smoke/data-enhancements.js');
          const enhancementsCss = read('.smoke/data-enhancements.css');
          const html = read('.smoke/data.html');
          const apiHeaders = read('.smoke/api.headers');
          const apiText = read('.smoke/api.json');
          let payload = null;
          let parseError = null;
          try { payload = JSON.parse(apiText); } catch (error) { parseError = error.message; }
          const arrCount = (value) => Array.isArray(value) ? value.length : null;
          const errors = payload?.errors ?? null;
          const overview = payload?.soop?.overview || {};
          const externalHistory = payload?.soop?.externalHistory || {};
          const external = externalHistory?.currentFallback || {};
          const recentSessions = Array.isArray(payload?.soop?.recentSessions) ? payload.soop.recentSessions : [];
          const trackifySessions = Array.isArray(external?.sessions) ? external.sessions : [];
          const trackifyHistorySessionCount = trackifySessions.filter(item => item?.measurement === 'trackify-public-record' || String(item?.id || '').startsWith('trackify-')).length;
          const youtube = payload?.youtube || {};
          const channel = youtube.channel || {};
          const engagement = youtube.engagement || {};
          const engagementRankings = engagement.rankings || {};
          const recentVideos = Array.isArray(youtube.recentVideos) ? youtube.recentVideos : [];
          const recentShorts = Array.isArray(youtube.recentShorts) ? youtube.recentShorts : [];
          const rankingCount = (range, metric) => arrCount(engagementRankings?.[range]?.[metric]) ?? 0;
          const engagementItemCount = Number.isFinite(engagement.itemCount) ? engagement.itemCount : 0;
          const engagementRankingCounts = {
            allTime: { views: rankingCount('allTime', 'views'), comments: rankingCount('allTime', 'comments') },
            currentMonth: { views: rankingCount('currentMonth', 'views'), comments: rankingCount('currentMonth', 'comments') },
            recentThreeMonths: { views: rankingCount('recentThreeMonths', 'views'), comments: rankingCount('recentThreeMonths', 'comments') }
          };
          const engagementRankingShapeOk = ['allTime', 'currentMonth', 'recentThreeMonths'].every(range =>
            ['views', 'comments'].every(metric => Array.isArray(engagementRankings?.[range]?.[metric]) && engagementRankings[range][metric].length <= 5)
          );
          const expectedTokens = [
            'sourceChip', 'monthUniqueViewers', 'monthlyStarCount', 'mergeYoutubeRecent',
            'data-chart-crosshair', 'refresh=1', "cache:'no-store'"
          ];
          const enhancementTokens = [
            'normalizeDailyTrendRows', 'formatFullDate', 'hideUnavailableSoopCards', 'installDataFetchTransform',
            'renderYoutubeEngagement', 'data-engagement-range', 'data-engagement-metric'
          ];
          const enhancementCssTokens = [
            'font-size:18px', 'font-size:28px', 'font-size:13px', 'font-size:17px',
            '.data-engagement-controls', '.data-engagement-button'
          ];
          const overviewFields = [
            'subscriberCount','supporterCount','monthUniqueViewers','viewershipHours','cumulativeUsers','cumulativeUpCount',
            'monthlyStarCount','starsPerHour','monthlySupporterCount','monthlyChatCount','monthlyKickCount','monthlyMuteCount',
            'stationOpenedAt','latestBroadcastDate','categoryRankings'
          ];
          const legacySessionCount = recentSessions.filter(item => {
            const text = `${item?.id || ''} ${item?.source?.name || ''} ${item?.source?.url || ''}`.toLowerCase();
            return text.includes('streamscharts') || text.includes('streams charts') || text.includes('auro.live');
          }).length;
          const sourceSummaryCleared = externalHistory.sourceSummary === null;
          const categoryReferenceCleared = externalHistory.categoryReference === null;
          const result = {
            checkedAt: new Date().toISOString(),
            baseUrl: process.env.BASE,
            endpoints: {
              dataJs: { status: Number(process.env.DATA_JS_STATUS) || 0, bytes: size('.smoke/data.js') },
              dataEnhancementsJs: { status: Number(process.env.DATA_ENHANCEMENTS_JS_STATUS) || 0, bytes: size('.smoke/data-enhancements.js') },
              dataEnhancementsCss: { status: Number(process.env.DATA_ENHANCEMENTS_CSS_STATUS) || 0, bytes: size('.smoke/data-enhancements.css') },
              dataHtml: { status: Number(process.env.DATA_HTML_STATUS) || 0, bytes: size('.smoke/data.html') },
              apiData: { status: Number(process.env.API_STATUS) || 0, bytes: size('.smoke/api.json') }
            },
            staticChecks: {
              dataJsExpectedTokens: expectedTokens.reduce((acc, token) => ({ ...acc, [token]: js.includes(token) }), {}),
              enhancementTokens: enhancementTokens.reduce((acc, token) => ({ ...acc, [token]: enhancementsJs.includes(token) }), {}),
              enhancementCssTokens: enhancementCssTokens.reduce((acc, token) => ({ ...acc, [token]: enhancementsCss.includes(token) }), {}),
              dataHtmlHasDataJs: html.includes('data.js'),
              dataHtmlHasEnhancements: html.includes('data-enhancements.js') && html.includes('data-enhancements.css'),
              dataHtmlHidesLegacySourceCopy: !/Streams Charts|streamscharts|auro\.live/i.test(html),
              manualRefreshNoStore: /cache-control:\s*no-store(?:,\s*max-age=0)?/i.test(apiHeaders)
            },
            apiSummary: {
              parseError,
              fallback: payload?.fallback ?? null,
              currentFallback: payload?.currentFallback ?? payload?.fallback ?? null,
              reason: payload?.reason ?? null,
              capturedAt: payload?.capturedAt ?? null,
              errors,
              errorCount: Array.isArray(errors) ? errors.length : (errors && typeof errors === 'object' ? Object.keys(errors).length : 0),
              sourceSummaryCleared,
              categoryReferenceCleared,
              legacySessionCount,
              trackifyHistorySessionCount,
              arrayCounts: {
                daily: arrCount(payload?.soop?.daily),
                monthlyStats: arrCount(payload?.soop?.monthlyStats),
                calendar: arrCount(payload?.soop?.calendar),
                categories: arrCount(payload?.soop?.categories),
                recentSessions: arrCount(payload?.soop?.recentSessions)
              },
              trackify: {
                sourcePresent: Array.isArray(external?.sources) && external.sources.some(item => item?.source === 'trackify'),
                fields: overviewFields.reduce((acc, field) => ({ ...acc, [field]: overview[field] ?? external[field] ?? null }), {}),
                categoryCount: arrCount(overview.categoryRankings),
                categoryDistributionCount: arrCount(overview.currentMonthCategories),
                excludedDonorRankingPresent: Object.prototype.hasOwnProperty.call(external, 'donorRanking') || Object.prototype.hasOwnProperty.call(overview, 'donorRanking')
              },
              youtube: {
                subscriberCount: channel.subscriberCount ?? null,
                viewCount: channel.viewCount ?? null,
                videoCount: channel.videoCount ?? null,
                snapshotFallback: channel.snapshotFallback ?? null,
                monthlyUploadCount: youtube?.monthly?.uploadCount ?? null,
                recentVideoCount: recentVideos.length,
                recentShortCount: recentShorts.length,
                newestVideoDate: recentVideos[0]?.dateIso || recentVideos[0]?.date || null,
                newestShortDate: recentShorts[0]?.dateIso || recentShorts[0]?.date || null,
                engagement: {
                  source: engagement.source || null,
                  capturedAt: engagement.capturedAt || null,
                  engagementItemCount,
                  engagementRankingCounts,
                  engagementRankingShapeOk
                }
              }
            }
          };
          const tokenChecks = Object.values(result.staticChecks.dataJsExpectedTokens).every(Boolean);
          const enhancementChecks = Object.values(result.staticChecks.enhancementTokens).every(Boolean)
            && Object.values(result.staticChecks.enhancementCssTokens).every(Boolean);
          const youtubeChannelOk = [channel.subscriberCount, channel.viewCount, channel.videoCount].every(Number.isFinite);
          const youtubeEngagementOk = engagementItemCount > 0
            && engagementRankingShapeOk
            && engagementRankingCounts.allTime.views > 0
            && engagementRankingCounts.allTime.comments > 0;
          result.ok = result.endpoints.dataJs.status === 200
            && result.endpoints.dataEnhancementsJs.status === 200
            && result.endpoints.dataEnhancementsCss.status === 200
            && result.endpoints.dataHtml.status === 200
            && result.endpoints.apiData.status === 200
            && tokenChecks
            && enhancementChecks
            && result.staticChecks.dataHtmlHasDataJs
            && result.staticChecks.dataHtmlHasEnhancements
            && result.staticChecks.dataHtmlHidesLegacySourceCopy
            && result.staticChecks.manualRefreshNoStore
            && !result.apiSummary.parseError
            && result.apiSummary.fallback !== true
            && result.apiSummary.sourceSummaryCleared
            && result.apiSummary.categoryReferenceCleared
            && result.apiSummary.legacySessionCount === 0
            && result.apiSummary.trackifyHistorySessionCount > 0
            && result.apiSummary.arrayCounts.daily > 0
            && result.apiSummary.arrayCounts.daily <= 10
            && result.apiSummary.arrayCounts.monthlyStats > 0
            && result.apiSummary.arrayCounts.calendar > 0
            && result.apiSummary.arrayCounts.recentSessions > 0
            && youtubeChannelOk
            && youtubeEngagementOk
            && !result.apiSummary.trackify.excludedDonorRankingPresent;
          fs.writeFileSync('data/production-smoke-latest.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
      - name: Commit smoke result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/production-smoke-latest.json
          if git diff --cached --quiet; then
            echo 'No smoke result change'
          else
            git commit -m 'ci: record production data smoke result'
            git pull --rebase origin main
            git push
          fi
      - name: Require successful production smoke
        run: node -e "const r=require('./data/production-smoke-latest.json'); if(!r.ok){console.error(r); process.exit(1)}"
