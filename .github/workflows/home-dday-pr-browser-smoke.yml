name: Home D-day PR browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-dday.js'
      - 'daily-fortune.js'
      - 'daily-fortune.css'
      - 'styles.css'
      - '.github/workflows/home-dday-pr-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/home-dday-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/home-dday-http.log
          exit 1
      - name: Verify D-day and daily fortune home experiences
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const page=await browser.newPage({viewport,isMobile:viewport.width<=390,hasTouch:viewport.width<=390});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));

              await page.goto(`${process.env.BASE_URL}/index.html?_smoke=${Date.now()}`,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>Boolean(window.HomeBroadcastDday&&window.CHUNBONG_DAILY_FORTUNE));

              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===true);
              assert.equal(await page.locator('[data-daily-fortune-image]').getAttribute('src'),null,'fortune artwork must not load before the draw');
              await page.locator('[data-daily-fortune-card]').click();
              await page.waitForFunction(()=>document.querySelector('[data-daily-fortune-card]')?.classList.contains('is-revealed'));
              await page.waitForFunction(()=>document.querySelector('[data-daily-fortune-result]')?.hidden===false);
              const fortuneTitle=(await page.locator('[data-daily-fortune-result-title]').textContent())?.trim();
              assert.match(fortuneTitle||'',/오늘의 운세$/,'daily fortune result title missing');
              assert.match((await page.locator('[data-daily-fortune-image]').getAttribute('src'))||'',/res\.cloudinary\.com\/.*c_crop/,'daily fortune must load one cropped card artwork after selection');
              const stored=await page.evaluate(()=>{
                const api=window.CHUNBONG_DAILY_FORTUNE;
                const raw=localStorage.getItem(api.STORAGE_KEY);
                return {today:api.kstDate(),state:raw?JSON.parse(raw):null};
              });
              assert.equal(stored.state?.date,stored.today,'daily fortune must persist against the current KST date');
              assert.ok(Number.isInteger(stored.state?.card),'daily fortune stored card missing');

              await page.locator('[data-daily-fortune-close]').click();
              assert.equal(await page.locator('#daily-fortune-dialog').evaluate(el=>el.open),false,'daily fortune dialog did not close');
              assert.ok(await page.locator('[data-daily-fortune-launcher]').isVisible(),'daily fortune reopen launcher missing after close');

              await page.locator('[data-daily-fortune-launcher]').click();
              assert.ok(await page.locator('#daily-fortune-dialog').evaluate(el=>el.open),'daily fortune did not reopen');
              assert.equal((await page.locator('[data-daily-fortune-result-title]').textContent())?.trim(),fortuneTitle,'reopened daily fortune must keep the same result');
              await page.locator('[data-daily-fortune-close]').click();

              await page.reload({waitUntil:'networkidle'});
              await page.waitForFunction(()=>Boolean(window.CHUNBONG_DAILY_FORTUNE));
              await page.waitForTimeout(650);
              assert.equal(await page.locator('#daily-fortune-dialog').evaluate(el=>el.open),false,'saved daily fortune should not auto-open again on the same KST day');
              assert.ok(await page.locator('[data-daily-fortune-launcher]').isVisible(),'saved daily fortune launcher must remain visible after reload');
              await page.evaluate(()=>{
                const api=window.CHUNBONG_DAILY_FORTUNE;
                localStorage.setItem(api.STORAGE_KEY,JSON.stringify({date:'2000-01-01',card:0,drawnAt:''}));
              });
              await page.reload({waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===true);
              assert.equal(await page.locator('[data-daily-fortune-card]').getAttribute('class'),'daily-fortune-card','stale daily fortune must reset for a new KST day');
              await page.locator('[data-daily-fortune-close]').click();

              const values=await page.evaluate(()=>{
                const api=window.HomeBroadcastDday;
                const now=api.calculate(api.kstParts());
                return {
                  first:document.querySelector('#home-dday-first')?.textContent?.trim(),
                  soop:document.querySelector('#home-dday-soop')?.textContent?.trim(),
                  firstYears:document.querySelector('#home-dday-first-years')?.textContent?.trim(),
                  soopYears:document.querySelector('#home-dday-soop-years')?.textContent?.trim(),
                  expected:{
                    first:`D+${now.first.days}`,
                    soop:`D+${now.soop.days}`,
                    firstYears:`${now.first.years}년차`,
                    soopYears:`${now.soop.years}년차`
                  }
                };
              });
              assert.equal(values.first,values.expected.first);
              assert.equal(values.soop,values.expected.soop);
              assert.equal(values.firstYears,values.expected.firstYears);
              assert.equal(values.soopYears,values.expected.soopYears);

              const header=await page.locator('.site-header').boundingBox();
              const strip=await page.locator('.home-dday-strip').boundingBox();
              assert.ok(header&&strip,'header or D-day strip missing');
              assert.ok(Math.abs(strip.y-(header.y+header.height))<=2,'D-day strip is not directly below the menu bar');

              await page.locator('#home-dday-trigger').click();
              assert.ok(await page.locator('#home-dday-dialog').evaluate(el=>el.open),'D-day dialog did not open');
              assert.equal((await page.locator('#home-dday-first-years').textContent())?.trim(),values.expected.firstYears);
              assert.equal((await page.locator('#home-dday-soop-years').textContent())?.trim(),values.expected.soopYears);
              await page.locator('[data-home-dday-close]').click();
              assert.equal(await page.locator('#home-dday-dialog').evaluate(el=>el.open),false,'D-day dialog did not close');

              const homeOfficial=page.locator('.status-card-link');
              assert.equal(await homeOfficial.getAttribute('href'),'https://www.sooplive.com/station/chunbongtv');
              assert.equal(await homeOfficial.getAttribute('target'),'_blank');
              assert.match((await homeOfficial.locator('.status-service-mark').textContent())||'',/SOOP/);
              assert.match((await homeOfficial.textContent())||'',/공식 프로필/);
              assert.ok(await homeOfficial.isVisible(),'home official profile card not visible');
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'home horizontal overflow');

              assert.deepEqual(errors,[],`page errors: ${errors.join(' | ')}`);
              await page.close();
            }
          }finally{
            await browser.close();
          }
          EOF_NODE
