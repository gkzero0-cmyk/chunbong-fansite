name: Home D-day PR browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'home-dday.js'
      - 'styles.css'
      - '.github/workflows/home-dday-pr-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/home-dday-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/home-dday-http.log
          exit 1
      - name: Verify D-day dialog and NamuWiki links
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const page=await browser.newPage({viewport,isMobile:viewport.width<=390,hasTouch:viewport.width<=390});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));

              await page.goto(`${process.env.BASE_URL}/index.html?_smoke=${Date.now()}`,{waitUntil:'networkidle'});
              await page.waitForFunction(()=>Boolean(window.HomeBroadcastDday));

              const values=await page.evaluate(()=>{
                const api=window.HomeBroadcastDday;
                const now=api.calculate(api.kstParts());
                return {
                  first:document.querySelector('#home-dday-first')?.textContent?.trim(),
                  soop:document.querySelector('#home-dday-soop')?.textContent?.trim(),
                  firstYears:document.querySelector('#home-dday-first-years')?.textContent?.trim(),
                  soopYears:document.querySelector('#home-dday-soop-years')?.textContent?.trim(),
                  expected:{
                    first:`D+${now.first.days}`,
                    soop:`D+${now.soop.days}`,
                    firstYears:`${now.first.years}년차`,
                    soopYears:`${now.soop.years}년차`
                  }
                };
              });
              assert.equal(values.first,values.expected.first);
              assert.equal(values.soop,values.expected.soop);
              assert.equal(values.firstYears,values.expected.firstYears);
              assert.equal(values.soopYears,values.expected.soopYears);

              const header=await page.locator('.site-header').boundingBox();
              const strip=await page.locator('.home-dday-strip').boundingBox();
              assert.ok(header&&strip,'header or D-day strip missing');
              assert.ok(Math.abs(strip.y-(header.y+header.height))<=2,'D-day strip is not directly below the menu bar');

              await page.locator('#home-dday-trigger').click();
              assert.ok(await page.locator('#home-dday-dialog').evaluate(el=>el.open),'D-day dialog did not open');
              assert.equal((await page.locator('#home-dday-first-years').textContent())?.trim(),values.expected.firstYears);
              assert.equal((await page.locator('#home-dday-soop-years').textContent())?.trim(),values.expected.soopYears);
              await page.locator('[data-home-dday-close]').click();
              assert.equal(await page.locator('#home-dday-dialog').evaluate(el=>el.open),false,'D-day dialog did not close');

              const homeOfficial=page.locator('.status-card-link');
              assert.equal(await homeOfficial.getAttribute('href'),'https://www.sooplive.com/station/chunbongtv');
              assert.equal(await homeOfficial.getAttribute('target'),'_blank');
              assert.match((await homeOfficial.textContent())||'',/SOOP 공식 프로필/);
              assert.ok(await homeOfficial.isVisible(),'home official profile card not visible');
              assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'home horizontal overflow');

              assert.deepEqual(errors,[],`page errors: ${errors.join(' | ')}`);
              await page.close();
            }
          }finally{
            await browser.close();
          }
          EOF_NODE
