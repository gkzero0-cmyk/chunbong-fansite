name: Apply performance patches

on:
  push:
    branches: [perf/site-speed-20261004]
    paths:
      - 'scripts/apply-perf-patches.mjs'
      - '.github/workflows/perf-patch-apply.yml'

permissions:
  contents: write

concurrency:
  group: perf-patch-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/site-speed-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply targeted patches
        run: node scripts/apply-perf-patches.mjs
      - name: Validate patched JavaScript
        run: |
          node --check chunbong-contents.js
          node --check mobile-runtime-loader.js
          node --check site-improvements.js
          node --check service-worker.js
          node --check page.js
      - name: Commit patched files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chunbong-contents.js mobile-runtime-loader.js site-improvements.js service-worker.js page.js .github/workflows/site-regression.yml
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git commit -m 'perf: apply archive and PWA performance patches'
          git push origin HEAD:perf/site-speed-20261004
