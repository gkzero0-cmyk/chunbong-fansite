name: Materialize exact tarot pairs

on:
  push:
    branches: [staging/tarot-pairs]
    paths: [.github/workflows/probe-tarot-rebuild.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/tarot-pairs
          fetch-depth: 0
      - name: Decode and verify exact staged pairs
        run: |
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          expected = {
            0:'70d85c4b0d600a7ab8480d304b8b59a0c7213aee',
            1:'279166c9c0b018e538aeadb50048040c810a2a65',
            2:'01ad030a359a7d5d2f7c67b84944291a71e16019',
            3:'e78c79d2dbb0ac3bb241e0023d5801f0e92917a7',
            5:'6b27bf0e33849b75c8ced34ef9f347bfdce025e0',
            7:'4ae375ac8c96eba04476de4342bb09b7237a3022',
            8:'0bcc009f0bebebd66bdf7efb9289c655ba188968',
            9:'fd349bccee0a0394452809db0ed647083aaf4f1b',
            10:'cbd042fea61b17f63abf06aad9e727b7cec780ad',
            11:'67b9a3ae771f3c5a97493bc723b0e152c60e1db5',
            12:'97df1f8f6dd772af265273a83f6a86658c439913',
            13:'8a5e481749f4fbd17ddc11c14c043beb496c5b4d',
            14:'daf328542150e9a43afe373f6d6e2c417bf58bc6',
            15:'0022834789979c68dc8f3af73cd8c4936f364b7d',
            16:'f5c6680177b4fa9dd75f6a54eca939eada1617d5',
            17:'6189d84e99aa1767a524ca424394dc6822791655',
            18:'e902c5d4e6e8624586ed38292943ba779ac55e6a',
            20:'eb3f76652470139839b6d405ee2a37d380aff3b9',
            21:'52179a6085d7ad732d7f6cd309853dafbe0b70b0',
            22:'b51bdeea43b8aa7def7c80285f867bf20018c833',
            23:'93dcdd8dc99a2c391bb9d74395c5615617f83475',
            24:'1c64812d3801549a90877351b3ebd81ee46170b4',
            25:'f2e7186a2e9fa96ff5cde69f11c1d8485baa9d2f',
            26:'41eaacc918a34193b27eb29d492bf9909965176b',
            28:'337a564e69f6db85950ad8d4103ce45d1d33405b',
            29:'1ad5868f46963a4df09c2dff9bbb996ad41a7871',
          }

          src = Path('.tarot-transfer')
          out = Path('assets/tarot/hd')
          out.mkdir(parents=True, exist_ok=True)

          for index, wanted in expected.items():
              text = (src / f'pair-{index:02d}.b64').read_text().strip()
              text += '=' * (-len(text) % 4)
              data = base64.b64decode(text)
              header = f'blob {len(data)}\0'.encode()
              actual = hashlib.sha1(header + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f'pair-{index:02d}: git blob SHA mismatch {actual} != {wanted}')
              target = out / f'pair-{index:02d}.avif'
              target.write_bytes(data)
              print(f'{target}: {len(data)} bytes, git blob {actual}')
          print(f'verified {len(expected)} exact pair objects')
          PY
      - name: Commit exact binary pair objects
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tarot/hd/pair-*.avif
          git diff --cached --quiet && exit 0
          git commit -m 'chore: materialize exact tarot pair objects'
          git push origin HEAD:staging/tarot-pairs
