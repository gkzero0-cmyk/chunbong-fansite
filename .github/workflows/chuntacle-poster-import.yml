name: Chuntacle poster import probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chuntacle-poster-import.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transfer page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/pbUqT2KJziaz
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request
          url=os.environ['SHARE_URL']
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print('STATUS',r.status)
              print('FINAL_URL',r.geturl())
              print('CONTENT_TYPE',r.headers.get('content-type'))
              print('BODY_LEN',len(body))
          for m in sorted(set(re.findall(r"https?://[^\\s\\\"<>]+",body))):
              if 'firestorage' in m or 'download' in m:
                  print('URL',m[:1000])
          for m in sorted(set(re.findall(r"href=[\\\"']([^\\\"']+)[\\\"']",body))):
              if 'download' in m or '/api/' in m or '/d/' in m or '/file' in m:
                  print('HREF',m[:1000])
          for line in body.splitlines():
              low=line.lower()
              if 'download' in low or 'chuntacle-session-' in low or '01a0c6b' in low:
                  print('LINE',line[:1800])
          PY
