name: Chuntacle poster import probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chuntacle-poster-import.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transfer page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/pbUqT2KJziaz
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request, urllib.parse
          url=os.environ['SHARE_URL']
          headers={'User-Agent':'Mozilla/5.0'}
          def get(u):
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.geturl(),r.headers.get('content-type'),r.read().decode('utf-8','replace')
          final,ctype,body=get(url)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',body)
          for src in scripts:
              full=urllib.parse.urljoin(final,src)
              try:
                  _,_,js=get(full)
              except Exception:
                  continue
              i=js.find('async function v()')
              if i<0:
                  continue
              print('BUNDLE',full)
              print('AROUND_V',js[max(0,i-5000):i+2500])
              prefix=js[max(0,i-12000):i]
              for pat in [
                  r'(?:let|const|var)\s+f\s*=\s*["\']([^"\']+)["\']',
                  r'f\s*=\s*["\']([^"\']+)["\']',
                  r'["\']([^"\']*api[^"\']*)["\']'
              ]:
                  vals=re.findall(pat,prefix)
                  if vals: print('CANDIDATE',pat,vals[-20:])
              break
          PY
