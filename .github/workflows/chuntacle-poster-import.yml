name: Chuntacle poster import probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/chuntacle-poster-import.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect transfer page
        env:
          SHARE_URL: https://firestorage.ai/ja/f/pbUqT2KJziaz
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, urllib.request, urllib.parse
          url=os.environ['SHARE_URL']
          headers={'User-Agent':'Mozilla/5.0'}
          def get(u):
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.geturl(),r.headers.get('content-type'),r.read().decode('utf-8','replace')
          final,ctype,body=get(url)
          print('STATUS 200')
          print('FINAL_URL',final)
          print('CONTENT_TYPE',ctype)
          print('BODY_LEN',len(body))
          for term in ['chuntacle-session-','01a0c6b','download','pbUqT2KJziaz']:
              pos=0
              count=0
              while True:
                  i=body.lower().find(term.lower(),pos)
                  if i<0: break
                  print('CONTEXT',term,body[max(0,i-700):i+1400].replace('\\n',' ')[:2200])
                  pos=i+len(term);count+=1
                  if count>=12: break
          scripts=re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']',body)
          for src in scripts:
              if 'app/(files)' not in src and '8437-' not in src and '5841-' not in src and '4899-' not in src:
                  continue
              full=urllib.parse.urljoin(final,src)
              try:
                  _,_,js=get(full)
              except Exception as e:
                  print('SCRIPT_ERROR',full,repr(e));continue
              print('SCRIPT',full,'LEN',len(js))
              for term in ['download','/api/','shareId','fileId','files/']:
                  pos=0;count=0
                  while True:
                      i=js.find(term,pos)
                      if i<0: break
                      print('JS_CONTEXT',term,js[max(0,i-500):i+1100][:1700])
                      pos=i+len(term);count+=1
                      if count>=10: break
          PY
