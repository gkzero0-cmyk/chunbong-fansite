name: One-shot content completion patch
on:
  push:
    branches: [fix/chunbong-content-completion-20261004]
    paths: ['.github/workflows/one-shot-content-completion-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chunbong-content-completion-20261004
      - name: Apply content fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          def once(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              return text.replace(old,new,1)

          p=Path('chunbong-posts-runtime.js'); s=p.read_text()
          old="  const titleNode=card.querySelector('[data-post-title]');if(titleNode&&preview?.title)titleNode.textContent=preview.title;"
          new=old+"\n  const dateNode=card.querySelector('[data-source-date]'),confirmed=String(preview?.date||'').match(/^\\d{4}-\\d{2}-\\d{2}$/)?.[0]||'';if(dateNode&&confirmed){dateNode.dataset.sourceDate=confirmed;dateNode.textContent=confirmed;dateNode.classList.remove('is-unknown')}"
          s=once(s,old,new,'preview date propagation')
          start=s.index('function cardMarkup(row,index){')
          end=s.index('\nfunction normalizePanel(panel){',start)
          card_fn="""function cardMarkup(row,index){
  const url=safeUrl(row.url),previewable=url&&sourceEligible(url),date=row.datePrecision==='unknown'||!row.date?'날짜 확인 중':row.date,type=TYPE_LABELS[row.type]||'게시글',known=row.datePrecision!=='unknown'&&Boolean(row.date);
  return`<article class=\"archive-post-card\" data-archive-post-card data-source-url=\"${escapeHtml(url)}\"><div class=\"archive-post-card-head\"><span class=\"archive-post-index\">${String(index+1).padStart(2,'0')}</span><div class=\"archive-post-main\"><button type=\"button\" class=\"archive-post-title-toggle\" data-source-title-toggle data-source-preview-toggle aria-expanded=\"false\"${previewable?'':' disabled'}><strong data-post-title>${escapeHtml(row.title||'게시글')}</strong></button><small data-source-date=\"${known?escapeHtml(row.date):''}\" class=\"${known?'':'is-unknown'}\">${escapeHtml(type)} · ${escapeHtml(date)}</small></div><div class=\"archive-post-actions\">${url?`<a data-source-external-link=\"true\" href=\"${escapeHtml(url)}\" target=\"_blank\" rel=\"noreferrer noopener\">원문 보기 ↗</a>`:''}</div></div>${previewable?'<div class=\"archive-post-detail\" data-source-notice-detail hidden></div>':''}</article>`;
}"""
          s=s[:start]+card_fn+s[end:]
          s=once(s,"button.setAttribute('aria-expanded',String(open));button.textContent=open?'본문 접기':'본문 펼치기';detail.hidden=!open;","button.setAttribute('aria-expanded',String(open));detail.hidden=!open;",'title toggle text mutation')
          p.write_text(s)

          p=Path('chunbong-contents.js'); s=p.read_text()
          s=once(s,"model.flow=['모집 공지','신청자 확인','합격자 안내','설명회','입주','서버 오픈'];","model.flow=['모집 공지','신청자 확인','합격자 안내','설명회','2차 입주 모집','3차 입주 모집','입주','서버 오픈'];",'survival flow')
          s=once(s,"model.details=[['준비 방송 기록',resultValue(item,'준비 방송 기록')],['2차 입주 모집',resultValue(item,'2차 입주 모집')],['UP 랭킹 원문',resultValue(item,'UP 랭킹 원문')]];","model.details=[['준비 방송 기록',resultValue(item,'준비 방송 기록')],['2차 입주 모집',resultValue(item,'2차 입주 모집')],['3차 입주 모집',resultValue(item,'3차 입주 모집')],['UP 랭킹 원문',resultValue(item,'UP 랭킹 원문')]];",'survival details')
          p.write_text(s)

          p=Path('data/chunbong-contents-seed.json'); data=json.loads(p.read_text())
          item=next(row for row in data['items'] if row.get('id')=='justserver-survival')
          item['status']='ongoing'
          item['summary']='춘봉의 그냥서버 세 번째 시즌 ‘적자생존’. 2026년 9월 30일 오픈해 모집·입주·설명회·방송 기록을 이어서 정리합니다.'
          item['description']='2026년 9월 30일 오픈한 그냥서버 : 적자생존 기록입니다. 공식 위키와 춘봉 SOOP 공식 게시글·설명회 VOD를 중심으로 모집 → 신청 → 합격자 안내 → 설명회 → 2차 입주 모집 → 3차·추가 입주 모집 → 입주 → 서버 오픈 흐름을 정리합니다.'
          results=item.setdefault('results',[])
          if not any(r.get('title')=='3차 입주 모집' for r in results):
              idx=next((i+1 for i,r in enumerate(results) if r.get('title')=='2차 입주 모집'),len(results))
              results.insert(idx,{'title':'3차 입주 모집','value':'2026년 9월 30일 추가 입주 공지 · 3차/추가 입주 모집'})
          timeline=item.setdefault('timeline',[])
          if not any('208517485' in str(r.get('url','')) for r in timeline):
              timeline.append({'id':'survival-soop-post-208517485','type':'post','title':'🦁 그냥서버:적자생존 추가 입주 공지 · 3차 입주 모집','date':'2026-09-30','datePrecision':'day','url':'https://www.sooplive.com/station/chunbongtv/post/208517485','thumbnail':'','sourceId':'source-survival-post-208517485','note':'9월 30일 공개된 적자생존 추가 입주 공지입니다. 외부 공개 게시판의 3차 입주 안내와 교차 확인해 진행 흐름에 반영합니다.','visibility':'public'})
          sources=item.setdefault('sources',[])
          if not any(r.get('id')=='source-survival-post-208517485' for r in sources):
              sources.append({'id':'source-survival-post-208517485','kind':'official','label':'SOOP 방송국 · 적자생존 추가 입주 공지','url':'https://www.sooplive.com/station/chunbongtv/post/208517485','visibility':'public'})
          for row in timeline:
              if row.get('id')=='survival-planned-open': row.update({'title':'적자생존 서버 오픈','note':'2026년 9월 30일 서버가 실제 오픈한 기록입니다.'})
          for row in results:
              if row.get('title')=='예정 기간': row['title']='진행 기간'
              if row.get('title')=='현재 단계': row['value']='서버 진행 중 · 추가 입주 및 운영 기록 갱신 중'
          item['updatedAt']='2026-10-04T06:00:00+09:00'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          node --check chunbong-posts-runtime.js
          node --check chunbong-contents.js
          node --check content-source-card-unifier.js
          node --check content-media-player.js
          node --test test/chunbong-content-completion.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chunbong-posts-runtime.js chunbong-contents.js data/chunbong-contents-seed.json
          git diff --cached --check
          git commit -m 'fix: complete content archive interactions and survival flow'
          git push origin HEAD:fix/chunbong-content-completion-20261004
