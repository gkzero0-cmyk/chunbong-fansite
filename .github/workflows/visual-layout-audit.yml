name: Visual layout audit

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'tests/visual-layout-audit.mjs'
      - '.github/workflows/visual-layout-audit.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'tests/visual-layout-audit.mjs'
      - '.github/workflows/visual-layout-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/visual-layout-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4176/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/visual-layout-http.log
          exit 1
      - name: Audit key viewports
        env:
          BASE_URL: http://127.0.0.1:4176
        run: node tests/visual-layout-audit.mjs
      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-layout-audit
          path: artifacts/visual-audit
          retention-days: 7
          if-no-files-found: warn
