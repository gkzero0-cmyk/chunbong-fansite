name: Site regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check api/_shared.js
          node --check scripts/collect-soop-telemetry.mjs
          node --check scripts/apply-soop-session.mjs
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/update-trackify-soop-cache.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Probe live Chunbong Trackify API
        run: |
          node - <<'NODE'
          const base = 'https://www.trackify.kr/api/v1/p/soop';
          const headers = { 'user-agent':'Mozilla/5.0 Chrome/152', accept:'application/json', 'accept-language':'ko-KR,ko;q=0.9' };
          async function get(path) {
            const response = await fetch(`${base}${path}`, { headers });
            const text = await response.text();
            console.log(`TRACKIFY_API ${path} HTTP=${response.status} BYTES=${text.length}`);
            let json = null;
            try { json = JSON.parse(text); } catch { console.log(text.slice(0,6000)); return null; }
            console.log(JSON.stringify(json, null, 2).slice(0,30000));
            return json;
          }
          const overview = await get('/streamer/chunbongtv?granularity=day&period=2026-09');
          const broadcasts = await get('/streamer/chunbongtv/broadcasts?from=2025-09-01&to=2026-09-06&size=30');
          const trend = await get('/streamer/chunbongtv/trend?metrics=viewer,avgViewer,favorite,fanclub,subscriber&granularity=month&count=12&from=2025-09-01&to=2026-09-06');
          const timeseries = await get('/streamer/chunbongtv/timeseries?from=2026-08-01&to=2026-09-06');
          const categories = await get('/streamer/chunbongtv/category-distribution?from=2026-08-01&to=2026-09-06');
          console.log('TRACKIFY_PROBE_SUMMARY=' + JSON.stringify({
            overviewKeys: overview && typeof overview === 'object' ? Object.keys(overview) : [],
            broadcastKeys: broadcasts && typeof broadcasts === 'object' ? Object.keys(broadcasts) : [],
            broadcastCount: Array.isArray(broadcasts?.data) ? broadcasts.data.length : Array.isArray(broadcasts?.items) ? broadcasts.items.length : null,
            trendKeys: trend && typeof trend === 'object' ? Object.keys(trend) : [],
            timeseriesKeys: timeseries && typeof timeseries === 'object' ? Object.keys(timeseries) : [],
            categoryKeys: categories && typeof categories === 'object' ? Object.keys(categories) : []
          }, null, 2));
          NODE
