name: Site regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check api/_shared.js
          node --check scripts/collect-soop-telemetry.mjs
          node --check scripts/apply-soop-session.mjs
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/update-trackify-soop-cache.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Probe Trackify SPA API routes
        run: |
          node - <<'NODE'
          const base = 'https://www.trackify.kr';
          const headers = { 'user-agent':'Mozilla/5.0 Chrome/152', 'accept-language':'ko-KR,ko;q=0.9' };
          const html = await (await fetch(`${base}/soop/chunbongtv`, { headers })).text();
          const asset = html.match(/<script[^>]+src=["']([^"']*index-[^"']+\.js)["']/i)?.[1];
          if (!asset) throw new Error('Trackify app bundle not found');
          const jsResponse = await fetch(new URL(asset, base), { headers });
          const js = await jsResponse.text();
          console.log(`TRACKIFY_BUNDLE=${asset}`);
          console.log(`TRACKIFY_BUNDLE_HTTP=${jsResponse.status}`);
          console.log(`TRACKIFY_BUNDLE_BYTES=${js.length}`);
          const stringRoutes = [...new Set((js.match(/["'`]([^"'`]*(?:\/api\/|\/soop\/|broadcast|history)[^"'`]*)["'`]/gi) || []).map(token=>token.slice(1,-1)))];
          console.log('TRACKIFY_BUNDLE_ROUTE_STRINGS=' + JSON.stringify(stringRoutes.slice(0,240), null, 2));
          for (const needle of ['broadcast','history','streamer','profile','chunbong','sanctions']) {
            let start = 0;
            let shown = 0;
            console.log(`TRACKIFY_CONTEXT_${needle.toUpperCase()}_BEGIN`);
            while (shown < 12) {
              const at = js.toLowerCase().indexOf(needle, start);
              if (at < 0) break;
              console.log(js.slice(Math.max(0, at - 500), Math.min(js.length, at + 900)));
              start = at + needle.length;
              shown += 1;
            }
            console.log(`TRACKIFY_CONTEXT_${needle.toUpperCase()}_END`);
          }
          NODE
