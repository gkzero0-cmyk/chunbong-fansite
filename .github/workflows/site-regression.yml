name: Site regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Temporary NamuWiki Leopel inspection
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153.0.0.0 Safari/537.36'
          for URL in \
            'https://namu.wiki/w/%EB%A0%88%EC%98%A4%ED%8E%A0' \
            'https://namu.wiki/raw/%EB%A0%88%EC%98%A4%ED%8E%A0'; do
            echo "FETCH=$URL"
            code=$(curl -L --compressed -A "$UA" -H 'Accept-Language: ko-KR,ko;q=0.9' -sS -o /tmp/namu.out -w '%{http_code}' "$URL" || true)
            echo "STATUS=$code BYTES=$(wc -c </tmp/namu.out)"
            python3 - <<'PY'
          import re, html
          raw=open('/tmp/namu.out','r',encoding='utf-8',errors='ignore').read()
          print('HEAD=',re.sub(r'\s+',' ',raw[:500]))
          urls=[]
          for m in re.finditer(r'https?://[^"\'<> ]+',raw):
              u=html.unescape(m.group(0))
              if any(x in u.lower() for x in ['image','namu','arca.live','wstatic','i.namu']):
                  urls.append(u)
          print('IMAGE_URLS_SAMPLE=')
          for u in list(dict.fromkeys(urls))[:40]: print(u[:500])
          for pat in [r'<h[1-6][^>]*>(.*?)</h[1-6]>', r'data-v-[^>]*>([^<]{2,80})<']:
              vals=[]
              for m in re.finditer(pat,raw,re.S|re.I):
                  t=re.sub('<[^>]+>',' ',m.group(1)); t=html.unescape(re.sub(r'\s+',' ',t)).strip()
                  if t and t not in vals: vals.append(t)
              print('TEXT_SAMPLE=',vals[:80])
          PY
          done
      - name: Check JavaScript syntax
        run: |
          node --check service-worker.js
          node --check theme-init.js
          node --check data.js
          node --check data-core.js
          node --check data-soop-periods-v3.js
          node --check data-enhancements.js
          node --check chuntris-engine.js
          node --check chuntris-audio.js
          node --check chuntris-ranking-core.js
          node --check chuntris.js
          node --check minigame-multiplayer.js
          node --check chuntris-multiplayer.js
          node --check score-race-multiplayer.js
          node --check chunbak-game-core.js
          node --check chunbak-ranking-core.js
          node --check chunbak-audio.js
          node --check chunbak.js
          node --check chungwagame-ranking-core.js
          node --check chungwagame.js
          node --check chungwagame-postgame-ranking.js
          node --check chuncortile-core.js
          node --check chuncortile-ranking-core.js
          node --check chuncortile.js
          node --check chuncortile-postgame-ranking.js
          node --check api/content.js
          node --check api/image.js
          node --check api/tarot-reading.js
          node --check api/version.js
          node --check lib/content-api/_shared.js
          node --check lib/content-api/catch-detail.js
          node --check lib/content-api/clips.js
          node --check lib/content-api/fanart.js
          node --check lib/content-api/notice-detail.js
          node --check lib/content-api/notice.js
          node --check lib/content-api/schedule-detail.js
          node --check lib/content-api/schedule.js
          node --check lib/content-api/vod.js
          node --check lib/content-api/youtube.js
          node --check lib/activity-feed.js
          node --check lib/activity.js
          node --check lib/changelog-history-api.js
          node --check lib/push-notifications-api.js
          node --check lib/operator-center-api.js
          node --check site-analytics.js
          node --check feedback-widget.js
          node --check operator.js
          node --check activity-center.js
          node --check daily-fortune.js
          node --check home-overview.js
          node --check personal-hub.js
          node --check api/version.js
          node --check tarot.js
          node --check tarot-sfx-v2-preload.js
          node --check tarot-sfx-v2.js
          node --check page.js
          node --check page-schedule.js
          node --check page-notice.js
          node --check page-media.js
          node --check page-fanart.js
          node --check site-shell.js
          node --check content.js
          node --check changelog.js
          node --check changelog-data.js
          node --check changelog-auto-summary.js
          node --check lib/chuntris-ranking-api.js
          node --check lib/minigame-multiplayer-api.js
          node --check lib/chunbak-ranking-api.js
          node --check lib/chungwagame-ranking-api.js
          node --check lib/chuncortile-ranking-api.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check lib/soop-analytics-base.js
          node --check lib/soop-live-state.js
          node --check lib/soop-follower-history.js
          node --check scripts/collect-soop-telemetry.mjs
          node --check scripts/apply-soop-session.mjs
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/update-trackify-soop-cache.mjs
          node --check scripts/update-soop-follower-history.mjs
          node --check scripts/update-youtube-engagement-cache.mjs
          node --check .github/scripts/vercel-ignore-build.mjs
          node --check .github/scripts/vercel-rate-limit-fast-fail.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
