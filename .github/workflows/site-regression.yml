name: Site regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check api/_shared.js
          node --check scripts/collect-soop-telemetry.mjs
          node --check scripts/apply-soop-session.mjs
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/update-trackify-soop-cache.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Probe Trackify API module
        run: |
          node - <<'NODE'
          const base = 'https://www.trackify.kr';
          const headers = { 'user-agent':'Mozilla/5.0 Chrome/152', 'accept-language':'ko-KR,ko;q=0.9' };
          const chunk = '/assets/TrackifyApi-CyUyuZyo.js';
          const response = await fetch(new URL(chunk, base), { headers });
          const js = await response.text();
          console.log(`TRACKIFY_API_HTTP=${response.status}`);
          console.log(`TRACKIFY_API_BYTES=${js.length}`);
          const literals = [...new Set((js.match(/["'`]([^"'`]*(?:\/api\/|streamer|broadcast|trend|batch|timeseries|category)[^"'`]*)["'`]/gi) || []).map(token=>token.slice(1,-1)))];
          console.log('TRACKIFY_API_LITERALS=' + JSON.stringify(literals, null, 2));
          for (const needle of ['streamerBroadcasts','streamerOverview','streamerTrendMulti','batch','broadcastDetail','streamerTimeseries','streamerCategoryDistribution']) {
            let start=0, shown=0;
            console.log(`TRACKIFY_API_CONTEXT_${needle.toUpperCase()}_BEGIN`);
            while (shown < 8) {
              const at = js.indexOf(needle, start);
              if (at < 0) break;
              console.log(js.slice(Math.max(0, at-1100), Math.min(js.length, at+1800)));
              start = at + needle.length;
              shown++;
            }
            console.log(`TRACKIFY_API_CONTEXT_${needle.toUpperCase()}_END`);
          }
          NODE
