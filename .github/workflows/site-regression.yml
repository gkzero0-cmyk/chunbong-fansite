name: Site regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check api/_shared.js
          node --check scripts/collect-soop-telemetry.mjs
          node --check scripts/apply-soop-session.mjs
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/update-trackify-soop-cache.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Probe live Trackify Chunbong routes
        run: |
          node - <<'NODE'
          const url = 'https://www.trackify.kr/soop/chunbongtv';
          const response = await fetch(url, { headers: { 'user-agent':'Mozilla/5.0 Chrome/152', 'accept-language':'ko-KR,ko;q=0.9' } });
          const html = await response.text();
          console.log(`TRACKIFY_HTTP=${response.status}`);
          console.log(`TRACKIFY_HTML_BYTES=${html.length}`);
          const attrs = [...html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)].map(m=>m[1]);
          console.log('TRACKIFY_ATTR_URLS=' + JSON.stringify([...new Set(attrs)], null, 2));
          const routes = [...new Set((html.match(/(?:https?:\\?\/\\?\/[^"'<>\s]+|\\?\/(?:api|_next|soop)[^"'<>\s]+)/gi) || []))];
          console.log('TRACKIFY_ROUTE_TOKENS=' + JSON.stringify(routes, null, 2));
          const scriptBodies = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(Boolean);
          console.log('TRACKIFY_INLINE_SCRIPTS=' + JSON.stringify(scriptBodies.map((body,i)=>({i,bytes:body.length,preview:body.slice(0,1200)})), null, 2));
          const interesting = html.split(/\n/).filter(line => /broadcast|방송|history|stream|api|next|chunbongtv/i.test(line));
          console.log('TRACKIFY_INTERESTING_HTML=' + interesting.join('\n').slice(0,18000));
          NODE
