name: Apply Tarot SFX volume feature v2

on:
  push:
    branches: [feature/tarot-card-sfx-volume]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tarot-card-sfx-volume
          fetch-depth: 0
      - name: Patch approved Tarot sound feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          js_path = Path('tarot.js')
          html_path = Path('tarot.html')
          css_path = Path('tarot.css')
          js = js_path.read_text()
          html = html_path.read_text()
          css = css_path.read_text()

          if "const volumeKey = 'chunbongTarotVolume';" not in js:
              start = js.index('function createTarotSoundController(')
              end = js.index('\nfunction buildCardInterpretation', start)
              replacement = textwrap.dedent(r'''
              function createTarotSoundController(storage = globalThis.localStorage, AudioContextCtor = globalThis.AudioContext || globalThis.webkitAudioContext) {
                const key = 'chunbongTarotSound';
                const volumeKey = 'chunbongTarotVolume';
                let stored = null;
                let storedVolume = null;
                try {
                  stored = storage?.getItem?.(key);
                  storedVolume = storage?.getItem?.(volumeKey);
                } catch (_) {}
                let isEnabled = stored !== 'off';
                const clampVolume = value => {
                  const number = Number(value);
                  if (!Number.isFinite(number)) return 0.7;
                  return Math.min(1, Math.max(0, number));
                };
                let volumeLevel = storedVolume == null ? 0.7 : clampVolume(storedVolume);
                let context = null;

                const ensureContext = () => {
                  if (!isEnabled || !AudioContextCtor) return null;
                  context ||= new AudioContextCtor();
                  if (context.state === 'suspended') context.resume?.();
                  return context;
                };

                const scaledGain = gain => Math.max(Number(gain || 0) * volumeLevel, 0.0001);

                const tone = (frequency, duration, gain = 0.03, offset = 0, type = 'sine') => {
                  if (volumeLevel <= 0) return;
                  const ctx = ensureContext();
                  if (!ctx) return;
                  const osc = ctx.createOscillator();
                  const amp = ctx.createGain();
                  osc.type = type;
                  osc.frequency.value = frequency;
                  const start = ctx.currentTime + offset;
                  amp.gain.setValueAtTime(scaledGain(gain), start);
                  amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                  osc.connect(amp).connect(ctx.destination);
                  osc.start(start);
                  osc.stop(start + duration);
                };

                const noiseBurst = ({ duration = 0.08, gain = 0.04, frequency = 1200, q = 0.8, offset = 0, type = 'bandpass', startFrequency = null, endFrequency = null } = {}) => {
                  if (volumeLevel <= 0) return;
                  const ctx = ensureContext();
                  if (!ctx) return;
                  const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
                  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
                  const data = buffer.getChannelData(0);
                  for (let index = 0; index < data.length; index += 1) {
                    const progress = index / Math.max(1, data.length - 1);
                    const envelope = Math.sin(Math.PI * progress);
                    data[index] = (Math.random() * 2 - 1) * envelope;
                  }
                  const source = ctx.createBufferSource();
                  const filter = ctx.createBiquadFilter();
                  const amp = ctx.createGain();
                  source.buffer = buffer;
                  filter.type = type;
                  filter.Q.value = q;
                  const start = ctx.currentTime + offset;
                  const firstFrequency = Math.max(40, Number(startFrequency || frequency));
                  filter.frequency.value = firstFrequency;
                  if (endFrequency && typeof filter.frequency.setValueAtTime === 'function' && typeof filter.frequency.exponentialRampToValueAtTime === 'function') {
                    filter.frequency.setValueAtTime(firstFrequency, start);
                    filter.frequency.exponentialRampToValueAtTime(Math.max(40, Number(endFrequency)), start + duration);
                  }
                  amp.gain.setValueAtTime(scaledGain(gain), start);
                  amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                  source.connect(filter).connect(amp).connect(ctx.destination);
                  source.start(start);
                  source.stop(start + duration);
                };

                const cardShuffle = () => {
                  for (let index = 0; index < 8; index += 1) {
                    noiseBurst({
                      duration: 0.052 + (index % 2) * 0.012,
                      gain: 0.052,
                      frequency: 1050 + index * 105,
                      q: 0.72,
                      offset: index * 0.041
                    });
                  }
                  noiseBurst({ duration: 0.22, gain: 0.018, frequency: 620, q: 0.55, offset: 0.02 });
                };

                const cardSlap = () => {
                  noiseBurst({ duration: 0.06, gain: 0.12, frequency: 760, q: 0.45, type: 'lowpass' });
                  noiseBurst({ duration: 0.028, gain: 0.048, frequency: 2300, q: 1.1, offset: 0.012 });
                  tone(118, 0.07, 0.052, 0.004, 'triangle');
                };

                const cardSpread = () => {
                  noiseBurst({ duration: 0.36, gain: 0.072, frequency: 1450, q: 0.72, startFrequency: 680, endFrequency: 2750 });
                  for (let index = 0; index < 5; index += 1) {
                    noiseBurst({ duration: 0.045, gain: 0.025, frequency: 1400 + index * 210, q: 0.95, offset: 0.045 + index * 0.058 });
                  }
                };

                return {
                  enabled: () => isEnabled,
                  volume: () => volumeLevel,
                  unlock: () => { try { ensureContext(); } catch (_) {} },
                  setEnabled(value) {
                    isEnabled = Boolean(value);
                    try { storage?.setItem?.(key, isEnabled ? 'on' : 'off'); } catch (_) {}
                  },
                  setVolume(value) {
                    volumeLevel = clampVolume(value);
                    try { storage?.setItem?.(volumeKey, String(volumeLevel)); } catch (_) {}
                  },
                  play(name) {
                    if (!isEnabled || volumeLevel <= 0) return;
                    try {
                      if (name === 'shuffle') cardShuffle();
                      if (name === 'select') cardSlap();
                      if (name === 'reveal') cardSpread();
                      if (name === 'complete') {
                        tone(440, 0.12, 0.026);
                        tone(554, 0.12, 0.028, 0.11);
                        tone(659, 0.16, 0.03, 0.22);
                      }
                    } catch (_) {}
                  }
                };
              }
              ''').strip()
              js = js[:start] + replacement + js[end:]

          if 'soundVolume: soundController.volume()' not in js:
              js = js.replace(
                  '    soundEnabled: soundController.enabled()\n  };',
                  '    soundEnabled: soundController.enabled(),\n    soundVolume: soundController.volume()\n  };',
                  1
              )

          if 'function updateVolumeUI()' not in js:
              block = textwrap.dedent('''
                function updateSoundToggle() {
                  const button = byId('tarot-sound-toggle');
                  if (!button) return;
                  state.soundEnabled = soundController.enabled();
                  button.setAttribute('aria-pressed', String(state.soundEnabled));
                  button.textContent = state.soundEnabled ? '효과음 ON' : '효과음 OFF';
                }

                function updateVolumeUI() {
                  const current = soundController.volume();
                  const percent = Math.round(current * 100);
                  state.soundVolume = current;
                  const button = byId('tarot-volume-toggle');
                  const range = byId('tarot-volume-range');
                  const output = byId('tarot-volume-value');
                  if (button) button.textContent = `${percent === 0 ? '🔇' : '🔊'} 음량 ${percent}%`;
                  if (range) {
                    range.value = String(percent);
                    range.setAttribute('aria-valuetext', `${percent}%`);
                  }
                  if (output) output.textContent = `${percent}%`;
                }

                function toggleVolumePanel(force) {
                  const button = byId('tarot-volume-toggle');
                  const panel = byId('tarot-volume-panel');
                  if (!button || !panel) return;
                  const expanded = typeof force === 'boolean'
                    ? force
                    : button.getAttribute('aria-expanded') !== 'true';
                  button.setAttribute('aria-expanded', String(expanded));
                  panel.hidden = !expanded;
                }
              ''').strip()
              pattern = r"  function updateSoundToggle\(\) \{.*?\n  \}"
              js, count = re.subn(pattern, block, js, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('updateSoundToggle function not found')

          if '    updateVolumeUI();' not in js:
              anchor = '    updateSoundToggle();\n    setup.addEventListener(\'change\', event => {'
              if anchor not in js:
                  raise SystemExit('setup updateSoundToggle anchor not found')
              js = js.replace(anchor, '    updateSoundToggle();\n    updateVolumeUI();\n    setup.addEventListener(\'change\', event => {', 1)

          if "byId('tarot-volume-toggle')?.addEventListener" not in js:
              listener = textwrap.dedent('''
                byId('tarot-sound-toggle').addEventListener('click', () => {
                  soundController.unlock();
                  soundController.setEnabled(!soundController.enabled());
                  updateSoundToggle();
                });
                byId('tarot-volume-toggle')?.addEventListener('click', () => {
                  toggleVolumePanel();
                });
                byId('tarot-volume-range')?.addEventListener('input', event => {
                  soundController.unlock();
                  soundController.setVolume(Number(event.target.value) / 100);
                  updateVolumeUI();
                });
                byId('tarot-volume-panel')?.addEventListener('keydown', event => {
                  if (event.key !== 'Escape') return;
                  toggleVolumePanel(false);
                  byId('tarot-volume-toggle')?.focus();
                });
              ''').strip()
              listener = '\n'.join('    ' + line if line else line for line in listener.splitlines())
              pattern = r"    byId\('tarot-sound-toggle'\)\.addEventListener\('click', \(\) => \{.*?\n    \}\);"
              js, count = re.subn(pattern, listener, js, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('sound toggle listener not found')

          old_actions = '<div class="tarot-setup-actions"><button id="tarot-shuffle" class="btn btn-primary" type="submit">숫자로 카드 열기</button><button id="tarot-sound-toggle" class="tarot-sound-toggle" type="button" aria-pressed="true">효과음 ON</button></div>'
          new_actions = '<div class="tarot-setup-actions"><button id="tarot-shuffle" class="btn btn-primary" type="submit">숫자로 카드 열기</button><button id="tarot-sound-toggle" class="tarot-sound-toggle" type="button" aria-pressed="true">효과음 ON</button><div class="tarot-volume-control"><button id="tarot-volume-toggle" class="tarot-volume-toggle" type="button" aria-expanded="false" aria-controls="tarot-volume-panel">🔊 음량 70%</button><div id="tarot-volume-panel" class="tarot-volume-panel" hidden><input id="tarot-volume-range" type="range" min="0" max="100" step="1" value="70" aria-label="효과음 음량"><output id="tarot-volume-value" for="tarot-volume-range">70%</output></div></div></div>'
          if 'id="tarot-volume-toggle"' not in html:
              if old_actions not in html:
                  raise SystemExit('tarot setup actions anchor not found')
              html = html.replace(old_actions, new_actions, 1)

          if '.tarot-volume-control{' not in css:
              css += '\n.tarot-volume-control{position:relative;display:inline-flex;align-items:center}.tarot-volume-toggle{padding:11px 15px;border:1px solid #4b4039;border-radius:999px;background:#0d0d0d;color:#d7cec7;font-weight:850;cursor:pointer;white-space:nowrap}.tarot-volume-toggle:hover,.tarot-volume-toggle:focus-visible{border-color:#ff8b4866;color:var(--orange-2);outline:0}.tarot-volume-toggle[aria-expanded="true"]{border-color:#ff8b4866;color:var(--orange-2);background:#ff6b1810}.tarot-volume-panel{position:absolute;z-index:30;left:0;top:calc(100% + 9px);display:flex;align-items:center;gap:10px;min-width:230px;padding:12px 14px;border:1px solid #42362f;border-radius:14px;background:#0b0b0bf2;box-shadow:0 14px 38px #0009;backdrop-filter:blur(12px)}.tarot-volume-panel[hidden]{display:none!important}.tarot-volume-panel input[type="range"]{width:160px;accent-color:var(--orange);cursor:pointer}.tarot-volume-panel output{min-width:38px;color:var(--orange-2);font-size:12px;font-weight:950;text-align:right}@media(max-width:430px){.tarot-volume-panel{left:auto;right:0;min-width:210px}.tarot-volume-panel input[type="range"]{width:140px}}\n'

          js_path.write_text(js)
          html_path.write_text(html)
          css_path.write_text(css)
          PY
      - name: Verify feature regression
        run: |
          node --check tarot.js
          node tests/tarot-card-sfx-volume-regression.mjs
          node tests/tarot-effects-audio-regression.mjs
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tarot.js tarot.html tarot.css
          if git diff --cached --quiet; then
            echo "Feature already applied"
            exit 0
          fi
          git commit -m "feat: improve Tarot card sound effects and volume control"
          git push origin HEAD:feature/tarot-card-sfx-volume
