name: SOOP follower merge fix

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-follower-merge-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve exact follower history through null snapshots
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/soop-analytics.js')
          text = p.read_text()
          old = '''    const existing = byDate.get(date) || { date, capturedAt: snapshot?.capturedAt || '', soop: {} };
    byDate.set(date, {
      ...existing,
      ...snapshot,
      date,
      soop: {
        ...(existing.soop || {}),
        ...(snapshot.soop || {})
      }
    });'''
          new = '''    const existing = byDate.get(date) || { date, capturedAt: snapshot?.capturedAt || '', soop: {} };
    const snapshotSoop = snapshot?.soop && typeof snapshot.soop === 'object' ? snapshot.soop : {};
    const mergedSoop = {
      ...(existing.soop || {}),
      ...snapshotSoop
    };
    if (finite(snapshotSoop.followerCount) === null && finite(existing?.soop?.followerCount) !== null) {
      mergedSoop.followerCount = existing.soop.followerCount;
    }
    byDate.set(date, {
      ...existing,
      ...snapshot,
      date,
      soop: mergedSoop
    });'''
          if old not in text:
              raise SystemExit('expected mergeFollowerSnapshots block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused regression
        run: node tests/soop-analytics-regression.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/soop-analytics.js
          if git diff --cached --quiet; then
            echo 'No merge fix changes'
            exit 0
          fi
          git commit -m 'fix: preserve exact SOOP favorite history'
          git pull --rebase origin feat/soop-history-live-category-controls
          git push origin HEAD:feat/soop-history-live-category-controls
