name: Apply hardening round2

on:
  push:
    branches:
      - improve/site-hardening-round2-20261001
    paths:
      - '.github/scripts/apply-hardening-round2.mjs'
      - '.github/workflows/apply-hardening-round2.yml'

permissions:
  contents: write

concurrency:
  group: apply-hardening-round2
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/site-hardening-round2-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped source changes
        run: node .github/scripts/apply-hardening-round2.mjs
      - name: Verify syntax and focused regression tests
        run: |
          node --check operator-redis-diagnostics.js
          node --check operator.js
          node --check service-worker.js
          node --check page.js
          node --check api/crew-news-batch.js
          node --check lib/operator-center-api.js
          node --test test/operator-redis-degraded-mode.test.js test/realtime-redis-isolation.test.js test/pwa-cache-contract.test.js test/workflow-budget.test.js test/crew-news-batch-regression.test.js
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operator-redis-diagnostics.js lib/operator-center-api.js operator.js service-worker.js page.js operator.html api/crew-news-batch.js .github/workflows/site-audit-tests.yml .github/workflows/site-regression.yml .github/workflows/operator-center-browser-smoke.yml
          git diff --cached --check
          git commit -m 'fix: harden site resource isolation [hardening-applied]'
          git push origin HEAD:improve/site-hardening-round2-20261001
