name: Apply realtime Redis isolation

on:
  workflow_dispatch:
  push:
    branches: [perf/realtime-redis-isolation-20260930]
    paths:
      - '.github/workflows/apply-realtime-redis-isolation.yml'
      - 'scripts/apply-realtime-redis-isolation.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/realtime-redis-isolation-20260930
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/apply-realtime-redis-isolation.mjs
      - name: Verify targeted regression
        run: node tests/realtime-redis-isolation-regression.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/push-notifications-api.js lib/minigame-multiplayer-api.js lib/chuntris-ranking-api.js lib/chunbak-ranking-api.js lib/chungwagame-ranking-api.js lib/chuncortile-ranking-api.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: route realtime features through dedicated Redis"
          git push origin HEAD:perf/realtime-redis-isolation-20260930
