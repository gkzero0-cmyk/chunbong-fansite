name: Activity center production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content.js'
      - 'page.js'
      - 'activity-center.js'
      - 'activity-center.css'
      - 'changelog-data.js'
      - 'changelog.js'
      - 'changelog.css'
      - 'changelog.html'
      - 'lib/activity.js'
      - 'api/content.js'
      - 'api/fanart.js'
      - 'lib/activity-feed.js'
      - '.github/workflows/activity-center-production-smoke.yml'
      - '.github/scripts/production-readiness-gate.mjs'

permissions:
  contents: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production readiness gate
        id: production_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-readiness-gate.mjs

      - name: Wait for current activity-center production
        if: steps.production_gate.outputs.ready == 'true'
        env:
          BASE_URL: https://chunbong-fansite.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp=$(date +%s)
            if curl -fsS -H 'cache-control: no-cache' "$BASE_URL/activity-center.js?_smoke=$stamp" -o /tmp/activity-center.js && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/activity-center.css?_smoke=$stamp" -o /tmp/activity-center.css && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/site-improvements.js?_smoke=$stamp" -o /tmp/site-improvements.js && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/content?type=activity&_smoke=$stamp" -o /tmp/activity.json && \
               curl -fsS -H 'cache-control: no-cache' "$BASE_URL/api/content?type=changelog-history&summary=1&_smoke=$stamp" -o /tmp/changelog-summary.json && \
               grep -q 'chunbong-activity-seen-v1' /tmp/activity-center.js && \
               grep -q 'activity-unread-dot' /tmp/activity-center.js && \
               grep -q "link.innerHTML='<span aria-hidden=\"true\">MY</span>'" /tmp/site-improvements.js && \
               node -e "const p=require('/tmp/activity.json'); if(!Array.isArray(p.items)||!p.items.length) process.exit(1); for(const x of p.items){if(!x.id||!x.type||!x.title||!x.href)process.exit(1)}" && \
               node -e "const p=require('/tmp/changelog-summary.json'); if(p.siteStartedAt!=='2026-08-30'||!p.latest?.sha) process.exit(1)"; then
              echo 'Current activity center production is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for current activity center production.'
          exit 1

      - name: Install Playwright Chromium
        if: steps.production_gate.outputs.ready == 'true'
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify production bell and read state
        if: steps.production_gate.outputs.ready == 'true'
        env:
          BASE_URL: https://chunbong-fansite.vercel.app
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const context=await browser.newContext({viewport,isMobile:viewport.width<=390,hasTouch:viewport.width<=390});
              const page=await context.newPage();
              const errors=[];page.on('pageerror',error=>errors.push(error.message));
              await page.goto(`${process.env.BASE_URL}/index.html?_activity_smoke=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForSelector('.activity-bell',{state:'visible',timeout:30000});
              await page.waitForSelector('.theme-toggle',{state:'visible',timeout:30000});
              await page.waitForSelector('.changelog-button',{state:'visible',timeout:30000});
              await page.waitForFunction(()=>document.querySelector('.site-header')&&document.querySelector('.activity-center'));
              assert.equal(await page.locator('.header-live[href*="sooplive.com"]').count(),0);
              const headerOrder=await page.locator('.site-header').evaluate(el=>[...el.children].map(node=>node.className||node.tagName));
              const themeIndex=headerOrder.findIndex(value=>String(value).includes('theme-toggle'));
              const changelogIndex=headerOrder.findIndex(value=>String(value).includes('changelog-button'));
              const activityIndex=headerOrder.findIndex(value=>String(value).includes('activity-center'));
              assert.ok(themeIndex>=0&&changelogIndex>themeIndex&&activityIndex>changelogIndex);
              const response=await page.evaluate(async()=>{const r=await fetch('/api/content?type=activity',{headers:{accept:'application/json'}});return {status:r.status,payload:await r.json()}});
              assert.equal(response.status,200);assert.ok(Array.isArray(response.payload.items)&&response.payload.items.length>0);
              const fortune=page.locator('#daily-fortune-dialog[open]');
              if(await fortune.count()){const close=fortune.locator('[data-daily-fortune-close]');if(await close.count())await close.click();else await fortune.evaluate(node=>node.close());await fortune.waitFor({state:'hidden'});}
              assert.equal(await page.locator('.activity-unread-dot').isVisible(),true);
              await page.locator('.activity-bell').click();
              assert.ok(await page.locator('.activity-panel').isVisible());
              assert.equal(await page.locator('.activity-unread-dot').isVisible(),false);
              assert.ok(await page.locator('.activity-item').count()>0);
              const seen=await page.evaluate(()=>JSON.parse(localStorage.getItem('chunbong-activity-seen-v1')||'{}'));
              assert.ok(Array.isArray(seen.ids)&&seen.ids.length>0);
              if(viewport.width<=390){
                const panel=await page.locator('.activity-panel').boundingBox();const bell=await page.locator('.activity-bell').boundingBox();
                const header=await page.locator('.site-header').evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth}));
                assert.ok(panel&&panel.x>=0&&panel.x+panel.width<=viewport.width&&panel.y>=0&&panel.y+panel.height<=viewport.height);
                assert.ok(bell&&bell.x>=0&&bell.x+bell.width<=viewport.width);assert.ok(header.scrollWidth<=header.clientWidth+1);
              }
              assert.deepEqual(errors,[]);
              await context.close();
            }
          }finally{await browser.close();}
          EOF_NODE

      - name: Production blocked
        if: steps.production_gate.outputs.blocked == 'true'
        run: echo 'Activity production smoke is waiting for the Vercel cooldown; Playwright was not installed.'
