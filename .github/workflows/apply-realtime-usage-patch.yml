name: Apply realtime usage telemetry patch
on:
  push:
    branches:
      - feat/realtime-redis-usage-20260930
    paths:
      - .github/workflows/apply-realtime-usage-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/realtime-redis-usage-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path,old,new):
              p=Path(path); text=p.read_text()
              if text.count(old)!=1: raise SystemExit(f'{path}: expected one match, got {text.count(old)} for {old[:80]!r}')
              p.write_text(text.replace(old,new,1))
          def insert_before(path,marker,insert):
              p=Path(path); text=p.read_text()
              if text.count(marker)!=1: raise SystemExit(f'{path}: marker count {text.count(marker)} for {marker[:80]!r}')
              p.write_text(text.replace(marker,insert+marker,1))
          def insert_after(path,marker,insert):
              p=Path(path); text=p.read_text()
              if text.count(marker)!=1: raise SystemExit(f'{path}: marker count {text.count(marker)} for {marker[:80]!r}')
              p.write_text(text.replace(marker,marker+insert,1))

          api='lib/operator-center-api.js'
          replace_once(api,
            "const pushNotifications=require('./push-notifications-api');\n",
            "const pushNotifications=require('./push-notifications-api');\nconst realtimeUpstashUsage=require('./realtime-upstash-usage');\n")
          insert_before(api,"function recordHealthStateMemory(summary={}){",
            "async function realtimeUpstashUsageStatus(){return realtimeUpstashUsage.status()}\n")
          replace_once(api,
            "  const [github,endpoints,changelog,redisUsage]=await Promise.all([\n    githubProjectState(),\n    publicEndpointHealth(base,{includePush:deepStorage}),\n    changelogStatus(base),\n    upstashUsageStatus()\n  ]);",
            "  const [github,endpoints,changelog,redisUsage,realtimeRedisUsage]=await Promise.all([\n    githubProjectState(),\n    publicEndpointHealth(base,{includePush:deepStorage}),\n    changelogStatus(base),\n    upstashUsageStatus(),\n    realtimeUpstashUsageStatus()\n  ]);")
          replace_once(api,
            "  const redisUsagePct=Number(redisUsage.usedPct);\n  const redisLevel=circuitLimited||redisOk===false||(Number.isFinite(redisUsagePct)&&redisUsagePct>=95)?'limit':Number.isFinite(redisUsagePct)&&redisUsagePct>=75?'warn':'ok';\n  const quotaSignals=[\n    {id:'redis',label:'Redis / KV',level:redisLevel,detail:circuitLimited?'circuit breaker 활성':redisUsage.exact?('월간 '+redisUsage.usedPct+'% 사용'):deepStorage?(redisOk?'수동 상세 확인 정상':'수동 상세 확인 실패'):'기본 화면 Redis 무조회'},",
            "  const redisUsagePct=Number(redisUsage.usedPct);\n  const redisLevel=circuitLimited||redisOk===false||(Number.isFinite(redisUsagePct)&&redisUsagePct>=95)?'limit':Number.isFinite(redisUsagePct)&&redisUsagePct>=75?'warn':'ok';\n  const realtimeUsagePct=Number(realtimeRedisUsage.usedPct);\n  const realtimeLevel=realtimeRedisUsage.exact&&Number.isFinite(realtimeUsagePct)&&realtimeUsagePct>=95?'limit':realtimeRedisUsage.exact&&Number.isFinite(realtimeUsagePct)&&realtimeUsagePct>=75?'warn':'ok';\n  const quotaSignals=[\n    {id:'redis',label:'Operator Redis',level:redisLevel,detail:circuitLimited?'circuit breaker 활성':redisUsage.exact?('월간 '+redisUsage.usedPct+'% 사용'):deepStorage?(redisOk?'수동 상세 확인 정상':'수동 상세 확인 실패'):'기본 화면 Redis 무조회'},\n    {id:'realtime-redis',label:'Realtime Redis',level:realtimeLevel,detail:realtimeRedisUsage.exact?('월간 '+realtimeRedisUsage.usedPct+'% 사용'):'실측 연결 대기'},")
          replace_once(api,
            "    redisUsage,\n    services:",
            "    redisUsage,\n    realtimeRedisUsage,\n    services:")

          html='operator.html'
          marker='''          </section>\n          <div class="operator-budget-grid">\n            <div><span>분석 표본</span><b id="system-budget-sample">-</b></div>'''
          realtime_panel='''          <section class="operator-redis-usage-panel" aria-label="Realtime Redis 월간 사용량">\n            <div class="operator-section-title-row"><div><strong>Realtime Redis 월간 사용량</strong><small id="system-realtime-redis-usage-source">별도 Upstash 계정 관리 API 연결 상태를 확인하고 있습니다.</small></div><span>Push · 랭킹 · 멀티플레이</span></div>\n            <div class="operator-budget-grid operator-redis-usage-grid">\n              <div><span>이번 달 사용</span><b id="system-realtime-redis-monthly-used">-</b></div>\n              <div><span>남은 양</span><b id="system-realtime-redis-monthly-remaining">-</b></div>\n              <div><span>사용률</span><b id="system-realtime-redis-monthly-pct">-</b></div>\n              <div><span>오늘 commands</span><b id="system-realtime-redis-daily-commands">-</b></div>\n              <div><span>월간 읽기</span><b id="system-realtime-redis-monthly-read">-</b></div>\n              <div><span>월간 쓰기</span><b id="system-realtime-redis-monthly-write">-</b></div>\n              <div><span>현재 저장량</span><b id="system-realtime-redis-current-storage">-</b></div>\n            </div>\n            <p class="operator-usage-note"><strong>별도 계정 실측</strong><span>REALTIME_UPSTASH_EMAIL / REALTIME_UPSTASH_API_KEY가 연결된 경우에만 Upstash Developer API 실측값을 표시합니다. 미연결 상태에서는 숫자를 추정하지 않습니다.</span></p>\n          </section>\n'''
          replace_once(html,marker,"          </section>\n"+realtime_panel+"          <div class=\"operator-budget-grid\">\n            <div><span>분석 표본</span><b id=\"system-budget-sample\">-</b></div>")

          ui='operator.js'
          replace_once(ui,
            "  const dep=data.deployment||{},storage=data.storage||{},services=data.services||{},traffic=data.traffic||currentAnalytics||{},redisUsage=data.redisUsage||{};",
            "  const dep=data.deployment||{},storage=data.storage||{},services=data.services||{},traffic=data.traffic||currentAnalytics||{},redisUsage=data.redisUsage||{},realtimeRedisUsage=data.realtimeRedisUsage||{};")
          marker_ui="  if(usageStorage)usageStorage.textContent=bytesLabel(redisUsage.currentStorageBytes);\n"
          realtime_render="""  const rtUsageUsed=$('#system-realtime-redis-monthly-used'),rtUsageRemaining=$('#system-realtime-redis-monthly-remaining'),rtUsagePct=$('#system-realtime-redis-monthly-pct'),rtUsageSource=$('#system-realtime-redis-usage-source'),rtUsageRead=$('#system-realtime-redis-monthly-read'),rtUsageWrite=$('#system-realtime-redis-monthly-write'),rtUsageDaily=$('#system-realtime-redis-daily-commands'),rtUsageStorage=$('#system-realtime-redis-current-storage');\n  if(rtUsageUsed)rtUsageUsed.textContent=realtimeRedisUsage.exact?fmt(realtimeRedisUsage.used)+' / '+fmt(realtimeRedisUsage.monthlyLimit):'실측 연결 대기';\n  if(rtUsageRemaining)rtUsageRemaining.textContent=realtimeRedisUsage.exact?fmt(realtimeRedisUsage.remaining)+'회':'-';\n  if(rtUsagePct){rtUsagePct.textContent=realtimeRedisUsage.exact?Number(realtimeRedisUsage.usedPct).toFixed(1)+'%':'-';rtUsagePct.className=realtimeRedisUsage.exact&&Number(realtimeRedisUsage.usedPct)>=95?'is-bad':realtimeRedisUsage.exact&&Number(realtimeRedisUsage.usedPct)>=75?'is-warn':realtimeRedisUsage.exact?'is-ok':''}\n  if(rtUsageSource)rtUsageSource.textContent=realtimeRedisUsage.exact?'별도 Upstash 관리 API 실측 · Redis command 소모 없음':realtimeRedisUsage.source==='developer_api_not_configured'?'실측 연결 대기 · Realtime Developer API 미연결':'Realtime 관리 API에서 실측값을 가져오지 못했습니다.';\n  if(rtUsageRead)rtUsageRead.textContent=realtimeRedisUsage.reads===null||realtimeRedisUsage.reads===undefined?'-':fmt(realtimeRedisUsage.reads);\n  if(rtUsageWrite)rtUsageWrite.textContent=realtimeRedisUsage.writes===null||realtimeRedisUsage.writes===undefined?'-':fmt(realtimeRedisUsage.writes);\n  if(rtUsageDaily)rtUsageDaily.textContent=realtimeRedisUsage.dailyCommands===null||realtimeRedisUsage.dailyCommands===undefined?'-':fmt(realtimeRedisUsage.dailyCommands);\n  if(rtUsageStorage)rtUsageStorage.textContent=bytesLabel(realtimeRedisUsage.currentStorageBytes);\n"""
          insert_after(ui,marker_ui,realtime_render)
          PY
          node tests/realtime-redis-usage-regression.mjs
          node --check lib/realtime-upstash-usage.js
          node --check lib/operator-center-api.js
          node --check operator.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/operator-center-api.js operator.html operator.js
          git commit -m 'feat: show realtime Redis usage separately'
          git push origin HEAD:feat/realtime-redis-usage-20260930
