name: Production prebuilt recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/recovery/production-prebuilt.trigger'

permissions:
  contents: read
  statuses: write

jobs:
  deploy-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: gkzero0-9465
      VERCEL_PROJECT: chunbong-fansite
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://chunbong-fansite.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check recovery availability and Vercel cooldown
        id: availability
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'can_deploy=false' >> "$GITHUB_OUTPUT"
            echo 'reason=missing_token' >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN repository secret is not configured. Prebuilt recovery is unavailable until the secret is added."
            exit 0
          fi

          RATE_LIMIT_CREATED_AT="$(
            node --input-type=module <<'NODE'
          const headers = {
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28'
          };
          const repository = process.env.GITHUB_REPOSITORY;
          const commitsResponse = await fetch(`https://api.github.com/repos/${repository}/commits?sha=main&per_page=100`, { headers });
          if (!commitsResponse.ok) throw new Error(`commit lookup failed: ${commitsResponse.status}`);
          const commits = await commitsResponse.json();
          const nowMs = Date.now();
          const scanWindowMs = (86400 + 7200) * 1000;
          let oldestRateLimitCreatedAt = '';
          for (const commit of commits) {
            const commitTime = Date.parse(commit?.commit?.committer?.date || commit?.commit?.author?.date || '');
            if (Number.isFinite(commitTime) && nowMs - commitTime > scanWindowMs) break;
            const response = await fetch(`https://api.github.com/repos/${repository}/commits/${commit.sha}/status`, { headers });
            if (!response.ok) continue;
            const combined = await response.json();
            const limited = (combined.statuses || []).find(status =>
              status.context === 'Vercel' && (
                /rate limited|resource is limited|try again in 24 hours/i.test(String(status.description || '')) ||
                /build-rate-limit/i.test(String(status.target_url || ''))
              )
            );
            if (limited?.created_at) oldestRateLimitCreatedAt = limited.created_at;
          }
          if (oldestRateLimitCreatedAt) process.stdout.write(oldestRateLimitCreatedAt);
          NODE
          )"

          if [[ -n "$RATE_LIMIT_CREATED_AT" ]]; then
            NOW_TS="$(date +%s)"
            LIMIT_TS="$(date -d "$RATE_LIMIT_CREATED_AT" +%s)"
            AGE_SECONDS="$((NOW_TS - LIMIT_TS))"
            if [[ "$AGE_SECONDS" -lt 86400 ]]; then
              RETRY_AT="$((LIMIT_TS + 86400))"
              echo 'can_deploy=false' >> "$GITHUB_OUTPUT"
              echo 'reason=vercel_deployment_quota_cooldown' >> "$GITHUB_OUTPUT"
              echo "retry_at=$RETRY_AT" >> "$GITHUB_OUTPUT"
              echo "::warning::Vercel deployment quota is cooling down. Prebuilt upload is intentionally skipped until at least $(date -d "@$RETRY_AT" --iso-8601=seconds)."
              exit 0
            fi
          fi

          echo 'can_deploy=true' >> "$GITHUB_OUTPUT"
          echo 'reason=ready' >> "$GITHUB_OUTPUT"

      - name: Publish recovery availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reason='${{ steps.availability.outputs.reason }}'
          if [[ "${{ steps.availability.outputs.can_deploy }}" == "true" ]]; then
            state='pending'
            description='VERCEL_TOKEN available; prebuilt recovery starting'
          elif [[ "$reason" == 'vercel_deployment_quota_cooldown' ]]; then
            state='error'
            description='Vercel deployment quota cooling down; prebuilt upload skipped'
          else
            state='error'
            description='VERCEL_TOKEN missing; prebuilt recovery unavailable'
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:'Prebuilt Recovery',description:process.argv[2]}))" "$state" "$description")"

      - name: Link Vercel project
        if: steps.availability.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx --yes vercel@latest pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build production output locally
        if: steps.availability.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        if: steps.availability.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --env "DEPLOY_COMMIT_SHA=$GITHUB_SHA"

      - name: Verify production commit and new home
        if: steps.availability.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp=$(date +%s)
            version="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/api/version?_ts=$stamp" || true)"
            home="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/index.html?_ts=$stamp" || true)"
            improvements="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/site-improvements.js?_ts=$stamp" || true)"
            actual="$(printf '%s' "$version" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"
            if [[ "$actual" == "$GITHUB_SHA" ]] && grep -Fq 'CHUNBONG FAN HUB' <<<"$home" && grep -Fq 'TODAY AT CHUNBONG' <<<"$improvements"; then
              echo "Production synced to $GITHUB_SHA"
              exit 0
            fi
            echo "attempt=$attempt expected=$GITHUB_SHA actual=${actual:-missing}"
            sleep 5
          done
          echo 'Production prebuilt deploy verification failed.' >&2
          exit 1

      - name: Publish recovery success
        if: success() && steps.availability.outputs.can_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"Prebuilt Recovery","description":"Production prebuilt recovery completed"}'

      - name: Publish recovery failure
        if: failure() && steps.availability.outputs.can_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"failure","context":"Prebuilt Recovery","description":"Production prebuilt recovery failed"}'

      - name: Recovery intentionally skipped
        if: steps.availability.outputs.can_deploy != 'true'
        run: |
          echo "Prebuilt recovery skipped: ${{ steps.availability.outputs.reason }}"
          if [[ -n "${{ steps.availability.outputs.retry_at }}" ]]; then
            echo "retry_at_epoch=${{ steps.availability.outputs.retry_at }}"
          fi
