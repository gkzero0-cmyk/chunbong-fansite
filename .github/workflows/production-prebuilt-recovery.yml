name: Production prebuilt recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/recovery/production-prebuilt.trigger'

permissions:
  contents: read
  statuses: write

jobs:
  deploy-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: gkzero0-9465
      VERCEL_PROJECT: chunbong-fansite
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROD_URL: https://chunbong-fansite.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Vercel token availability
        id: token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'can_deploy=false' >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN repository secret is not configured. Prebuilt recovery is unavailable until the secret is added."
          else
            echo 'can_deploy=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish recovery availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.token.outputs.can_deploy }}" == "true" ]]; then
            state='pending'
            description='VERCEL_TOKEN available; prebuilt recovery starting'
          else
            state='error'
            description='VERCEL_TOKEN missing; prebuilt recovery unavailable'
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$(node -e "process.stdout.write(JSON.stringify({state:process.argv[1],context:'Prebuilt Recovery',description:process.argv[2]}))" "$state" "$description")"

      - name: Check whether production already matches this commit
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date +%s)"
          body="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/api/version?_ts=$stamp" || true)"
          actual="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"
          if [[ "$actual" == "$GITHUB_SHA" ]]; then
            echo 'needs_deploy=false' >> "$GITHUB_OUTPUT"
            echo "Production already synced to $GITHUB_SHA; recovery deploy is unnecessary."
          else
            echo 'needs_deploy=true' >> "$GITHUB_OUTPUT"
            echo "Production recovery needed: expected=$GITHUB_SHA actual=${actual:-missing}"
          fi

      - name: Validate Vercel CLI token
        if: steps.token.outputs.can_deploy == 'true' && steps.sync.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN"

      - name: Link Vercel project
        if: steps.token.outputs.can_deploy == 'true' && steps.sync.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          npx --yes vercel@latest pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Build production output locally
        if: steps.token.outputs.can_deploy == 'true' && steps.sync.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest build --prod --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        if: steps.token.outputs.can_deploy == 'true' && steps.sync.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prebuilt --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --env "DEPLOY_COMMIT_SHA=$GITHUB_SHA"

      - name: Verify production commit and new home
        if: steps.token.outputs.can_deploy == 'true' && steps.sync.outputs.needs_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            stamp=$(date +%s)
            version="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/api/version?_ts=$stamp" || true)"
            home="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/index.html?_ts=$stamp" || true)"
            improvements="$(curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/site-improvements.js?_ts=$stamp" || true)"
            actual="$(printf '%s' "$version" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"
            if [[ "$actual" == "$GITHUB_SHA" ]] && grep -Fq 'CHUNBONG FAN HUB' <<<"$home" && grep -Fq 'TODAY AT CHUNBONG' <<<"$improvements"; then
              echo "Production synced to $GITHUB_SHA"
              exit 0
            fi
            echo "attempt=$attempt expected=$GITHUB_SHA actual=${actual:-missing}"
            sleep 5
          done
          echo 'Production prebuilt deploy verification failed.' >&2
          exit 1

      - name: Publish recovery success
        if: success() && steps.token.outputs.can_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d '{"state":"success","context":"Prebuilt Recovery","description":"Production prebuilt recovery completed"}'

      - name: Publish recovery failure
        if: failure() && steps.token.outputs.can_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d '{"state":"failure","context":"Prebuilt Recovery","description":"Production prebuilt recovery failed"}'

      - name: Recovery unavailable without token
        if: steps.token.outputs.can_deploy != 'true'
        run: echo 'Skipped prebuilt recovery because VERCEL_TOKEN is not configured.'
