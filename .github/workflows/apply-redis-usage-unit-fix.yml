name: Apply Redis usage unit fix
on:
  push:
    branches:
      - fix/redis-usage-units-20260930
    paths:
      - .github/workflows/apply-redis-usage-unit-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/redis-usage-units-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply unit-safe labels and rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              n=text.count(old)
              if n!=1: raise SystemExit(f'{path}: expected one match, got {n}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          html='operator.html'
          replacements={
            '<div><span>이번 달 사용</span><b id="system-redis-monthly-used">-</b></div>':'<div><span>월간 API 요청</span><b id="system-redis-monthly-used">-</b></div>',
            '<div><span>남은 양</span><b id="system-redis-monthly-remaining">-</b></div>':'<div><span>잔여 command</span><b id="system-redis-monthly-remaining">정확 계산 불가</b></div>',
            '<div><span>사용률</span><b id="system-redis-monthly-pct">-</b></div>':'<div><span>command 사용률</span><b id="system-redis-monthly-pct">계산 안 함</b></div>',
            '<div><span>오늘 commands</span><b id="system-redis-daily-commands">-</b></div>':'<div><span>오늘 Redis commands</span><b id="system-redis-daily-commands">-</b></div>',
            '<div><span>월간 읽기</span><b id="system-redis-monthly-read">-</b></div>':'<div><span>월간 읽기 요청</span><b id="system-redis-monthly-read">-</b></div>',
            '<div><span>월간 쓰기</span><b id="system-redis-monthly-write">-</b></div>':'<div><span>월간 쓰기 요청</span><b id="system-redis-monthly-write">-</b></div>',
            '<div><span>이번 달 사용</span><b id="system-realtime-redis-monthly-used">-</b></div>':'<div><span>월간 API 요청</span><b id="system-realtime-redis-monthly-used">-</b></div>',
            '<div><span>남은 양</span><b id="system-realtime-redis-monthly-remaining">-</b></div>':'<div><span>잔여 command</span><b id="system-realtime-redis-monthly-remaining">정확 계산 불가</b></div>',
            '<div><span>사용률</span><b id="system-realtime-redis-monthly-pct">-</b></div>':'<div><span>command 사용률</span><b id="system-realtime-redis-monthly-pct">계산 안 함</b></div>',
            '<div><span>오늘 commands</span><b id="system-realtime-redis-daily-commands">-</b></div>':'<div><span>오늘 Redis commands</span><b id="system-realtime-redis-daily-commands">-</b></div>',
            '<div><span>월간 읽기</span><b id="system-realtime-redis-monthly-read">-</b></div>':'<div><span>월간 읽기 요청</span><b id="system-realtime-redis-monthly-read">-</b></div>',
            '<div><span>월간 쓰기</span><b id="system-realtime-redis-monthly-write">-</b></div>':'<div><span>월간 쓰기 요청</span><b id="system-realtime-redis-monthly-write">-</b></div>',
            '<p class="operator-usage-note"><strong>비용 보호 원칙</strong><span>사용량 실측은 Upstash Developer API를 사용해 Redis command를 추가로 소비하지 않습니다. 관리 API가 연결되지 않은 경우에는 숫자를 추정해서 단정하지 않고 Free 기준 한도만 표시합니다.</span></p>':'<p class="operator-usage-note"><strong>단위 안내</strong><span>Upstash Developer API의 월간 값은 API 요청(requests), 오늘 값은 Redis commands입니다. 월간 API 요청과 오늘 Redis command는 단위가 다릅니다. 따라서 월간 요청 수로 500,000-command 한도의 잔여량이나 사용률을 계산하지 않으며, 잔여 command는 정확 계산 불가로 표시합니다.</span></p>',
            '<p class="operator-usage-note"><strong>별도 계정 실측</strong><span>REALTIME_UPSTASH_EMAIL / REALTIME_UPSTASH_API_KEY가 연결된 경우에만 Upstash Developer API 실측값을 표시합니다. 미연결 상태에서는 숫자를 추정하지 않습니다.</span></p>':'<p class="operator-usage-note"><strong>별도 계정 실측 · 단위 안내</strong><span>Realtime 계정도 월간 API 요청과 오늘 Redis commands를 별도로 표시합니다. 요청 수를 command 한도 사용량으로 환산하지 않으며 잔여 command는 정확 계산 불가로 표시합니다.</span></p>'
          }
          for old,new in replacements.items(): replace_once(html,old,new)

          ui='operator.js'
          replace_once(ui,
            "  if(usageUsed)usageUsed.textContent=redisUsage.exact?fmt(redisUsage.used)+' / '+fmt(redisUsage.monthlyLimit):'실측 연결 대기';\n  if(usageRemaining)usageRemaining.textContent=redisUsage.exact?fmt(redisUsage.remaining)+'회':'Free 참고 '+fmt(redisUsage.monthlyLimit||500000)+'회';\n  if(usagePct){usagePct.textContent=redisUsage.exact?Number(redisUsage.usedPct).toFixed(1)+'%':'-';usagePct.className=redisUsage.exact&&Number(redisUsage.usedPct)>=95?'is-bad':redisUsage.exact&&Number(redisUsage.usedPct)>=75?'is-warn':redisUsage.exact?'is-ok':''}\n  if(usageSource)usageSource.textContent=redisUsage.exact?'Upstash 관리 API 실측 · Redis command 소모 없음':redisUsage.source==='developer_api_not_configured'?'Upstash Developer API 미연결 · Redis를 조회하지 않고 표시 중':'관리 API에서 실측값을 가져오지 못했습니다.';",
            "  if(usageUsed)usageUsed.textContent=redisUsage.exact?fmt(redisUsage.used)+'회':'실측 연결 대기';\n  if(usageRemaining)usageRemaining.textContent='정확 계산 불가';\n  if(usagePct){usagePct.textContent='계산 안 함';usagePct.className=''}\n  if(usageSource)usageSource.textContent=redisUsage.exact?'Upstash 관리 API 실측 · 월간 API 요청과 오늘 Redis command 분리 표시':redisUsage.source==='developer_api_not_configured'?'Upstash Developer API 미연결 · Redis를 조회하지 않고 표시 중':'관리 API에서 실측값을 가져오지 못했습니다.';")
          replace_once(ui,
            "  if(rtUsageUsed)rtUsageUsed.textContent=realtimeRedisUsage.exact?fmt(realtimeRedisUsage.used)+' / '+fmt(realtimeRedisUsage.monthlyLimit):'실측 연결 대기';\n  if(rtUsageRemaining)rtUsageRemaining.textContent=realtimeRedisUsage.exact?fmt(realtimeRedisUsage.remaining)+'회':'-';\n  if(rtUsagePct){rtUsagePct.textContent=realtimeRedisUsage.exact?Number(realtimeRedisUsage.usedPct).toFixed(1)+'%':'-';rtUsagePct.className=realtimeRedisUsage.exact&&Number(realtimeRedisUsage.usedPct)>=95?'is-bad':realtimeRedisUsage.exact&&Number(realtimeRedisUsage.usedPct)>=75?'is-warn':realtimeRedisUsage.exact?'is-ok':''}\n  if(rtUsageSource)rtUsageSource.textContent=realtimeRedisUsage.exact?'별도 Upstash 관리 API 실측 · Redis command 소모 없음':realtimeRedisUsage.source==='developer_api_not_configured'?'실측 연결 대기 · Realtime Developer API 미연결':'Realtime 관리 API에서 실측값을 가져오지 못했습니다.';",
            "  if(rtUsageUsed)rtUsageUsed.textContent=realtimeRedisUsage.exact?fmt(realtimeRedisUsage.used)+'회':'실측 연결 대기';\n  if(rtUsageRemaining)rtUsageRemaining.textContent='정확 계산 불가';\n  if(rtUsagePct){rtUsagePct.textContent='계산 안 함';rtUsagePct.className=''}\n  if(rtUsageSource)rtUsageSource.textContent=realtimeRedisUsage.exact?'별도 Upstash 관리 API 실측 · 월간 API 요청과 오늘 Redis command 분리 표시':realtimeRedisUsage.source==='developer_api_not_configured'?'실측 연결 대기 · Realtime Developer API 미연결':'Realtime 관리 API에서 실측값을 가져오지 못했습니다.';")

          api='lib/operator-center-api.js'
          replace_once(api,
            "  const redisUsagePct=Number(redisUsage.usedPct);\n  const redisLevel=circuitLimited||redisOk===false||(Number.isFinite(redisUsagePct)&&redisUsagePct>=95)?'limit':Number.isFinite(redisUsagePct)&&redisUsagePct>=75?'warn':'ok';\n  const realtimeUsagePct=Number(realtimeRedisUsage.usedPct);\n  const realtimeLevel=realtimeRedisUsage.exact&&Number.isFinite(realtimeUsagePct)&&realtimeUsagePct>=95?'limit':realtimeRedisUsage.exact&&Number.isFinite(realtimeUsagePct)&&realtimeUsagePct>=75?'warn':'ok';",
            "  const redisLevel=circuitLimited||redisOk===false?'limit':'ok';\n  const realtimeLevel='ok';")
          replace_once(api,
            "    {id:'redis',label:'Operator Redis',level:redisLevel,detail:circuitLimited?'circuit breaker 활성':redisUsage.exact?('월간 '+redisUsage.usedPct+'% 사용'):deepStorage?(redisOk?'수동 상세 확인 정상':'수동 상세 확인 실패'):'기본 화면 Redis 무조회'},\n    {id:'realtime-redis',label:'Realtime Redis',level:realtimeLevel,detail:realtimeRedisUsage.exact?('월간 '+realtimeRedisUsage.usedPct+'% 사용'):'실측 연결 대기'},",
            "    {id:'redis',label:'Operator Redis',level:redisLevel,detail:circuitLimited?'circuit breaker 활성':redisUsage.exact?('월간 API 요청 '+redisUsage.used+'회 · command 한도 환산 안 함'):deepStorage?(redisOk?'수동 상세 확인 정상':'수동 상세 확인 실패'):'기본 화면 Redis 무조회'},\n    {id:'realtime-redis',label:'Realtime Redis',level:realtimeLevel,detail:realtimeRedisUsage.exact?('월간 API 요청 '+realtimeRedisUsage.used+'회 · command 한도 환산 안 함'):'실측 연결 대기'},")
          PY
          node tests/redis-usage-unit-labels-regression.mjs
          node --check operator.js
          node --check lib/operator-center-api.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operator.html operator.js lib/operator-center-api.js
          git commit -m 'fix: separate Upstash request and command usage units'
          git push origin HEAD:fix/redis-usage-units-20260930
