name: Fix Chunbong data Vercel bundle

on:
  push:
    branches: [feat/chunbong-data-dashboard]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: statically bundle data history') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace dynamic history file read
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/chunbong-data.js')
          text = path.read_text(encoding='utf-8')
          old_head = "const fs = require('node:fs');\nconst path = require('node:path');\n"
          new_head = "const snapshotHistory = require('../data/chunbong-data-history.json');\n"
          if old_head not in text:
              raise SystemExit('dynamic fs/path imports not found')
          text = text.replace(old_head, new_head, 1)
          old_const = "const HISTORY_PATH = path.join(__dirname, '..', 'data', 'chunbong-data-history.json');\n"
          if old_const not in text:
              raise SystemExit('HISTORY_PATH not found')
          text = text.replace(old_const, '', 1)
          old_fn = "function readSnapshotHistory() {\n  try {\n    const parsed = JSON.parse(fs.readFileSync(HISTORY_PATH, 'utf8'));\n    return parsed && Array.isArray(parsed.snapshots) ? parsed : { version: 1, snapshots: [] };\n  } catch (_) {\n    return { version: 1, snapshots: [] };\n  }\n}\n"
          new_fn = "function readSnapshotHistory() {\n  return snapshotHistory && Array.isArray(snapshotHistory.snapshots)\n    ? snapshotHistory\n    : { version: 1, snapshots: [] };\n}\n"
          if old_fn not in text:
              raise SystemExit('dynamic readSnapshotHistory implementation not found')
          text = text.replace(old_fn, new_fn, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify targeted regressions
        run: |
          node --check api/chunbong-data.js
          node tests/chunbong-data-api-regression.mjs
          node tests/chunbong-data-snapshot-regression.mjs
      - name: Commit bundle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/chunbong-data.js
          git commit -m 'fix: statically bundle data history'
          git push
