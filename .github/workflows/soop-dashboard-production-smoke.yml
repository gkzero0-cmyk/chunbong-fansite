name: SOOP dashboard production smoke

on:
  workflow_run:
    workflows: ['Chunbong data snapshot']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/soop-dashboard-production-smoke.yml'
      - 'api/content.js'
      - 'data.js'
      - 'data-core.js'
      - 'data-soop-periods-v3.js'
      - 'data-soop-periods-v2.css'
      - 'data-enhancements.js'
      - 'lib/chunbong-data.js'
      - 'lib/soop-analytics.js'
      - 'lib/soop-live-state.js'
      - 'lib/soop-follower-history.js'
      - 'scripts/update-soop-follower-history.mjs'
      - 'data/soop-follower-history.json'
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for Vercel production
        run: sleep 35
      - name: Verify production SOOP dashboard
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          mkdir -p .smoke
          curl -fsSL --retry 2 --max-time 60 "$BASE/data.js" -o .smoke/data.js
          curl -fsSL --retry 2 --max-time 60 "$BASE/data-core.js" -o .smoke/data-core.js
          curl -fsSL --retry 2 --max-time 60 "$BASE/data-soop-periods-v3.js" -o .smoke/data-soop-periods-v3.js
          curl -fsSL --retry 2 --max-time 60 "$BASE/data-soop-periods-v2.css" -o .smoke/data-soop-periods-v2.css
          curl -fsSL --retry 2 --max-time 60 "$BASE/data-enhancements.js" -o .smoke/data-enhancements.js
          curl -fsSL --retry 2 --max-time 60 -H 'cache-control: no-cache' "$BASE/api/content?type=data&refresh=1&_soop_smoke=$(date +%s)" -o .smoke/api.json
          node <<'NODE'
          const fs=require('fs');
          const loader=fs.readFileSync('.smoke/data.js','utf8');
          const core=fs.readFileSync('.smoke/data-core.js','utf8');
          const v3=fs.readFileSync('.smoke/data-soop-periods-v3.js','utf8');
          const periodCss=fs.readFileSync('.smoke/data-soop-periods-v2.css','utf8');
          const enhancements=fs.readFileSync('.smoke/data-enhancements.js','utf8');
          const payload=JSON.parse(fs.readFileSync('.smoke/api.json','utf8'));
          const requiredLoader=['data-core.js','data-soop-periods-v3.js','buildRollingWeekOptions','filterDailyByWeek','availableMonthKeys','formatRollingWeekLabel','formatMonthLabel'];
          const requiredV3=['mergeDailyHistory','mergeMonthlyHistory','data-daily-month-select','data-daily-week-select','data-month-year-select','data-month-month-select','followerCombinedChart','fanclubCombinedChart','countDeltaText','renderCalendarDetail',"key:'followerCount'","key:'fanclubCount'","key:'fanclubDelta'","key:'cumulativeMinutes'",'followerCount','fanclubCount','cumulativeMinutes'];
          const requiredPeriodCss=['.data-period-select','font-size:20px','.data-chart-hover-card text.value','.data-fanclub-combined'];
          const daily=Array.isArray(payload?.soop?.daily)?payload.soop.daily:[];
          const monthly=Array.isArray(payload?.soop?.monthlyStats)?payload.soop.monthlyStats:[];
          const calendar=Array.isArray(payload?.soop?.calendar)?payload.soop.calendar:[];
          const selected=monthly.at?.(-1)?.categories || [];
          const recent=payload?.soop?.categoryPeriods?.recentThreeMonths || [];
          const categoryShape=rows=>Array.isArray(rows)&&rows.every(row=>Number.isFinite(row?.streamCount)&&Number.isFinite(row?.minutes)&&Number.isFinite(row?.sharePercent));
          const live=payload?.soop?.overview?.live;
          const limitStart=enhancements.indexOf('function limitDailyRows');
          const limitEnd=enhancements.indexOf('function normalizeDailyTrendRows',limitStart);
          const limitSource=limitStart>=0&&limitEnd>limitStart?enhancements.slice(limitStart,limitEnd).replace(/\/\/.*$/gm,''):'';
          const fullDailyHistory=limitStart>=0&&limitEnd>limitStart&&!limitSource.includes('slice(-10)')&&limitSource.includes('.sort(')&&daily.length>10;
          const yearAwareHistory=daily.some(row=>String(row?.date||'').startsWith('2025-'))||monthly.some(row=>String(row?.month||'').startsWith('2025-'));
          const dailyFollowerCount=daily.some(row=>Number.isFinite(row?.followerCount));
          const dailyFanclubCount=daily.some(row=>Number.isFinite(row?.fanclubCount));
          const dailyFanclubDelta=daily.some(row=>Number.isFinite(row?.fanclubDelta));
          const monthlyFollowerCount=monthly.some(row=>Number.isFinite(row?.followerCount));
          const monthlyFanclubCount=monthly.some(row=>Number.isFinite(row?.fanclubCount));
          const monthlyFanclubDelta=monthly.some(row=>Number.isFinite(row?.fanclubDelta));
          const calendarFollowerCount=calendar.some(row=>Number.isFinite(row?.followerCount));
          const calendarFanclubCount=calendar.some(row=>Number.isFinite(row?.fanclubCount));
          const dailyCumulativeMinutes=daily.length>0&&daily.every(row=>Number.isFinite(row?.cumulativeMinutes));
          const monthlyCumulativeMinutes=monthly.length>0&&monthly.every(row=>Number.isFinite(row?.cumulativeMinutes));
          const checks={
            fallback:payload?.fallback!==true,
            daily:daily.length>0,
            monthly:monthly.length>0,
            calendar:calendar.length>0,
            liveContract:live===true||live===false||live===null,
            recentThreeMonths:Array.isArray(recent),
            selectedCategoryShape:categoryShape(selected),
            recentCategoryShape:categoryShape(recent),
            activeLoaderV3:requiredLoader.every(token=>loader.includes(token))&&!loader.includes("load('data-soop-periods-v2.js')")&&!loader.includes("load('data-soop-periods-v2-persistence.js')"),
            periodV3Tokens:requiredV3.every(token=>v3.includes(token)),
            compactPeriodCss:requiredPeriodCss.every(token=>periodCss.includes(token)),
            oldCorePreserved:core.includes('renderYoutubePanel')&&core.includes('createSvgChart'),
            supporterNotRendered:v3.includes("label === '이번 달 후원자'"),
            fullDailyHistory,
            yearAwareHistory,
            dailyFollowerCount,
            dailyFanclubCount,
            dailyFanclubDelta,
            monthlyFollowerCount,
            monthlyFanclubCount,
            monthlyFanclubDelta,
            calendarFollowerCount,
            calendarFanclubCount,
            dailyCumulativeMinutes,
            monthlyCumulativeMinutes
          };
          console.log(JSON.stringify({
            capturedAt:payload?.capturedAt,
            live,
            daily:daily.length,
            oldestDaily:daily[0]?.date||null,
            newestDaily:daily.at(-1)?.date||null,
            monthly:monthly.length,
            oldestMonth:monthly[0]?.month||null,
            newestMonth:monthly.at(-1)?.month||null,
            calendar:calendar.length,
            recentCategories:recent.length,
            latestDaily:daily.filter(row=>Number.isFinite(row?.followerCount)||Number.isFinite(row?.fanclubCount)).at(-1)||null,
            latestMonthly:monthly.filter(row=>Number.isFinite(row?.followerCount)||Number.isFinite(row?.fanclubCount)).at(-1)||null,
            checks
          },null,2));
          if(!Object.values(checks).every(Boolean)) process.exit(1);
          NODE
