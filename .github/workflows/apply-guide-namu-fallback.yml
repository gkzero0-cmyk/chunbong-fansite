name: Apply guide namuwiki fallback

on:
  push:
    branches: [fix/content-guide-wiki-sync-20261001]
    paths:
      - 'scripts/patch-guide-namu-fallback.mjs'
      - '.github/workflows/apply-guide-namu-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/content-guide-wiki-sync-20261001
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/patch-guide-namu-fallback.mjs
      - name: Verify
        run: |
          node --check lib/content-guide-sources.js
          node --check lib/chunbong-content-archive-api.js
          node tests/content-guide-resilience-regression.mjs
          node tests/content-guide-coverage-regression.mjs
      - name: Commit product source
        shell: bash
        run: |
          set -euo pipefail
          git add lib/chunbong-content-archive-api.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover namuwiki guides without Redis'
          git push origin HEAD:fix/content-guide-wiki-sync-20261001
