name: Visual production check

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "api/**"
      - "assets/**"
      - ".github/workflows/visual-production-check.yml"
      - ".github/scripts/visual-production-check.mjs"
      - ".github/scripts/production-readiness-gate.mjs"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to inspect"
        required: false
        default: "https://chunbong-fansite.vercel.app"
        type: string
      pages:
        description: "Comma-separated pages, e.g. history.html,tarot.html (blank = auto)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: visual-production-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.55.0"
  DEFAULT_VISUAL_BASE_URL: "https://chunbong-fansite.vercel.app"

jobs:
  visual-check:
    name: Desktop + mobile visual check
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Production readiness gate
        id: production_gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-readiness-gate.mjs

      - name: Cache Playwright and npm downloads
        if: steps.production_gate.outputs.ready == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: ${{ runner.os }}-playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright
        if: steps.production_gate.outputs.ready == 'true'
        shell: bash
        run: |
          npm install --no-save --package-lock=false "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Inspect Production
        if: steps.production_gate.outputs.ready == 'true'
        env:
          VISUAL_BASE_URL: ${{ github.event.inputs.base_url || 'https://chunbong-fansite.vercel.app' }}
          VISUAL_PAGES: ${{ github.event.inputs.pages || '' }}
          VISUAL_BEFORE_SHA: ${{ github.event.before || '' }}
          VISUAL_PAGE_LIMIT: "4"
          VISUAL_FAIL_ON_CONSOLE: "0"
        run: node .github/scripts/visual-production-check.mjs

      - name: Add report to job summary
        if: always() && steps.production_gate.outputs.ready == 'true'
        shell: bash
        run: |
          if [[ -f artifacts/visual-check/summary.md ]]; then
            cat artifacts/visual-check/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and report
        if: always() && steps.production_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-production-${{ github.run_number }}
          path: artifacts/visual-check/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6

      - name: Production blocked
        if: steps.production_gate.outputs.blocked == 'true'
        run: echo 'Visual production check is waiting for the Vercel cooldown; Playwright was not installed.'
