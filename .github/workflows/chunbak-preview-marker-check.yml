name: Chunbak preview marker check

on:
  push:
    branches: ['feat/chunbak-audio-nav-order-20260917']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed preview markers
        env:
          PREVIEW: https://chunbong-fansite-git-feat-chunbak-audio-nav-dd4c7d-gkzero0-9465.vercel.app
        run: |
          set -euo pipefail
          curl -fsS "$PREVIEW/index.html" -o /tmp/index.html
          curl -fsS "$PREVIEW/chunbak.html" -o /tmp/chunbak.html
          curl -fsS "$PREVIEW/chunbak-audio.js" -o /tmp/chunbak-audio.js
          grep -F '08 / MINIGAMES' /tmp/index.html
          grep -F '10 / DATA' /tmp/index.html
          python - <<'PY'
          from pathlib import Path
          index = Path('/tmp/index.html').read_text()
          nav = index[index.index('<nav class="main-nav"'):index.index('</nav>', index.index('<nav class="main-nav"'))]
          values = [nav.index('>팬아트</a>'), nav.index('>유튜브</a>'), nav.index('>TAROT</a>'), nav.index('>미니게임</a>')]
          assert values == sorted(values), values
          chunbak = Path('/tmp/chunbak.html').read_text()
          for marker in ['id="chunbak-sound"', 'id="chunbak-volume"', 'chunbak-audio.js']:
              assert marker in chunbak, marker
          audio = Path('/tmp/chunbak-audio.js').read_text()
          for marker in ['chunbak.sound.enabled.v1', 'chunbak.sound.volume.v1', "'highmerge'", "'gameover'"]:
              assert marker in audio, marker
          print('deployed preview contains requested Chunbak audio and navigation changes')
          PY
