name: Chunbong SOOP analytics verify

on:
  push:
    branches: [feat/chunbong-soop-analytics]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-external.js
          node --check scripts/update-chunbong-data.mjs
          node --check scripts/collect-soop-telemetry.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for test in tests/*.mjs; do
            echo "=== $test ==="
            node "$test"
            count=$((count + 1))
          done
          echo "TEST_FILES=$count"
      - name: Probe aggregate data module
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fetchData = require('./lib/chunbong-data');
          (async () => {
            const payload = await fetchData();
            assert.equal(payload.fallback, false, 'aggregate data must not be total fallback');
            assert.ok(payload.soop && payload.soop.overview, 'SOOP overview required');
            assert.ok(Array.isArray(payload.soop.daily), 'SOOP daily required');
            assert.ok(Array.isArray(payload.soop.monthlyStats), 'SOOP monthlyStats required');
            assert.ok(Array.isArray(payload.soop.categories), 'SOOP categories required');
            assert.ok(payload.youtube && payload.youtube.channel, 'YouTube channel required');
            console.log(`SOOP_DAILY=${payload.soop.daily.length}`);
            console.log(`SOOP_MONTHLY=${payload.soop.monthlyStats.length}`);
            console.log(`SOOP_CATEGORIES=${payload.soop.categories.length}`);
            console.log(`SOOP_SESSIONS=${payload.soop.recentSessions?.length || 0}`);
            console.log(`YOUTUBE_VIDEOS=${payload.youtube.recentVideos?.length || 0}`);
            console.log(`ERRORS=${payload.errors?.length || 0}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
