name: Chunbong SOOP analytics verify

on:
  push:
    branches: [feat/chunbong-soop-analytics]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run SOOP analytics target test
        run: node tests/soop-analytics-regression.mjs
