name: Chunbong SOOP analytics verify

on:
  push:
    branches: [feat/chunbong-soop-analytics]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply pending dashboard patch
        run: python scripts/apply-soop-dashboard-patch.py
      - name: Commit applied patch
        run: |
          if git diff --quiet; then
            echo "NO_PATCH_CHANGES=1"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/chunbong-data.js data.js data.css data.html
            git commit -m "feat: complete detailed SOOP data dashboard"
            git push origin HEAD:feat/chunbong-soop-analytics
          fi
      - name: Syntax checks
        run: |
          node --check data.js
          node --check lib/chunbong-data.js
          node --check lib/soop-external.js
          node --check scripts/collect-soop-telemetry.mjs
      - name: Run SOOP analytics target tests
        run: |
          node tests/soop-analytics-regression.mjs
          node tests/chunbong-data-api-regression.mjs
          node tests/soop-external-sources-regression.mjs
          node tests/soop-telemetry-regression.mjs
          node tests/chunbong-data-snapshot-regression.mjs
          node tests/soop-telemetry-workflow-regression.mjs
          node tests/chunbong-data-ui-regression.mjs
