name: Chuntris production smoke

on:
  push:
    branches: [main]
    paths:
      - 'chuntris.html'
      - 'chuntris.css'
      - 'chuntris-engine.js'
      - 'chuntris-audio.js'
      - 'chuntris.js'
      - 'assets/chuntris/**'
      - '.github/workflows/chuntris-production-smoke.yml'
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for production deployment
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          ENHANCED_REACTION='https://res.cloudinary.com/lyppgyei/image/upload/e_gen_restore/c_scale,w_1120/f_webp/q_auto:best/v1789314631/chuntris-reactions-source.webp'
          for attempt in $(seq 1 60); do
            echo "Production readiness attempt ${attempt}/60"
            if \
              curl -fsS "$BASE/chuntris.html" -o /tmp/chuntris.html && \
              curl -fsS "$BASE/chuntris.css" -o /tmp/chuntris.css && \
              curl -fsS "$BASE/chuntris-engine.js" -o /dev/null && \
              curl -fsS "$BASE/chuntris-audio.js" -o /dev/null && \
              curl -fsS "$BASE/chuntris.js" -o /dev/null && \
              curl -fsS "$BASE/assets/chuntris/reactions.webp" -o /dev/null && \
              curl -fsS "$ENHANCED_REACTION" -o /dev/null && \
              grep -q '춘트리스' /tmp/chuntris.html && \
              grep -q 'data-chuntris-mode="classic"' /tmp/chuntris.html && \
              grep -q 'data-chuntris-mode="sprint40"' /tmp/chuntris.html && \
              grep -q 'chuntris.js' /tmp/chuntris.html && \
              grep -q 'e_gen_restore/c_scale,w_1120/f_webp/q_auto:best' /tmp/chuntris.css && \
              grep -q '100dvh' /tmp/chuntris.css; then
              echo 'Chuntris production deployment is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Chuntris production deployment did not become ready in time.' >&2
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const URL = 'https://chunbong-fansite.vercel.app/chuntris.html';

          async function assertNoHorizontalOverflow(page, label) {
            const documentWidth = await page.evaluate(() => document.documentElement.scrollWidth);
            const viewportWidth = page.viewportSize()?.width || 0;
            const gameBox = await page.locator('#chuntris-game').boundingBox();
            assert.ok(documentWidth <= viewportWidth + 1, `${label} document overflow: ${documentWidth} > ${viewportWidth}`);
            assert.ok(gameBox, `${label} game frame missing`);
            assert.ok(gameBox.x >= -1, `${label} game frame starts outside viewport: ${gameBox.x}`);
            assert.ok(gameBox.x + gameBox.width <= viewportWidth + 1, `${label} game frame ends outside viewport: ${gameBox.x + gameBox.width} > ${viewportWidth}`);
          }

          async function assertBoardFitsViewport(page, label) {
            const viewport = page.viewportSize();
            const [headerBox, gameBox, boardBox] = await Promise.all([
              page.locator('.site-header').boundingBox(),
              page.locator('#chuntris-game').boundingBox(),
              page.locator('#chuntris-board').boundingBox()
            ]);
            assert.ok(viewport, `${label} viewport missing`);
            assert.ok(gameBox, `${label} game frame missing`);
            assert.ok(boardBox, `${label} board missing`);
            const headerHeight = headerBox?.height || 0;
            const boardOffsetInsideGame = boardBox.y - gameBox.y;
            const visibleBottom = headerHeight + boardOffsetInsideGame + boardBox.height;
            console.log(`${label}: viewport=${viewport.height}, header=${headerHeight}, offset=${boardOffsetInsideGame}, board=${boardBox.width}x${boardBox.height}, visibleBottom=${visibleBottom}`);
            assert.ok(
              visibleBottom <= viewport.height + 1,
              `${label} board vertically clipped when game is aligned below sticky header: ${visibleBottom} > ${viewport.height} (header=${headerHeight}, offset=${boardOffsetInsideGame}, board=${boardBox.height})`
            );
            assert.ok(boardBox.width > 0 && boardBox.height > 0, `${label} board must have positive dimensions`);
          }

          async function openReadyPage(browser, options, label) {
            const page = await browser.newPage(options);
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto(URL, { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.ChuntrisApp?.getGame?.()));
            assert.equal(await page.locator('#chuntris-board').count(), 1);
            await assertNoHorizontalOverflow(page, label);
            return { page, errors };
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const { page: desktop, errors: desktopErrors } = await openReadyPage(
                browser,
                { viewport: { width: 1280, height: 900 } },
                'Desktop 1280x900'
              );
              await assertBoardFitsViewport(desktop, 'Desktop 1280x900');
              const reactionImage = await desktop.locator('#chuntris-reaction').evaluate(el => getComputedStyle(el).backgroundImage);
              assert.match(reactionImage, /e_gen_restore/, 'Desktop reaction sprite must use generative-restored asset');

              await desktop.locator('[data-chuntris-mode="classic"]').click();
              await desktop.locator('#chuntris-start').click();
              await desktop.keyboard.press('ArrowLeft');
              await desktop.keyboard.press('KeyX');
              await desktop.keyboard.press('Space');
              await desktop.waitForTimeout(120);
              assert.equal(await desktop.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
              assert.equal(await desktop.locator('#chuntris-game').getAttribute('data-mode'), 'classic');
              const score = Number((await desktop.locator('#chuntris-score').textContent() || '0').replace(/[^0-9]/g, ''));
              assert.ok(score >= 0);
              await assertNoHorizontalOverflow(desktop, 'Desktop 1280x900 playing');
              await assertBoardFitsViewport(desktop, 'Desktop 1280x900 playing');

              await desktop.locator('#chuntris-pause').click();
              assert.equal(await desktop.locator('#chuntris-game').getAttribute('data-game-status'), 'paused');
              await desktop.locator('[data-chuntris-mode="sprint40"]').click();
              await desktop.locator('#chuntris-start').click();
              assert.equal(await desktop.locator('#chuntris-game').getAttribute('data-mode'), 'sprint40');
              assert.equal(await desktop.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
              assert.deepEqual(desktopErrors, [], `Desktop page errors: ${desktopErrors.join(' | ')}`);

              const { page: shortDesktop, errors: shortDesktopErrors } = await openReadyPage(
                browser,
                { viewport: { width: 1280, height: 740 } },
                'Short desktop 1280x740'
              );
              await assertBoardFitsViewport(shortDesktop, 'Short desktop 1280x740');
              assert.deepEqual(shortDesktopErrors, [], `Short desktop page errors: ${shortDesktopErrors.join(' | ')}`);

              const { page: compact, errors: compactErrors } = await openReadyPage(
                browser,
                { viewport: { width: 900, height: 800 } },
                'Compact desktop 900x800'
              );
              await assertBoardFitsViewport(compact, 'Compact desktop 900x800');
              assert.deepEqual(compactErrors, [], `Compact desktop page errors: ${compactErrors.join(' | ')}`);

              const { page: mobile, errors: mobileErrors } = await openReadyPage(
                browser,
                { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
                'Mobile 390x844'
              );
              await assertBoardFitsViewport(mobile, 'Mobile 390x844');
              await mobile.locator('[data-chuntris-mode="classic"]').click();
              await mobile.locator('#chuntris-start').click();
              const controls = mobile.locator('#chuntris-mobile-controls');
              assert.equal(await controls.isVisible(), true);
              await mobile.locator('[data-chuntris-action="left"]').click();
              await mobile.locator('[data-chuntris-action="hard-drop"]').click();
              await mobile.waitForTimeout(80);
              assert.equal(await mobile.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
              await assertNoHorizontalOverflow(mobile, 'Mobile 390x844 playing');
              await assertBoardFitsViewport(mobile, 'Mobile 390x844 playing');
              assert.deepEqual(mobileErrors, [], `Mobile page errors: ${mobileErrors.join(' | ')}`);

              const { page: narrowMobile, errors: narrowErrors } = await openReadyPage(
                browser,
                { viewport: { width: 360, height: 800 }, isMobile: true, hasTouch: true },
                'Mobile 360x800'
              );
              await assertBoardFitsViewport(narrowMobile, 'Mobile 360x800');
              assert.equal(await narrowMobile.locator('#chuntris-mobile-controls').isVisible(), true);
              assert.deepEqual(narrowErrors, [], `Narrow mobile page errors: ${narrowErrors.join(' | ')}`);

              console.log('Chuntris production Chromium smoke passed');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
