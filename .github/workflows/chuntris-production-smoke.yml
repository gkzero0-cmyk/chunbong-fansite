name: Chuntris production smoke

on:
  push:
    branches: [main]
    paths:
      - 'chuntris.html'
      - 'chuntris.css'
      - 'chuntris-fullscreen.css'
      - 'chuntris-immersive.css'
      - 'chuntris-vcompany-ui.css'
      - 'chuntris-board-start-ui.css'
      - 'chuntris-engine.js'
      - 'chuntris-audio.js'
      - 'chuntris-ranking-core.js'
      - 'chuntris.js'
      - 'chuntris-postgame-ranking.js'
      - 'api/content.js'
      - 'lib/chuntris-ranking-api.js'
      - 'assets/chuntris/**'
      - '.github/workflows/chuntris-production-smoke.yml'
  workflow_dispatch:

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Wait for current Chuntris production deployment
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          for attempt in $(seq 1 60); do
            echo "Production readiness attempt ${attempt}/60"
            stamp=$(date +%s)
            if \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris.html?_smoke=$stamp" -o /tmp/chuntris.html && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris.js?_smoke=$stamp" -o /tmp/chuntris.js && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-postgame-ranking.js?_smoke=$stamp" -o /tmp/chuntris-postgame-ranking.js && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-audio.js?_smoke=$stamp" -o /tmp/chuntris-audio.js && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-fullscreen.css?_smoke=$stamp" -o /tmp/chuntris-fullscreen.css && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-immersive.css?_smoke=$stamp" -o /tmp/chuntris-immersive.css && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-vcompany-ui.css?_smoke=$stamp" -o /tmp/chuntris-vcompany-ui.css && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/chuntris-board-start-ui.css?_smoke=$stamp" -o /tmp/chuntris-board-start-ui.css && \
              curl -fsS -H 'cache-control: no-cache' "$BASE/api/content?type=chuntris-ranking&mode=classic&_smoke=$stamp" -o /tmp/chuntris-ranking.json && \
              grep -q 'id="chuntris-start-view"' /tmp/chuntris.html && \
              grep -q 'id="chuntris-play-view"' /tmp/chuntris.html && \
              grep -q 'id="chuntris-countdown"' /tmp/chuntris.html && \
              grep -q 'chuntris-return-link' /tmp/chuntris.html && \
              grep -q 'id="chuntris-ranking-register"' /tmp/chuntris.html && \
              grep -q 'id="chuntris-ranking-nickname"' /tmp/chuntris.html && \
              ! grep -q 'id="chuntris-nickname"' /tmp/chuntris.html && \
              grep -q 'submitTerminalRanking' /tmp/chuntris-postgame-ranking.js && \
              grep -q 'CLEAR_SOUNDS' /tmp/chuntris.js && \
              grep -Fq "const frames=['3','2','1','START!']" /tmp/chuntris.js && \
              grep -q 'harddrop' /tmp/chuntris-audio.js && \
              grep -q 'e_gen_restore/e_background_removal/c_scale,w_1680' /tmp/chuntris-fullscreen.css && \
              grep -q 'positional-impact-effects-v1' /tmp/chuntris-immersive.css && \
              grep -q -- '--chuntris-shell-bg' /tmp/chuntris-vcompany-ui.css && \
              grep -Fq -- '--chuntris-stage-height:min(680px,72svh)!important' /tmp/chuntris-board-start-ui.css && \
              grep -Fq -- '--chuntris-board-width:min(340px,36svh,calc(100vw - 28px))' /tmp/chuntris-board-start-ui.css && \
              grep -Fq 'overflow-anchor:none' /tmp/chuntris-board-start-ui.css && \
              node -e "const p=require('/tmp/chuntris-ranking.json');if(p.mode!=='classic'||!Array.isArray(p.entries))process.exit(1)"; then
              echo 'Current postgame-ranking Chuntris production is ready.'
              exit 0
            fi
            sleep 5
          done
          echo 'Current Chuntris production deployment did not become ready in time.' >&2
          exit 1
      - name: Verify ranking API validation without leaderboard pollution
        run: |
          set -euo pipefail
          BASE='https://chunbong-fansite.vercel.app'
          status=$(curl -sS -o /tmp/chuntris-invalid.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H 'origin: https://chunbong-fansite.vercel.app' \
            --data '{"mode":"classic","nickname":"x","score":1,"lines":1,"level":1,"timeMs":1}' \
            "$BASE/api/content?type=chuntris-ranking")
          test "$status" = '400'
          node -e "const p=require('/tmp/chuntris-invalid.json');if(p.error!=='invalid_nickname')process.exit(1)"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production flow and responsive layout
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          const BASE='https://chunbong-fansite.vercel.app';

          async function assertGameStageFitsViewport(page,label){
            const viewport=page.viewportSize();
            assert.ok(viewport,`${label} viewport missing`);
            if(viewport.width>=1181) await page.locator('.chuntris-layout').scrollIntoViewIfNeeded();
            else await page.locator('#chuntris-game').scrollIntoViewIfNeeded();
            const [boardBox,layoutBox]=await Promise.all([
              page.locator('.chuntris-board-wrap').boundingBox(),
              page.locator('.chuntris-layout').boundingBox()
            ]);
            assert.ok(boardBox&&layoutBox,`${label} stage missing`);
            assert.ok(boardBox.width>0&&boardBox.height>0,`${label} board must have positive dimensions`);
            assert.ok(boardBox.width<=viewport.width+1,`${label} board wider than viewport`);
            assert.ok(boardBox.height<=viewport.height-40,`${label} board too tall: ${boardBox.height} > ${viewport.height-40}`);
            if(viewport.width>=1181){
              assert.ok(layoutBox.y>=-1,`${label} stage begins above viewport: ${layoutBox.y}`);
              assert.ok(layoutBox.y + layoutBox.height<=viewport.height+1,`${label} stage bottom clipped: ${layoutBox.y + layoutBox.height} > ${viewport.height}`);
            }
          }

          async function verify(browser,options,label){
            const page=await browser.newPage(options);
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${BASE}/chuntris.html?_smoke=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.ChuntrisApp?.getGame?.()));
            await page.waitForFunction(()=>Boolean(window.ChuntrisPostgameRanking));
            await page.waitForFunction(()=>getComputedStyle(document.querySelector('#chuntris-game')).transform==='none');
            const viewport=page.viewportSize();
            assert.ok(viewport,`${label} viewport missing`);
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-mode');
            assert.ok(await page.locator('#chuntris-start-view').isVisible(),`${label} start view missing`);
            assert.equal(await page.locator('#chuntris-play-view').isVisible(),false,`${label} play view must start hidden`);
            assert.equal(await page.locator('#chuntris-nickname').count(),0,`${label} pre-game nickname must be absent`);
            assert.ok(await page.locator('#chuntris-ranking-register').count(),`${label} postgame ranking register missing`);
            assert.ok(await page.locator('#chuntris-ranking-nickname').count(),`${label} postgame nickname input missing`);
            assert.equal(await page.locator('.chuntris-ranking-rail').count(),0,`${label} ranking rail must be removed`);
            assert.equal(await page.locator('.chuntris-help-rail').count(),0,`${label} help rail must be removed`);

            const startCardBox=await page.locator('.chuntris-start-card').boundingBox();
            assert.ok(startCardBox,`${label} start card missing`);
            assert.ok(startCardBox.y>=-1&&startCardBox.y+startCardBox.height<=viewport.height+1,`${label} start card bottom clipped: ${startCardBox.y+startCardBox.height} > ${viewport.height}`);
            assert.ok(Math.abs(startCardBox.height/startCardBox.width-2)<0.04,`${label} start card ratio mismatch`);
            const startScrollY=await page.evaluate(()=>window.scrollY);
            await page.locator('#chuntris-mode-classic').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'start-player');
            await page.locator('#chuntris-start').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'countdown',`${label} countdown state missing`);
            assert.ok(await page.locator('#chuntris-countdown').isVisible(),`${label} countdown layer missing`);
            assert.equal((await page.locator('#chuntris-countdown-value').textContent())?.trim(),'3',`${label} countdown must start at 3`);
            assert.notEqual(await page.evaluate(()=>window.ChuntrisApp.getGame().getSnapshot().status),'playing',`${label} engine started before countdown`);
            await page.waitForFunction(()=>document.querySelector('#chuntris-countdown-value')?.textContent?.trim()==='2',{timeout:1800});
            await page.waitForFunction(()=>document.querySelector('#chuntris-countdown-value')?.textContent?.trim()==='1',{timeout:1800});
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing',{timeout:3000});
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-ui-state'),'playing');
            await page.waitForTimeout(120);
            const playScrollY=await page.evaluate(()=>window.scrollY);
            assert.ok(Math.abs(playScrollY-startScrollY)<=1,`${label} transition changed scrollY: ${startScrollY} -> ${playScrollY}`);
            const documentWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
            assert.ok(documentWidth<=viewport.width+1,`${label} horizontal overflow`);
            await assertGameStageFitsViewport(page,label);
            const playBoardBox=await page.locator('.chuntris-board-wrap').boundingBox();
            assert.ok(playBoardBox&&playBoardBox.y+playBoardBox.height<=viewport.height+1,`${label} play board bottom clipped: ${playBoardBox?.y+playBoardBox?.height} > ${viewport.height}`);
            assert.ok(Math.abs(startCardBox.width-playBoardBox.width)<=3,`${label} start/play board widths differ`);
            assert.ok(Math.abs(startCardBox.y-playBoardBox.y)<=2,`${label} start/play board top positions differ: ${startCardBox.y} vs ${playBoardBox.y}`);

            for(const id of ['#chuntris-utility-ranking','#chuntris-utility-sound','#chuntris-utility-controls','#chuntris-pause']){
              assert.ok(await page.locator(id).isVisible(),`${label} utility missing ${id}`);
            }
            if(viewport.width>1180){
              const [left,center,right]=await Promise.all([
                page.locator('.chuntris-left-panel').boundingBox(),
                page.locator('.chuntris-board-wrap').boundingBox(),
                page.locator('.chuntris-right-panel').boundingBox()
              ]);
              assert.ok(left&&center&&right,`${label} desktop regions missing`);
              assert.ok(left.x<center.x&&center.x<right.x,`${label} desktop region order invalid`);
              const expectedBoardWidth=Math.min(340,viewport.height*0.36,viewport.width-28);
              assert.ok(Math.abs(center.width-expectedBoardWidth)<=4,`${label} board width mismatch: ${center.width} vs expected ${expectedBoardWidth}`);
              const timeFits=await page.locator('#chuntris-time').evaluate(el=>{
                const original=el.textContent;
                el.textContent='99:59.999';
                const result={fits:el.scrollWidth<=el.clientWidth+1,scrollWidth:el.scrollWidth,clientWidth:el.clientWidth};
                el.textContent=original;
                return result;
              });
              assert.ok(timeFits.fits,`${label} TIME is clipped: ${timeFits.scrollWidth} > ${timeFits.clientWidth}`);
            }

            const reactionImage=await page.locator('#chuntris-reaction').evaluate(el=>getComputedStyle(el).backgroundImage);
            assert.match(reactionImage,/e_gen_restore\/e_background_removal/,`${label} reaction asset restoration chain missing`);
            assert.match(reactionImage,/c_scale,w_1680/,`${label} reaction must use high-resolution asset`);
            assert.match(reactionImage,/fl_preserve_transparency/,`${label} reaction must preserve transparency`);

            await page.locator('#chuntris-utility-ranking').click();
            assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'),'paused',`${label} utility modal must pause`);
            assert.ok(await page.locator('[data-chuntris-panel="ranking"]').isVisible(),`${label} ranking modal missing`);
            await page.locator('.chuntris-modal-close').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');

            await page.locator('#chuntris-pause').click();
            assert.ok(await page.locator('[data-chuntris-panel="pause"]').isVisible(),`${label} pause panel missing`);
            const pauseReturn=page.locator('[data-chuntris-panel="pause"] .chuntris-return-link');
            assert.ok(await pauseReturn.isVisible(),`${label} pause minigames return link missing`);
            assert.equal(await pauseReturn.getAttribute('href'),'minigames.html');
            await page.locator('#chuntris-pause-continue').click();
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing');

            await page.keyboard.press('Space');
            assert.ok(await page.locator('#chuntris-harddrop-fx').evaluate(el=>el.classList.contains('is-active')),`${label} hard-drop effect missing`);
            await page.evaluate(()=>window.ChuntrisApp.showClearEffect(4));
            assert.equal(await page.locator('#chuntris-clear-label').textContent(),'QUAD',`${label} QUAD label mismatch`);
            await page.evaluate(()=>{const game=window.ChuntrisApp.getGame();game.state.status='gameover';window.ChuntrisApp.render();});
            await page.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='gameover');
            const terminalReturn=page.locator('#chuntris-overlay .chuntris-return-link');
            assert.ok(await terminalReturn.isVisible(),`${label} game-over minigames return link missing`);
            assert.equal(await terminalReturn.getAttribute('href'),'minigames.html');
            assert.equal(await page.locator('#chuntris-line-fx .chuntris-line-flash').count(),4,`${label} line flashes missing`);

            assert.deepEqual(errors,[],`${label} page errors: ${errors.join(' | ')}`);
            console.log(`${label} production smoke passed`);
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              await verify(browser,{viewport:{width:1440,height:900}},'1440x900');
              await verify(browser,{viewport:{width:1280,height:740}},'1280x740');
              await verify(browser,{viewport:{width:1024,height:768}},'1024x768');
              await verify(browser,{viewport:{width:900,height:800}},'900x800');
              await verify(browser,{viewport:{width:390,height:844},isMobile:true,hasTouch:true},'390x844');
              await verify(browser,{viewport:{width:360,height:800},isMobile:true,hasTouch:true},'360x800');
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
