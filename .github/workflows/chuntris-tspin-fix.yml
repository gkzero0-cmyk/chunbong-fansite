name: Apply Chuntris T-Spin fix

on:
  push:
    branches: [design/chuntris]
    paths:
      - '.github/workflows/chuntris-tspin-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chuntris
      - name: Preserve final rotation on zero-distance hard drop
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('chuntris-engine.js')
          text = path.read_text(encoding='utf-8')
          old = "      this.state.score += moved * 2;\n      this.state.lastAction = 'hardDrop';\n      this.lockActive(nowMs);"
          new = "      this.state.score += moved * 2;\n      if (moved > 0) this.state.lastAction = 'hardDrop';\n      this.lockActive(nowMs);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one hardDrop action assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check chuntris-engine.js
          node tests/chuntris-engine-scoring-regression.mjs
      - name: Commit T-Spin fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chuntris-engine.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve zero-distance T-Spin hard drop'
          git push origin HEAD:design/chuntris
