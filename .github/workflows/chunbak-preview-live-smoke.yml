name: Chunbak preview live smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'chunbak.html'
      - 'chunbak.css'
      - 'chunbak-game-core.js'
      - 'chunbak-ranking-core.js'
      - 'chunbak-audio.js'
      - 'chunbak.js'
      - 'assets/chunbak/**'
      - 'api/content.js'
      - 'lib/chunbak-ranking-api.js'
      - '.github/workflows/chunbak-preview-live-smoke.yml'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  live-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and wait for current Vercel Preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            echo "Preview discovery attempt ${attempt}/60"
            comments=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            preview=$(printf '%s' "$comments" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const rows=JSON.parse(s).filter(x=>x.user?.login==="vercel[bot]");
                for(const row of rows.reverse()){
                  const m=String(row.body||"").match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                  if(m){process.stdout.write(m[1]);return;}
                }
              });')
            if [ -n "$preview" ]; then
              stamp=$(date +%s)
              if curl -fsS -H 'cache-control: no-cache' "$preview/chunbak.js?_smoke=$stamp" -o /tmp/chunbak-preview.js && \
                 grep -q "/api/content?type=chunbak-ranking" /tmp/chunbak-preview.js && \
                 grep -q "showMergeEffect" /tmp/chunbak-preview.js && \
                 curl -fsS -H 'cache-control: no-cache' "$preview/api/content?type=chunbak-ranking&mode=classic&_smoke=$stamp" -o /tmp/chunbak-preview-ranking.json && \
                 node -e "const p=require('/tmp/chunbak-preview-ranking.json');if(p.mode!=='classic'||!Array.isArray(p.entries))process.exit(1)"; then
                echo "PREVIEW_BASE=$preview" >> "$GITHUB_ENV"
                echo "Preview ready: $preview"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Current Vercel Preview did not become API-ready.' >&2
          exit 1
      - name: Verify ranking API validation without leaderboard pollution
        run: |
          set -euo pipefail
          host=${PREVIEW_BASE#https://}
          status=$(curl -sS -o /tmp/chunbak-invalid.json -w '%{http_code}' \
            -X POST \
            -H 'content-type: application/json' \
            -H "origin: https://$host" \
            --data '{"mode":"classic","nickname":"x","score":1,"maxLevel":1}' \
            "$PREVIEW_BASE/api/content?type=chunbak-ranking")
          test "$status" = '400'
          node -e "const p=require('/tmp/chunbak-invalid.json');if(p.error!=='invalid_nickname')process.exit(1)"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live immersive preview flow and layout
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const { chromium }=require('playwright');
          const BASE=process.env.PREVIEW_BASE;

          async function verify(browser, options, label) {
            const page=await browser.newPage(options);
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto(`${BASE}/chunbak.html?_smoke=${Date.now()}`,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.ChunbakGame));
            await page.waitForFunction(()=>!document.querySelector('#chunbak-start')?.disabled);

            const viewport=page.viewportSize();
            assert.ok(viewport,`${label} viewport missing`);
            assert.ok(await page.locator('#chunbak-start-view').isVisible(),`${label} start view missing`);
            assert.equal(await page.locator('#chunbak-play-view').isVisible(),false,`${label} play view must start hidden`);

            await page.locator('#chunbak-nickname').fill('');
            await page.locator('#chunbak-start').click();
            await page.waitForFunction(()=>window.ChunbakGame.getDebugState().gameState==='playing');
            assert.equal(await page.locator('#chunbak-start-view').isVisible(),false,`${label} start view must hide after start`);
            assert.ok(await page.locator('#chunbak-play-view').isVisible(),`${label} play view missing`);
            assert.ok(await page.locator('#chunbak-ranking-list').count(),`${label} persistent TOP 10 missing`);

            const documentWidth=await page.evaluate(()=>document.documentElement.scrollWidth);
            const stage=await page.locator('#chunbak-stage').boundingBox();
            assert.ok(stage,`${label} stage missing`);
            assert.ok(documentWidth<=viewport.width+1,`${label} horizontal overflow: ${documentWidth} > ${viewport.width}`);
            assert.ok(stage.x>=-1&&stage.x+stage.width<=viewport.width+1,`${label} stage clipped horizontally`);

            if(viewport.width>900){
              const [left,center,right]=await Promise.all([
                page.locator('.chunbak-left').boundingBox(),
                page.locator('.chunbak-center').boundingBox(),
                page.locator('.chunbak-right').boundingBox()
              ]);
              assert.ok(left&&center&&right,`${label} desktop regions missing`);
              assert.ok(left.x<center.x&&center.x<right.x,`${label} desktop region order invalid`);
            }

            await page.locator('#chunbak-play-view [data-chunbak-open="ranking"]').click();
            assert.equal(await page.evaluate(()=>ChunbakGame.getDebugState().gameState),'paused',`${label} ranking modal must auto-pause`);
            assert.ok(await page.locator('[data-chunbak-panel="ranking"]').isVisible(),`${label} ranking modal missing`);
            await page.locator('#chunbak-modal-close').click();
            await page.waitForFunction(()=>ChunbakGame.getDebugState().gameState==='playing');

            await page.keyboard.press('Escape');
            assert.equal(await page.evaluate(()=>ChunbakGame.getDebugState().gameState),'paused',`${label} ESC pause failed`);
            assert.ok(await page.locator('[data-chunbak-panel="pause"]').isVisible(),`${label} pause panel missing`);
            await page.locator('[data-chunbak-action="resume"]').click();
            await page.waitForFunction(()=>ChunbakGame.getDebugState().gameState==='playing');

            assert.deepEqual(errors,[],`${label} page errors: ${errors.join(' | ')}`);
            console.log(`${label} passed: stage=${stage.width}x${stage.height}`);
            await page.close();
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              await verify(browser,{viewport:{width:1440,height:900}},'1440x900');
              await verify(browser,{viewport:{width:1024,height:768}},'1024x768');
              await verify(browser,{viewport:{width:390,height:844},isMobile:true,hasTouch:true},'390x844');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
