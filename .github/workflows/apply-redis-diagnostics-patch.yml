name: Apply Redis diagnostics patch
on:
  push:
    branches:
      - feat/redis-command-diagnostics-20260930
    paths:
      - '.github/workflows/apply-redis-diagnostics-patch.yml'
      - 'scripts/apply-redis-diagnostics-patch.mjs'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/redis-command-diagnostics-20260930
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply tiny runtime wiring patch
        run: node scripts/apply-redis-diagnostics-patch.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- lib/content-api/vod.js operator.html; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/content-api/vod.js operator.html
          git commit -m 'feat: wire Redis diagnostics into runtime [skip ci]'
          git push origin HEAD:feat/redis-command-diagnostics-20260930
