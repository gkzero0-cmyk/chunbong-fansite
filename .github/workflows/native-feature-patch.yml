name: Native feature patch

on:
  push:
    branches: [feat/chunbong-posts-rendering-20261003]
    paths:
      - '.github/native-feature-patch-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbong-posts-rendering-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply scoped feature patch
        run: node .github/scripts/native-feature-patch.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No patch changes produced'
            exit 1
          fi
          task=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.github/native-feature-patch-trigger.json','utf8')).task)")
          git commit -m "native-patch: ${task}"
          git push origin HEAD:feat/chunbong-posts-rendering-20261003
