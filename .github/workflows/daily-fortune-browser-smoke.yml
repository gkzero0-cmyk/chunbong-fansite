name: Daily tarot fortune browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily-fortune.js'
      - 'daily-fortune.css'
      - 'tarot-data.js'
      - 'tests/daily-fortune-regression.mjs'
      - '.github/workflows/daily-fortune-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static regression
        run: |
          node --check daily-fortune.js
          node tests/daily-fortune-regression.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/daily-fortune-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/daily-fortune-http.log
          exit 1
      - name: Verify one-draw-per-KST-day reveal flow
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              const context=await browser.newContext({viewport,isMobile:viewport.width<=390,hasTouch:viewport.width<=390});
              const page=await context.newPage();
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.route('https://res.cloudinary.com/**',route=>route.fulfill({
                status:200,
                contentType:'image/svg+xml',
                body:'<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1488"><rect width="898" height="1488" fill="#241434"/></svg>'
              }));

              await page.goto(`${process.env.BASE_URL}/index.html?_fortune=${Date.now()}`,{waitUntil:'networkidle'});
              await page.evaluate(()=>{
                localStorage.removeItem('chunbongDailyTarotFortuneV1');
                sessionStorage.removeItem('chunbongDailyTarotAutoOpenV1');
              });
              await page.reload({waitUntil:'networkidle'});
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===true);
              assert.ok(await page.locator('#daily-fortune-card').isVisible(),'daily card back missing');
              assert.equal(await page.locator('#daily-fortune-card').isDisabled(),false,'new-day card must be selectable');

              await page.locator('#daily-fortune-card').click();
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-card')?.classList.contains('is-locked'),null,{timeout:5000});
              assert.ok(await page.locator('#daily-fortune-result').isVisible(),'daily result missing after reveal');

              const first=await page.evaluate(()=>{
                const value=JSON.parse(localStorage.getItem('chunbongDailyTarotFortuneV1')||'null');
                return {
                  value,
                  title:document.querySelector('#daily-fortune-card-name')?.textContent?.trim(),
                  direction:document.querySelector('#daily-fortune-direction')?.textContent?.trim(),
                  overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1
                };
              });
              assert.ok(first.value,'daily draw was not persisted');
              assert.ok(first.value.cardIndex>=0&&first.value.cardIndex<22,'draw must use Major Arcana only');
              assert.match(first.direction,/정방향|역방향/);
              assert.equal(first.overflow,false,'fortune UI caused horizontal overflow');
              assert.equal(await page.locator('#daily-fortune-floating').isVisible(),false,'floating card must stay hidden while fortune dialog is open');

              await page.locator('[data-daily-fortune-close]').click();
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===false);
              assert.ok(await page.locator('#daily-fortune-floating').isVisible(),'floating card shortcut must appear after closing a drawn fortune');
              const floatingBox=await page.locator('#daily-fortune-floating').boundingBox();
              assert.ok(floatingBox,'floating card shortcut box missing');
              assert.ok(floatingBox.x>=0&&floatingBox.y>=0&&floatingBox.x+floatingBox.width<=viewport.width&&floatingBox.y+floatingBox.height<=viewport.height,'floating card shortcut clips viewport');
              await page.locator('#daily-fortune-floating').click();
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===true);
              assert.equal(await page.locator('#daily-fortune-floating').isVisible(),false,'floating shortcut must hide while reopened dialog is open');
              await page.locator('[data-daily-fortune-close]').click();

              await page.reload({waitUntil:'networkidle'});
              assert.ok(await page.locator('#daily-fortune-floating').isVisible(),'stored same-day fortune should restore floating shortcut');
              await page.locator('#daily-fortune-floating').click();
              await page.waitForFunction(()=>document.querySelector('#daily-fortune-dialog')?.open===true);
              const second=await page.evaluate(()=>JSON.parse(localStorage.getItem('chunbongDailyTarotFortuneV1')||'null'));
              assert.equal(second.cardIndex,first.value.cardIndex,'same day must keep the same card');
              assert.equal(second.orientation,first.value.orientation,'same day must keep the same orientation');
              assert.equal(await page.locator('#daily-fortune-card').isDisabled(),true,'same-day result must not redraw');

              await page.locator('[data-daily-fortune-close]').click();
              await page.evaluate(()=>{
                const saved=JSON.parse(localStorage.getItem('chunbongDailyTarotFortuneV1'));
                saved.dateKey='2000-01-01';
                localStorage.setItem('chunbongDailyTarotFortuneV1',JSON.stringify(saved));
              });
              await page.reload({waitUntil:'networkidle'});
              await page.locator('#daily-fortune-open').click();
              assert.equal(await page.locator('#daily-fortune-card').isDisabled(),false,'stale-day result must unlock a new draw');
              assert.deepEqual(errors,[],`page errors: ${errors.join(' | ')}`);
              await context.close();
            }
          }finally{
            await browser.close();
          }
          EOF_NODE
