name: Daily fortune browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily-fortune.js'
      - 'daily-fortune.css'
      - 'service-worker.js'
      - 'tests/daily-fortune-regression.mjs'
      - '.github/workflows/daily-fortune-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'daily-fortune.js'
      - 'daily-fortune.css'
      - 'service-worker.js'
      - 'tests/daily-fortune-regression.mjs'
      - '.github/workflows/daily-fortune-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static daily fortune regression
        run: node tests/daily-fortune-regression.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/daily-fortune-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/daily-fortune-http.log
          exit 1

      - name: Verify daily fortune draw, persistence, reopen and KST reset
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
          const page = await context.newPage();

          await page.route('https://res.cloudinary.com/**', route => route.fulfill({
            status: 200,
            contentType: 'image/svg+xml',
            body: '<svg xmlns="http://www.w3.org/2000/svg" width="898" height="1488"><rect width="898" height="1488" fill="#111"/></svg>'
          }));

          await page.goto(process.env.BASE_URL + '/index.html?_daily_fortune=' + Date.now(), { waitUntil: 'domcontentloaded' });

          await page.waitForFunction(() => window.CHUNBONG_DAILY_FORTUNE && document.querySelector('#daily-fortune-dialog')?.open === true);
          assert.equal(await page.locator('#daily-fortune-dialog').isVisible(), true, 'first visit should auto-open daily fortune');
          assert.equal(await page.locator('[data-daily-fortune-result]').isHidden(), true, 'result must stay hidden before the draw');
          assert.equal(await page.locator('[data-daily-fortune-image]').getAttribute('src'), null, 'card artwork must not load before the draw');
          const backImage = await page.locator('.daily-fortune-back').evaluate(el => getComputedStyle(el).backgroundImage);
          assert.match(backImage, /f_auto,q_auto:good,c_limit,w_768\/v1789845157\/chunbong-fansite\/tarot-card-back\.png/, 'daily fortune back must render the uploaded artwork');

          const boundary = await page.evaluate(() => ({
            before: window.CHUNBONG_DAILY_FORTUNE.kstDate(new Date('2026-09-19T14:59:59Z')),
            after: window.CHUNBONG_DAILY_FORTUNE.kstDate(new Date('2026-09-19T15:00:00Z'))
          }));
          assert.equal(boundary.before, '2026-09-19', 'KST date must remain the same before midnight');
          assert.equal(boundary.after, '2026-09-20', 'KST date must roll over exactly at midnight');

          // Reproduce the production symptom exactly: modal is open, hover works,
          // but an old native disabled flag would otherwise swallow the card click.
          await page.locator('[data-daily-fortune-card]').evaluate(el => {
            el.disabled = true;
            el.setAttribute('aria-disabled','true');
          });
          const initialStageBox = await page.locator('[data-daily-fortune-stage]').boundingBox();
          assert.ok(initialStageBox, 'initial fortune stage bounding box missing');
          await page.mouse.move(initialStageBox.x + initialStageBox.width * 0.5, initialStageBox.y + initialStageBox.height * 0.5);
          await page.waitForFunction(() => document.querySelector('[data-daily-fortune-card]')?.disabled === false);
          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el => el.disabled), false, 'hovering the stage must immediately repair a stale native-disabled card');

          // Click the visual stage rather than relying on native button click delivery.
          await page.mouse.click(initialStageBox.x + initialStageBox.width * 0.5, initialStageBox.y + initialStageBox.height * 0.5);
          await page.waitForFunction(() => document.querySelector('[data-daily-fortune-stage]')?.classList.contains('is-spinning'));
          const spinStyle = await page.locator('.daily-fortune-card-inner').evaluate(el => ({
            name:getComputedStyle(el).animationName,
            duration:getComputedStyle(el).animationDuration,
            iterations:getComputedStyle(el).animationIterationCount,
            opacity:Number(getComputedStyle(el).opacity)
          }));
          assert.equal(spinStyle.name,'dailyFortuneHyperSpin','fast phase must use the dedicated hyper-spin animation');
          assert.equal(spinStyle.duration,'0.05s','fast phase must run one turn every 50ms');
          assert.equal(spinStyle.iterations,'infinite','fast phase must repeat continuously until deceleration');
          assert.ok(spinStyle.opacity<=0.1,'fast phase must make the card nearly disappear');
          const storageKey = await page.evaluate(() => window.CHUNBONG_DAILY_FORTUNE.STORAGE_KEY);
          assert.equal(await page.evaluate(key => localStorage.getItem(key), storageKey), null, 'daily result must not be persisted before the reveal succeeds');
          await page.waitForTimeout(1900);
          assert.equal(await page.locator('[data-daily-fortune-stage]').evaluate(el=>el.classList.contains('is-spinning')),true,'extended spin should still be visibly spinning near two seconds');
          assert.equal(await page.locator('[data-daily-fortune-result]').isHidden(), true, 'result must remain hidden during the high-speed back spin');
          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el => el.disabled), false, 'draw must remain natively clickable so interrupted states can recover');
          assert.equal(await page.locator('[data-daily-fortune-card]').getAttribute('aria-disabled'), 'true', 'draw must use a logical lock while the card is spinning');
          assert.equal(await page.evaluate(key => localStorage.getItem(key), storageKey), null, 'a mid-spin interruption must not consume today\'s draw');
          await page.waitForFunction(() => document.querySelector('[data-daily-fortune-stage]')?.classList.contains('is-decelerating'), null, { timeout: 1800 });
          const decelStyle = await page.locator('.daily-fortune-card-inner').evaluate(el => ({
            name:getComputedStyle(el).animationName,
            duration:getComputedStyle(el).animationDuration
          }));
          assert.equal(decelStyle.name,'dailyFortuneHyperDecelerate','last 400ms must switch to the visible deceleration animation');
          assert.equal(decelStyle.duration,'0.4s','deceleration must last four tenths of a second');
          await page.waitForFunction(() => {
            const key = window.CHUNBONG_DAILY_FORTUNE?.STORAGE_KEY;
            const raw = key ? localStorage.getItem(key) : '';
            if (!raw) return false;
            const state = JSON.parse(raw);
            return Number.isInteger(state.card) && state.card >= 0 && state.card <= 21;
          });
          await page.waitForFunction(() => document.querySelector('[data-daily-fortune-result]')?.hidden === false);

          const firstState = await page.evaluate(() => JSON.parse(localStorage.getItem(window.CHUNBONG_DAILY_FORTUNE.STORAGE_KEY)));
          assert.ok(firstState.date, 'drawn result must save its KST date');
          assert.ok(firstState.card >= 0 && firstState.card <= 21, 'drawn card must be one of the 22 Major Arcana');
          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el => el.disabled), false, 'saved result must not use the native disabled attribute');
          assert.equal(await page.locator('[data-daily-fortune-card]').getAttribute('aria-disabled'), 'true', 'same-day result must stay logically locked against a second draw');
          assert.match((await page.locator('[data-daily-fortune-image]').getAttribute('src')) || '', /res\.cloudinary\.com\/.*c_crop.*f_auto\/q_auto/, 'drawn card must use the optimized card crop URL');

          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el=>el.classList.contains('is-revealed')), true, 'card must finish on the revealed front side');
          const firstTitle = (await page.locator('[data-daily-fortune-result-title]').textContent())?.trim();
          assert.ok(firstTitle && /오늘의 운세/.test(firstTitle), 'fortune result title must render');

          const stageBox = await page.locator('[data-daily-fortune-stage]').boundingBox();
          assert.ok(stageBox, 'fortune prism stage bounding box missing');
          await page.mouse.move(stageBox.x + stageBox.width * 0.78, stageBox.y + stageBox.height * 0.28);
          await page.waitForFunction(() => document.querySelector('[data-daily-fortune-stage]')?.classList.contains('is-prism-active'));
          const prism = await page.locator('[data-daily-fortune-stage]').evaluate(el=>({
            x:el.style.getPropertyValue('--tilt-x'),
            y:el.style.getPropertyValue('--tilt-y'),
            gx:el.style.getPropertyValue('--glow-x'),
            gy:el.style.getPropertyValue('--glow-y')
          }));
          assert.notEqual(prism.x,'0deg','pointer hover must tilt the result card on X');
          assert.notEqual(prism.y,'0deg','pointer hover must tilt the result card on Y');
          assert.ok(prism.gx && prism.gy,'pointer hover must move prism glow coordinates');
          assert.equal(await page.locator('[data-daily-fortune-holo]').count(),1,'hologram surface must exist');
          assert.equal(await page.locator('.daily-fortune-holo-ripple').count(),0,'crystal material hover must not spawn legacy circular ripples');
          assert.equal(await page.locator('.daily-fortune-holo-spark').count(),0,'crystal hover should not emit noisy spark particles');
          await page.waitForFunction(() => Number(getComputedStyle(document.querySelector('.daily-fortune-holo-film')).opacity) >= 0.82);
          const holo = await page.locator('.daily-fortune-holo-film').evaluate(el=>({
            opacity:Number(getComputedStyle(el).opacity),
            blend:getComputedStyle(el).mixBlendMode,
            background:getComputedStyle(el).backgroundImage
          }));
          assert.ok(holo.opacity>=0.95&&holo.opacity<=1,'crystal material should be unmistakably visible without becoming opaque artwork');
          assert.equal(holo.blend,'screen','crystal material must stay luminous over the artwork');
          assert.match(holo.background,/conic-gradient|radial-gradient/,'pointer hover must render a crystal-prism material');
          assert.equal(await page.locator('.daily-fortune-holo-lens').count(),1,'reference crystal effect must include one pointer-follow diffraction lens');
          assert.equal(await page.locator('.daily-fortune-holo-crystals i').count(),6,'reference crystal effect must include six shard highlights');
          const lens = await page.locator('.daily-fortune-holo-lens').evaluate(el=>({
            opacity:Number(getComputedStyle(el).opacity),
            blend:getComputedStyle(el).mixBlendMode,
            background:getComputedStyle(el).backgroundImage
          }));
          assert.ok(lens.opacity>=0.9,'diffraction lens must be clearly visible on hover');
          assert.equal(lens.blend,'screen','diffraction lens must use luminous screen blending');
          assert.match(lens.background,/repeating-radial-gradient|conic-gradient/,'diffraction lens must contain spectral rings');
          await page.mouse.move(20,20);

          await page.locator('[data-daily-fortune-close]').click();
          await page.waitForFunction(() => document.querySelector('#daily-fortune-dialog')?.open === false);
          assert.equal(await page.locator('[data-daily-fortune-launcher]').isVisible(), true, 'closing result must show the bottom-right launcher');
          const launcherImage = await page.locator('[data-daily-fortune-launcher] > span').evaluate(el => getComputedStyle(el).backgroundImage);
          assert.match(launcherImage, /f_auto,q_auto:good,c_limit,w_768\/v1789845157\/chunbong-fansite\/tarot-card-back\.png/, 'saved-result launcher must reuse the uploaded card back');
          const frontTheme = await page.locator('.daily-fortune-front').evaluate(el => ({
            background: getComputedStyle(el).backgroundImage,
            border: getComputedStyle(el).borderTopColor
          }));
          assert.match(frontTheme.background, /rgb\(8, 21, 47\)|#08152f/i, 'revealed daily card must use the celestial navy frame');

          await page.locator('[data-daily-fortune-launcher]').click();
          await page.waitForFunction(() => document.querySelector('#daily-fortune-dialog')?.open === true);
          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el => el.disabled), false, 'reopened same-day result must remain recoverable at the native button level');
          assert.equal(await page.locator('[data-daily-fortune-card]').getAttribute('aria-disabled'), 'true', 'reopened same-day result must remain logically locked');
          assert.equal((await page.locator('[data-daily-fortune-result-title]').textContent())?.trim(), firstTitle, 'launcher must reopen the same fortune result');

          await page.locator('[data-daily-fortune-close]').click();
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => window.CHUNBONG_DAILY_FORTUNE && document.querySelector('[data-daily-fortune-launcher]')?.hidden === false);
          assert.equal(await page.evaluate(() => document.querySelector('#daily-fortune-dialog')?.open), false, 'same-day reload must not auto-open a new draw');
          assert.equal(await page.locator('[data-daily-fortune-launcher]').isVisible(), true, 'same-day reload must expose the saved-result launcher');

          await page.evaluate(() => {
            const key = window.CHUNBONG_DAILY_FORTUNE.STORAGE_KEY;
            const current = JSON.parse(localStorage.getItem(key));
            localStorage.setItem(key, JSON.stringify({ ...current, date: '2000-01-01' }));
          });
          await page.reload({ waitUntil: 'domcontentloaded' });
          await page.waitForFunction(() => document.querySelector('#daily-fortune-dialog')?.open === true);
          assert.equal(await page.locator('[data-daily-fortune-card]').evaluate(el => el.disabled), false, 'expired KST date must keep the card natively interactive');
          assert.equal(await page.locator('[data-daily-fortune-card]').getAttribute('aria-disabled'), 'false', 'expired KST date must unlock the logical draw state');
          assert.equal(await page.locator('[data-daily-fortune-result]').isHidden(), true, 'expired result must not leak into the new day');
          assert.equal(await page.locator('[data-daily-fortune-image]').getAttribute('src'), null, 'new day must return to an unloaded card back');

          await browser.close();
          EOF_NODE
