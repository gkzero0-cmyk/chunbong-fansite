name: Seed Tarot banner asset

on:
  push:
    branches: [fix/tarot-hero-banner-image]
    paths:
      - '.github/workflows/seed-tarot-banner-asset.yml'

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tarot-hero-banner-image
      - name: Download validated banner and commit it
        shell: bash
        run: |
          set -euo pipefail
          META=$(curl -fsS -X POST 'https://api.firestorage.ai/dev/file/shares/XsjEgKxNZha-/files/01a08b16be0970a28fcae151d0dba695/download')
          DOWNLOAD_URL=$(META="$META" python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ['META'])
          url = payload.get('downloadUrl')
          if not url:
              raise SystemExit(f'missing downloadUrl: {payload}')
          print(url)
          PY
          )
          curl -fsSL "$DOWNLOAD_URL" -o assets/tarot-consult-banner.jpg
          python3 - <<'PY'
          from pathlib import Path
          data = Path('assets/tarot-consult-banner.jpg').read_bytes()
          if len(data) < 100_000 or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit(f'invalid JPEG bytes: {len(data)}')
          offset = 2
          size = None
          sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          while offset + 9 < len(data):
              while offset < len(data) and data[offset] != 0xFF:
                  offset += 1
              while offset < len(data) and data[offset] == 0xFF:
                  offset += 1
              if offset >= len(data): break
              marker = data[offset]; offset += 1
              if marker in {0xD8,0xD9} or 0xD0 <= marker <= 0xD7:
                  continue
              if offset + 1 >= len(data): break
              length = int.from_bytes(data[offset:offset+2], 'big')
              if length < 2 or offset + length > len(data): break
              if marker in sof:
                  h = int.from_bytes(data[offset+3:offset+5], 'big')
                  w = int.from_bytes(data[offset+5:offset+7], 'big')
                  size = (w, h)
                  break
              offset += length
          if size != (960, 540):
              raise SystemExit(f'unexpected JPEG size: {size}')
          print(f'VALID_BANNER={size[0]}x{size[1]} bytes={len(data)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tarot-consult-banner.jpg
          if git diff --cached --quiet; then
            echo 'Banner asset already present.'
            exit 0
          fi
          git commit -m 'Add valid Tarot hero banner JPEG'
          git push origin HEAD:fix/tarot-hero-banner-image
