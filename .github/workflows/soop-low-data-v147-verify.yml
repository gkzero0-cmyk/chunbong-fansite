name: SOOP low-data v1.4.7 verification

on:
  push:
    branches:
      - fix/soop-low-data-watch-20261003

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check collector
        run: node --check chunbong-content-collector.user.js
      - name: Run SOOP regression scripts
        run: |
          set -e
          for f in tests/*soop*.mjs; do
            echo "==> $f"
            node "$f"
          done
      - name: Run unit tests
        run: npm test
