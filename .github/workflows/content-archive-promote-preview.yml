name: Safe content archive preview promotion

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Vercel Preview URL to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
      PROD_URL: https://chunbong-fansite.vercel.app
      VERCEL_SCOPE: gkzero0-9465
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate recovery inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'VERCEL_TOKEN repository secret is not configured.' >&2
            exit 2
          fi
          case "$PREVIEW_URL" in
            https://chunbong-fansite-*.vercel.app) ;;
            *)
              echo "Refusing non-project preview URL: $PREVIEW_URL" >&2
              exit 3
              ;;
          esac

      - name: Require preview commit to match current main
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          body="$(curl -fsSL --connect-timeout 10 --max-time 25 -H 'cache-control: no-cache' "$PREVIEW_URL/api/version?_ts=$(date +%s)")"
          actual="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"
          echo "expected=$expected actual=${actual:-missing}"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Refusing to promote a preview that does not match current main.' >&2
            exit 4
          fi
          printf '%s' "$expected" > /tmp/expected-main-sha

      - name: Confirm Vercel preview exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest inspect "$PREVIEW_URL" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify archive preview
        shell: bash
        run: |
          set -euo pipefail
          stamp=$(date +%s)
          curl -fsSL -H 'cache-control: no-cache' "$PREVIEW_URL/chunbong-contents.js?_promote_source=$stamp" -o /tmp/archive.js
          curl -fsSL -H 'cache-control: no-cache' "$PREVIEW_URL/chunbong-contents.css?_promote_source=$stamp" -o /tmp/archive.css
          curl -fsSL -H 'cache-control: no-cache' "$PREVIEW_URL/api/content?type=chunbong-content&id=leopel&_promote_source=$stamp" -o /tmp/leopel.json
          curl -fsSL -H 'cache-control: no-cache' "$PREVIEW_URL/api/content?type=chunbong-content&id=justserver-moneygame&_promote_source=$stamp" -o /tmp/moneygame.json
          grep -Fq 'detailTitleClass' /tmp/archive.js
          grep -Fq 'archive readability normalization' /tmp/archive.css
          grep -Fq 'archive-result-card' /tmp/archive.js
          if grep -Fq 'content-archive-auto-sync' /tmp/archive.js; then
            echo 'Public archive runtime must not trigger automatic collection.' >&2
            exit 5
          fi
          node - <<'NODE'
          const fs=require('fs');
          const leopel=JSON.parse(fs.readFileSync('/tmp/leopel.json','utf8')).item;
          const money=JSON.parse(fs.readFileSync('/tmp/moneygame.json','utf8')).item;
          if(!leopel||leopel.id!=='leopel'||!leopel.title)throw new Error('Leopel archive payload is invalid');
          if(!money||money.id!=='justserver-moneygame'||!money.title)throw new Error('Moneygame archive payload is invalid');
          console.log('validated archive preview payloads');
          NODE

      - name: Point production alias at validated preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest alias set "$PREVIEW_URL" "chunbong-fansite.vercel.app" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Verify production commit and archive
        shell: bash
        run: |
          set -euo pipefail
          expected="$(cat /tmp/expected-main-sha)"
          for attempt in $(seq 1 30); do
            stamp=$(date +%s)
            version="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'cache-control: no-cache' "$PROD_URL/api/version?_ts=$stamp" || true)"
            actual="$(printf '%s' "$version" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"
            if [[ "$actual" == "$expected" ]] &&                curl -fsSL -H 'cache-control: no-cache' "$PROD_URL/chunbong-contents.js?_promote_check=$stamp" -o /tmp/prod-archive.js &&                ! grep -Fq 'content-archive-auto-sync' /tmp/prod-archive.js; then
              echo "Production safely promoted at $actual"
              exit 0
            fi
            echo "Waiting for production alias: attempt=$attempt actual=${actual:-missing} expected=$expected"
            sleep 5
          done
          echo 'Production did not receive the validated current-main preview in time.' >&2
          exit 1
