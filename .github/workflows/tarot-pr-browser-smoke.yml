name: Tarot PR browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'tarot.html'
      - 'tarot.js'
      - 'tarot-sfx-v2.js'
      - 'tarot.css'
      - 'tarot-quality.css'
      - 'tarot-composite.css'
      - 'tarot-luxury-foil.css'
      - 'tarot-composite.js'
      - 'tarot-data.js'
      - 'tests/tarot-clarity-numbered-backs-regression.mjs'
      - 'tests/tarot-selection-fortune-frame-regression.mjs'
      - 'tests/tarot-luxury-foil-zoom-regression.mjs'
      - 'tests/tarot-mobile-quick-browser.mjs'
      - '.github/workflows/tarot-pr-browser-smoke.yml'

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static celestial tarot regression
        run: |
          node tests/tarot-clarity-numbered-backs-regression.mjs
          node tests/tarot-selection-fortune-frame-regression.mjs
          node tests/tarot-luxury-foil-zoom-regression.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/tarot-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4174/tarot.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tarot-http.log
          exit 1

      - name: Verify uploaded backs, matching numbers and revealed frame
        env:
          BASE_URL: http://127.0.0.1:4174
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1585,height:736},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.route('https://res.cloudinary.com/**',route=>route.fulfill({
              status:200,
              contentType:'image/svg+xml',
              body:'<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536"><rect width="1024" height="1536" fill="#08152f"/><circle cx="512" cy="768" r="230" fill="#f0b934"/></svg>'
            }));

            await page.goto(process.env.BASE_URL+'/tarot.html?_celestial='+Date.now(),{waitUntil:'domcontentloaded'});
            await page.locator('input[name="spread"][value="threeFlow"]').check();
            await page.locator('input[name="selection-mode"][value="cards"]').check();
            await page.locator('#tarot-shuffle').click();
            await page.waitForFunction(()=>document.querySelectorAll('#tarot-deck [data-card-index]').length===78);
            await page.waitForTimeout(750);

            const deckState=await page.locator('#tarot-deck .tarot-card-back').evaluateAll(cards=>{
              const read=card=>{
                const number=card.querySelector('.tarot-card-back-number');
                const cardStyle=getComputedStyle(card);
                const numberStyle=getComputedStyle(number);
                const rect=card.getBoundingClientRect();
                return {
                  backgroundImage:cardStyle.backgroundImage,
                  ratio:rect.width/rect.height,
                  text:number.textContent.trim(),
                  font:numberStyle.fontFamily,
                  color:numberStyle.color,
                  numberBackground:numberStyle.backgroundImage
                };
              };
              return [read(cards[0]),read(cards[77])];
            });

            for(const item of deckState){
              assert.match(item.backgroundImage,/f_auto,q_auto:good,c_limit,w_768\/v1789845157\/chunbong-fansite\/tarot-card-back\.png/,'deck card must use the exact uploaded back');
              assert.ok(Math.abs(item.ratio-(2/3))<0.02,'deck card back must preserve the 2:3 uploaded-art ratio');
              assert.match(item.font,/Georgia/i,'deck number must use celestial serif typography');
              assert.equal(item.color,'rgb(255, 215, 95)','deck number must use matching gold');
              assert.match(item.numberBackground,/radial-gradient/,'deck number must use the navy celestial medallion');
            }
            assert.equal(deckState[0].text,'1');
            assert.equal(deckState[1].text,'78');

            const cards=page.locator('#tarot-deck [data-card-index]');
            await cards.nth(0).hover();
            await page.waitForFunction(()=>{
              const card=document.querySelector('#tarot-deck [data-card-index]');
              return card?.classList.contains('is-foil-active')&&Number(getComputedStyle(card,'::before').opacity)>=0.6;
            });
            const deckFoil=await cards.nth(0).evaluate(card=>({
              beforeOpacity:Number(getComputedStyle(card,'::before').opacity),
              border:getComputedStyle(card).borderTopColor,
              transform:getComputedStyle(card).transform
            }));
            assert.ok(deckFoil.beforeOpacity>=0.6,'deck hover must expose a visible inner prism');
            assert.notEqual(deckFoil.transform,'none','deck hover must visibly lift/tilt the card');
            await page.mouse.move(5,5);

            await cards.nth(0).click();
            const selectedState=await cards.nth(0).evaluate(card=>{
              const style=getComputedStyle(card);
              const badge=card.querySelector('.tarot-selection-order-badge');
              const badgeStyle=badge?getComputedStyle(badge):null;
              return {
                order:card.dataset.selectionOrder,
                total:card.dataset.selectionTotal,
                label:card.dataset.selectionLabel,
                pressed:card.getAttribute('aria-pressed'),
                transform:style.transform,
                outline:style.outlineStyle,
                badgeText:badge?.textContent?.trim()||'',
                badgeDisplay:badgeStyle?.display||'',
                badgeOpacity:badgeStyle?.opacity||''
              };
            });
            assert.equal(selectedState.order,'1','first pick must expose selection order');
            assert.equal(selectedState.total,'3','three-card spread must expose total selection count');
            assert.equal(selectedState.label,'1/3','first pick must expose visible current/total label');
            assert.equal(selectedState.pressed,'true');
            assert.notEqual(selectedState.transform,'none','selected card must visibly lift/scale');
            assert.equal(selectedState.outline,'solid','selected card must have an explicit rim');
            assert.equal(selectedState.badgeText,'1/3','selected badge must show current/total order');
            assert.equal(selectedState.badgeDisplay,'inline-flex','selected badge must remain visible above foil effects');
            assert.equal(selectedState.badgeOpacity,'1','selected badge must not inherit the faded card state');
            assert.equal(await cards.nth(1).getAttribute('data-selection-order'),null,'unselected card must not receive selection order');

            await cards.nth(1).click();
            await cards.nth(2).click();
            assert.equal((await cards.nth(1).locator('.tarot-selection-order-badge').textContent())?.trim(),'2/3');
            assert.equal((await cards.nth(2).locator('.tarot-selection-order-badge').textContent())?.trim(),'3/3');
            await page.locator('#tarot-confirm-selection').click();
            await page.waitForFunction(()=>document.querySelectorAll('#tarot-reading-grid .tarot-composite-svg').length===3);

            const revealed=await page.locator('#tarot-reading-grid .tarot-composite-svg').first().evaluate(svg=>svg.outerHTML);
            assert.match(revealed,/stop-color="#0b1b3a"/,'revealed frame needs celestial navy');
            assert.match(revealed,/fill="#07142d"/,'revealed frame needs deep navy inner border');
            assert.match(revealed,/fill="#ffd75b"/,'revealed frame needs gold star ornaments');
            assert.match(revealed,/fill="#fff0ae"/,'revealed title needs matching warm gold');
            assert.match(revealed,/class="tarot-composite-svg tarot-fortune-frame"/,'revealed card must use the daily-fortune frame shell');
            assert.match(revealed,/class="tarot-fortune-art-shell"[^>]*stroke-width="4"/,'revealed artwork frame must stay thin');
            assert.doesNotMatch(revealed,/stroke-width="18"/,'legacy thick outer frame must stay removed');
            assert.doesNotMatch(revealed,/stroke-width="11"/,'legacy thick art border must stay removed');

            const foil=page.locator('#tarot-reading-grid [data-tarot-foil]').first();
            await foil.hover();
            await page.waitForFunction(()=>document.querySelector('#tarot-reading-grid [data-tarot-foil]')?.classList.contains('is-foil-active'));
            const foilState=await foil.evaluate(el=>({
              x:el.style.getPropertyValue('--foil-x'),
              y:el.style.getPropertyValue('--foil-y'),
              tx:el.style.getPropertyValue('--foil-tilt-x'),
              ty:el.style.getPropertyValue('--foil-tilt-y'),
              ripple:el.classList.contains('is-foil-rippling')
            }));
            assert.ok(foilState.x&&foilState.y,'tarot foil must track pointer coordinates');
            assert.notEqual(foilState.tx,'0deg','tarot foil must tilt on X');
            assert.notEqual(foilState.ty,'0deg','tarot foil must tilt on Y');

            await page.locator('#tarot-reading-grid [data-tarot-zoom]').first().click();
            await page.waitForFunction(()=>document.querySelector('#tarot-card-zoom')?.open===true);
            const zoomMetrics=await page.locator('#tarot-card-zoom').evaluate(dialog=>{
              const card=dialog.querySelector('[data-tarot-foil]');
              const rect=dialog.getBoundingClientRect();
              const cardRect=card.getBoundingClientRect();
              const vh=window.visualViewport?.height||window.innerHeight;
              return {
                top:rect.top,bottom:rect.bottom,clientHeight:dialog.clientHeight,scrollHeight:dialog.scrollHeight,
                cardBottom:cardRect.bottom,vh
              };
            });
            assert.ok(zoomMetrics.top>=-1,'large tarot dialog must stay inside the viewport top');
            assert.ok(zoomMetrics.bottom<=zoomMetrics.vh+1,'large tarot dialog must stay inside the viewport bottom');
            assert.ok(zoomMetrics.scrollHeight<=zoomMetrics.clientHeight+1,'large tarot dialog must not require internal scrolling');
            assert.ok(zoomMetrics.cardBottom<=zoomMetrics.vh-4,'large tarot card must fit fully on screen');
            await page.locator('#tarot-card-zoom-close').click();

            assert.deepEqual(errors,[]);
          }finally{
            await browser.close();
          }
          EOF_NODE

      - name: Verify mobile quick tarot touch flow
        env:
          BASE_URL: http://127.0.0.1:4174
        run: node tests/tarot-mobile-quick-browser.mjs
