name: Apply tarot DOM number fix once

on:
  push:
    branches: [fix/tarot-dom-number-badges]
    paths:
      - '.github/workflows/apply-tarot-dom-number-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tarot-dom-number-badges
          fetch-depth: 0

      - name: Apply minimal DOM-number fix
        run: |
          python - <<'PY'
          from pathlib import Path

          tarot = Path('tarot.js')
          source = tarot.read_text()
          old = '<button class="tarot-card-back" type="button" data-card-index="${index}" aria-pressed="false" aria-label="뒤집힌 타로 카드 ${index + 1} 선택"><span>CB</span></button>'
          new = '<button class="tarot-card-back" type="button" data-card-index="${index}" aria-pressed="false" aria-label="뒤집힌 타로 카드 ${index + 1} 선택"><span class="tarot-card-back-number" aria-hidden="true">${index + 1}</span></button>'
          if source.count(old) != 1:
              raise SystemExit(f'tarot.js renderDeck replacement count={source.count(old)}')
          tarot.write_text(source.replace(old, new, 1))

          css = Path('tarot-composite.css')
          css_source = css.read_text()
          start = '/* Direct-selection backs: one calm, centered, high-contrast 1–78 badge. */'
          end = '@media(prefers-reduced-motion:reduce)'
          if css_source.count(start) != 1 or css_source.count(end) != 1:
              raise SystemExit('tarot-composite.css direct-selection block markers changed')
          before, rest = css_source.split(start, 1)
          _, after = rest.split(end, 1)
          block = '\n'.join((
              '/* Direct-selection backs: one calm, centered, high-contrast 1–78 badge. */',
              '#tarot-deck .tarot-card-back{display:grid;place-items:center;position:relative}',
              '#tarot-deck .tarot-card-back-number{display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #ffb15b78;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ffcc8d2e 0 18%,#ff7a161d 52%,#120b0790 100%);color:#ffc27b;font-size:16px;font-weight:950;font-variant-numeric:tabular-nums;letter-spacing:0;line-height:1;text-align:center;text-shadow:0 1px 2px #000,0 0 12px #ff6b184a;box-shadow:inset 0 0 0 1px #0008,0 5px 14px #0008;pointer-events:none}',
              '#tarot-deck .tarot-card-back:hover .tarot-card-back-number,#tarot-deck .tarot-card-back:focus-visible .tarot-card-back-number{border-color:#ffd39a;background:radial-gradient(circle at 34% 28%,#ffe1b04a 0 20%,#ff87232a 54%,#160d0898 100%);color:#ffe1b2}',
              '#tarot-deck .tarot-card-back.selected{opacity:1!important;cursor:pointer;border-color:#ffb15b;box-shadow:0 0 28px #ff6b1848,inset 0 0 0 4px #080808,inset 0 0 0 5px #ffb15b80}',
              '#tarot-deck .tarot-card-back.selected .tarot-card-back-number{border-color:#ffe0ad;background:linear-gradient(145deg,#ffb660,#c85b16);color:#1a0d05;text-shadow:0 1px 0 #fff6;box-shadow:0 0 0 3px #ffad5a20,0 6px 16px #0008}',
              '',
              '@media(max-width:700px){.tarot-card-dialog-art .tarot-card-art.tarot-card-composite{width:min(88vw,540px)}#tarot-deck .tarot-card-back-number{width:36px;height:36px;font-size:13px}}',
              '@media(max-width:430px){#tarot-deck .tarot-card-back-number{width:32px;height:32px;font-size:12px}}',
              ''
          ))
          css.write_text(before + block + end + after)

          workflow = Path('.github/workflows/tarot-production-smoke.yml')
          lines = workflow.read_text().splitlines(keepends=True)
          out = []
          removed_badge = changed_content = changed_first = changed_last = 0
          for line in lines:
              if "const badge = getComputedStyle(span, '::after');" in line:
                  removed_badge += 1
                  continue
              if 'content: badge.content.replace(' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}text: span.textContent.trim(),\n')
                  changed_content += 1
                  continue
              if "assert.equal(badgeState[0].content, '1');" in line:
                  out.append(line.replace('badgeState[0].content', 'badgeState[0].text'))
                  changed_first += 1
                  continue
              if "assert.equal(badgeState[1].content, '78');" in line:
                  out.append(line.replace('badgeState[1].content', 'badgeState[1].text'))
                  changed_last += 1
                  continue
              out.append(line)
          counts = (removed_badge, changed_content, changed_first, changed_last)
          if counts != (1, 1, 1, 1):
              raise SystemExit(f'tarot production smoke line replacements={counts}')
          workflow.write_text(''.join(out))
          PY

          node --check tarot.js
          node tests/tarot-clarity-numbered-backs-regression.mjs

      - name: Commit implementation and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-tarot-dom-number-fix-once.yml
          git config user.name 'gkzero0-cmyk'
          git config user.email 'gkzero0@gmail.com'
          git add tarot.js tarot-composite.css .github/workflows/tarot-production-smoke.yml .github/workflows/apply-tarot-dom-number-fix-once.yml
          git commit -m 'fix: render tarot deck numbers as DOM text'
          git push origin HEAD:fix/tarot-dom-number-badges