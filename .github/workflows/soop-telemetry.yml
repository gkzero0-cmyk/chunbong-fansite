name: SOOP telemetry

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soop-telemetry.yml'
      - 'scripts/collect-soop-telemetry.mjs'
      - 'lib/push-notifications-api.js'

permissions:
  contents: write
  id-token: write

concurrency:
  group: chunbong-soop-telemetry
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Load telemetry branch state
        run: |
          set -euo pipefail
          git fetch origin refs/heads/data/soop-telemetry:refs/remotes/origin/data/soop-telemetry || true
          if git show refs/remotes/origin/data/soop-telemetry:data/soop-live-state.json > /tmp/soop-live-state.json 2>/dev/null; then
            echo 'Loaded previous telemetry state'
          else
            printf '%s\n' '{"version":1,"session":null,"lastProfile":null}' > /tmp/soop-live-state.json
          fi
      - name: Collect public SOOP sample
        run: |
          SOOP_STATE_PATH=/tmp/soop-live-state.json \
          SOOP_NEXT_STATE_PATH=/tmp/soop-next-state.json \
          SOOP_FINAL_SESSION_PATH=/tmp/soop-final-session.json \
          SOOP_SAMPLE_PATH=/tmp/soop-sample.json \
          node scripts/collect-soop-telemetry.mjs
      - name: Reuse telemetry sample for push and archive checks
        env:
          AUDIENCE: chunbong-fansite-push
          PUSH_URL: https://chunbong-fansite.vercel.app/api/content?type=push-dispatch
          ARCHIVE_SYNC_URL: https://chunbong-fansite.vercel.app/api/content?type=content-archive-auto-sync
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]]; then separator='&'; fi
          response="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${AUDIENCE}")"
          token="$(printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s).value||'';if(!v)process.exit(2);process.stdout.write(v)})")"
          payload="$(node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/soop-sample.json','utf8'));
          const live=typeof s.live==='boolean'?{
            live:s.live,
            title:String(s.title||''),
            startedAt:String(s.startedAt||''),
            broadcastId:String(s.broadcastId||s.startedAt||s.title||'')
          }:null;
          process.stdout.write(JSON.stringify(live?{live}:{skipLive:true}));
          NODE
          )"
          curl -fsS --retry 1 --retry-delay 2 --max-time 55 \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Origin: https://github.com" \
            -H "Content-Type: application/json" \
            -H "User-Agent: chunbong-soop-telemetry-push" \
            -d "$payload" \
            "$PUSH_URL"
          echo

          minute="$(date -u +%M)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$minute" == "00" || "$minute" == "30" ]]; then
            curl -fsS --retry 1 --retry-delay 2 --max-time 55 \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H "Origin: https://github.com" \
              -H "Content-Type: application/json" \
              -H "User-Agent: chunbong-soop-telemetry-archive-sync" \
              -d '{}' \
              "$ARCHIVE_SYNC_URL"
            echo
          fi
      - name: Persist transient telemetry state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/soop-telemetry-worktree
          if git show-ref --verify --quiet refs/remotes/origin/data/soop-telemetry; then
            git worktree add --detach /tmp/soop-telemetry-worktree refs/remotes/origin/data/soop-telemetry
            cd /tmp/soop-telemetry-worktree
            git checkout -B data/soop-telemetry
          else
            git worktree add -b data/soop-telemetry /tmp/soop-telemetry-worktree main
            cd /tmp/soop-telemetry-worktree
          fi
          mkdir -p data
          cp /tmp/soop-next-state.json data/soop-live-state.json
          git checkout main -- vercel.json
          git add data/soop-live-state.json vercel.json
          if git diff --cached --quiet -- data/soop-live-state.json vercel.json; then
            echo 'Telemetry state unchanged'
          else
            git commit -m 'data: update SOOP live telemetry'
            git push origin HEAD:data/soop-telemetry
          fi
      - name: Persist finalized stream session to main
        run: |
          set -euo pipefail
          if ! node -e "const x=require('/tmp/soop-final-session.json'); process.exit(x&&x.id?0:1)"; then
            echo 'No finalized session'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          git pull --rebase origin main
          SOOP_SESSION_INPUT=/tmp/soop-final-session.json \
          SOOP_SESSION_STORE=data/soop-sessions.json \
          node scripts/apply-soop-session.mjs
          if git diff --quiet -- data/soop-sessions.json; then
            echo 'Session already stored'
            exit 0
          fi
          git add data/soop-sessions.json
          git commit -m 'data: add completed SOOP stream session'
          git push origin HEAD:main
