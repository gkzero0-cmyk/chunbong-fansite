name: Apply SOOP overview metric patch

on:
  push:
    branches: [feat/chunbong-soop-analytics]
    paths:
      - '.github/workflows/chunbong-soop-overview-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbong-soop-analytics
          fetch-depth: 0
      - name: Make external history injectable
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/chunbong-data.js')
          s=p.read_text()
          old="""  const readSnapshots = deps.readSnapshots || readSnapshotHistory;
  const readSessions = deps.readSessions || readSoopSessionHistory;
  const errors = [];
"""
          new="""  const readSnapshots = deps.readSnapshots || readSnapshotHistory;
  const readSessions = deps.readSessions || readSoopSessionHistory;
  const readExternalHistory = deps.readExternalHistory || (deps.readSessions ? () => ({ version: 1, cutoffKst: '', sessions: [], sourceSummary: null, categoryReference: null }) : () => soopExternalHistory);
  const errors = [];
"""
          assert old in s
          s=s.replace(old,new,1)
          old="""  const snapshots = readSnapshots();
  const sessionStore = readSessions();
  const measuredSessions = Array.isArray(sessionStore?.sessions) ? sessionStore.sessions : [];
  const sessions = mergeExternalSessions(measuredSessions, soopExternalHistory.sessions || [], soopExternalHistory.cutoffKst || '');
  const soopAnalytics = buildSoopAnalytics(sessions, snapshots?.snapshots || [], live, now);
  const externalSummary = soopExternalHistory.sourceSummary || {};
"""
          new="""  const snapshots = readSnapshots();
  const sessionStore = readSessions();
  const externalHistory = readExternalHistory() || { version: 1, cutoffKst: '', sessions: [] };
  const measuredSessions = Array.isArray(sessionStore?.sessions) ? sessionStore.sessions : [];
  const sessions = mergeExternalSessions(measuredSessions, externalHistory.sessions || [], externalHistory.cutoffKst || '');
  const soopAnalytics = buildSoopAnalytics(sessions, snapshots?.snapshots || [], live, now);
  const externalSummary = externalHistory.sourceSummary || {};
"""
          assert old in s
          s=s.replace(old,new,1)
          old="""        cutoffKst: soopExternalHistory.cutoffKst || '',
        backfillCount: Array.isArray(soopExternalHistory.sessions) ? soopExternalHistory.sessions.length : 0,
        sourceSummary: soopExternalHistory.sourceSummary || null,
        categoryReference: soopExternalHistory.categoryReference || null,
"""
          new="""        cutoffKst: externalHistory.cutoffKst || '',
        backfillCount: Array.isArray(externalHistory.sessions) ? externalHistory.sessions.length : 0,
        sourceSummary: externalHistory.sourceSummary || null,
        categoryReference: externalHistory.categoryReference || null,
"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chunbong-data.js
          git commit -m "fix: isolate external SOOP history dependencies"
          git push origin HEAD:feat/chunbong-soop-analytics
