name: Seed Clips hero asset

on:
  push:
    branches: [feature/clips-hero-banner]
    paths:
      - '.github/workflows/seed-clips-hero-asset.yml'

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/clips-hero-banner
      - name: Download validated Clips banner and commit it
        shell: bash
        run: |
          set -euo pipefail
          META=$(curl -fsS -X POST 'https://api.firestorage.ai/dev/file/shares/vrNsNDH4anNi/files/01a08d0d1ab97079adad8facc1bbc552/download')
          DOWNLOAD_URL=$(META="$META" python3 - <<'PY'
          import json, os
          payload = json.loads(os.environ['META'])
          url = payload.get('downloadUrl')
          if not url:
              raise SystemExit(f'missing downloadUrl: {payload}')
          print(url)
          PY
          )
          mkdir -p assets
          curl -fsSL "$DOWNLOAD_URL" -o assets/clips-hero-banner.jpg
          python3 - <<'PY'
          from pathlib import Path
          data = Path('assets/clips-hero-banner.jpg').read_bytes()
          if len(data) < 100_000 or not data.startswith(b'\xff\xd8') or not data.endswith(b'\xff\xd9'):
              raise SystemExit(f'invalid JPEG bytes: {len(data)}')
          print(f'VALID_CLIPS_BANNER bytes={len(data)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/clips-hero-banner.jpg
          if git diff --cached --quiet; then
            echo 'Clips banner asset already present.'
            exit 0
          fi
          git commit -m 'Add Clips hero banner image'
          git push origin HEAD:feature/clips-hero-banner
