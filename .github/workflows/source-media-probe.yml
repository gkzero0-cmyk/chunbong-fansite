name: Temporary source media probe

on:
  pull_request:
    paths:
      - '.github/workflows/source-media-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe NamuWiki image transport
        shell: bash
        run: |
          set -u
          URL='https://file.namu.moe/file/1f50353a5880f150f832a449e34a76abd8dda25222fc9ff9aed52ec480b70ef1'
          code=$(curl -L --max-time 20 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' -e 'https://namu.wiki/' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -o /tmp/namu-image -sS -w '%{http_code}' "$URL" || true)
          echo "namu_status=$code"
          echo "namu_bytes=$(wc -c </tmp/namu-image 2>/dev/null || echo 0)"
          file /tmp/namu-image 2>/dev/null || true
          head -c 160 /tmp/namu-image 2>/dev/null | strings | head -3 || true

      - name: Probe public Notion record map media
        shell: bash
        run: |
          node <<'NODE'
          const rootId='217d57d6-a55c-80d6-8958-c2ce1762308d';
          const headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept':'application/json','Content-Type':'application/json','Origin':'https://www.notion.so','Referer':'https://www.notion.so/'};
          const queue=[rootId],seen=new Set(),found=[];
          while(queue.length&&seen.size<28&&found.length<16){
            const pageId=queue.shift();if(seen.has(pageId))continue;seen.add(pageId);
            const response=await fetch('https://www.notion.so/api/v3/loadCachedPageChunk',{method:'POST',headers,body:JSON.stringify({pageId,limit:100,cursor:{stack:[]},chunkNumber:0,verticalColumns:false})});
            console.log('notion_page='+pageId+' status='+response.status);
            const payload=await response.json().catch(()=>({})),rm=payload.recordMap||{},signed=rm.signed_urls||rm.signedUrls||{};
            const blocks=Object.entries(rm.block||{}).map(([id,entry])=>({id,value:entry?.value?.value||entry?.value||{}}));
            for(const row of blocks){
              const b=row.value||{};
              if(b.type==='page'&&row.id!==pageId&&!seen.has(row.id))queue.push(row.id);
              if(['image','file'].includes(String(b.type||''))){
                const source=Array.isArray(b.properties?.source)?String(b.properties.source?.[0]?.[0]||''):String(b.format?.display_source||'');
                const sample={pageId,id:row.id,type:b.type,file_ids:b.file_ids,parent_id:b.parent_id,parent_table:b.parent_table,space_id:b.space_id,source,properties:b.properties,format:b.format,signed:signed?.[row.id]};
                found.push(sample);console.log('MEDIA '+JSON.stringify(sample).slice(0,3600));
                if(source&&source.startsWith('attachment:')&&found.length<=3){
                  const sign=await fetch('https://www.notion.so/api/v3/getSignedFileUrls',{method:'POST',headers,body:JSON.stringify({urls:[{url:source,permissionRecord:{id:row.id,table:b.parent_table||'block',spaceId:b.space_id||''}}]})});
                  console.log('SIGN status='+sign.status+' '+(await sign.text()).slice(0,1800));
                }
              }
            }
          }
          console.log('notion_pages_scanned='+seen.size+' media_blocks='+found.length);
          NODE
