name: Temporary source media probe

on:
  pull_request:
    paths:
      - '.github/workflows/source-media-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe NamuWiki image transport
        shell: bash
        run: |
          set -u
          URL='https://file.namu.moe/file/1f50353a5880f150f832a449e34a76abd8dda25222fc9ff9aed52ec480b70ef1'
          code=$(curl -L --max-time 20 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36' -e 'https://namu.wiki/' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -o /tmp/namu-image -sS -w '%{http_code}' "$URL" || true)
          echo "namu_status=$code"
          echo "namu_bytes=$(wc -c </tmp/namu-image 2>/dev/null || echo 0)"
          file /tmp/namu-image 2>/dev/null || true
          head -c 160 /tmp/namu-image 2>/dev/null | strings | head -3 || true

      - name: Probe public Notion record map media
        shell: bash
        run: |
          node <<'NODE'
          const pageId='217d57d6-a55c-80d6-8958-c2ce1762308d';
          const response=await fetch('https://www.notion.so/api/v3/loadCachedPageChunk',{
            method:'POST',
            headers:{'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36','Accept':'application/json','Content-Type':'application/json','Origin':'https://www.notion.so','Referer':'https://www.notion.so/'},
            body:JSON.stringify({pageId,limit:100,cursor:{stack:[]},chunkNumber:0,verticalColumns:false})
          });
          console.log('notion_status='+response.status);
          const payload=await response.json().catch(()=>({}));
          const rm=payload.recordMap||{};
          console.log('recordMap_keys='+Object.keys(rm).join(','));
          const signed=rm.signed_urls||rm.signedUrls||{};
          console.log('signed_urls_type='+(Array.isArray(signed)?'array':typeof signed)+' count='+(Array.isArray(signed)?signed.length:Object.keys(signed||{}).length));
          const blocks=Object.entries(rm.block||{}).map(([id,entry])=>({id,value:entry?.value?.value||entry?.value||{}}));
          const media=blocks.filter(row=>['image','file'].includes(String(row.value?.type||''))).slice(0,12);
          for(const row of media){
            const b=row.value||{};
            console.log(JSON.stringify({id:row.id,type:b.type,file_ids:b.file_ids,properties:b.properties,format:b.format,signed:signed?.[row.id]},null,0).slice(0,2400));
          }
          console.log('media_blocks='+media.length);
          NODE
