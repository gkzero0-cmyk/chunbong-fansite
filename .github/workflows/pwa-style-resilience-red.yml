name: PWA style resilience verification

on:
  push:
    branches: [fix/pwa-style-cache-resilience-20261001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check changed JavaScript syntax
        run: |
          node --check service-worker.js
          node --check theme-init.js
      - name: Verify generated assets
        run: |
          node scripts/build-tarot-css.mjs --check
          node scripts/build-tarot-js.mjs --check
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
