name: Vercel auth diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vercel-auth-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_PROJECT_SECRET_PRESENT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
      VERCEL_ORG_SECRET_PRESENT: ${{ secrets.VERCEL_ORG_ID != '' }}
      VERCEL_PROJECT_VAR_PRESENT: ${{ vars.VERCEL_PROJECT_ID != '' }}
      VERCEL_ORG_VAR_PRESENT: ${{ vars.VERCEL_ORG_ID != '' }}
    steps:
      - name: Report credential presence only
        run: |
          echo "VERCEL_TOKEN_PRESENT=$VERCEL_TOKEN_PRESENT"
          echo "VERCEL_PROJECT_SECRET_PRESENT=$VERCEL_PROJECT_SECRET_PRESENT"
          echo "VERCEL_ORG_SECRET_PRESENT=$VERCEL_ORG_SECRET_PRESENT"
          echo "VERCEL_PROJECT_VAR_PRESENT=$VERCEL_PROJECT_VAR_PRESENT"
          echo "VERCEL_ORG_VAR_PRESENT=$VERCEL_ORG_VAR_PRESENT"
