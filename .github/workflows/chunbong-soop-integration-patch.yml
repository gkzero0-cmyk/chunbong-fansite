name: Apply SOOP external integration patch

on:
  push:
    branches: [feat/chunbong-soop-analytics]
    paths:
      - '.github/workflows/chunbong-soop-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbong-soop-analytics
          fetch-depth: 0
      - name: Patch data aggregation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/chunbong-data.js')
          s=p.read_text()
          old="const { buildSoopAnalytics } = require('./soop-analytics');"
          new="const { buildSoopAnalytics } = require('./soop-analytics');\nconst { fetchExternalSoopStats, mergeExternalSessions, mergeSoopMetricSources, extractExternalSoopStatsFromHtml } = require('./soop-external');"
          assert old in s
          s=s.replace(old,new,1)

          old="  const fetchSoopProfile = deps.fetchSoopProfile || fetchSoopChannelProfile;\n  const fetchYoutubeChannel = deps.fetchYoutubeChannel || (deps.fetchYoutube ? async () => ({ subscriberCount: null, viewCount: null, videoCount: null, source: YOUTUBE_CHANNEL }) : fetchYoutubeChannelStats);"
          new="  const fetchSoopProfile = deps.fetchSoopProfile || fetchSoopChannelProfile;\n  const fetchExternalSoop = deps.fetchExternalSoop || ((deps.fetchLive || deps.fetchSoopProfile) ? async () => ({ source: '', fieldSources: {}, sources: [], currentViewerCount: null, followerCount: null, averageViewers: null, maxViewers: null, minViewers: null, airtimeMinutes: null }) : fetchExternalSoopStats);\n  const fetchYoutubeChannel = deps.fetchYoutubeChannel || (deps.fetchYoutube ? async () => ({ subscriberCount: null, viewCount: null, videoCount: null, source: YOUTUBE_CHANNEL }) : fetchYoutubeChannelStats);"
          assert old in s
          s=s.replace(old,new,1)

          old="  const [vodResult, clipsResult, liveResult, profileResult, youtubeResult, channelResult] = await Promise.allSettled([\n    fetchVod(), fetchClips(), fetchLive(), fetchSoopProfile(), fetchYoutube(), fetchYoutubeChannel()\n  ]);"
          new="  const [vodResult, clipsResult, liveResult, profileResult, externalResult, youtubeResult, channelResult] = await Promise.allSettled([\n    fetchVod(), fetchClips(), fetchLive(), fetchSoopProfile(), fetchExternalSoop(), fetchYoutube(), fetchYoutubeChannel()\n  ]);"
          assert old in s
          s=s.replace(old,new,1)

          old="  if (profileResult.status === 'rejected') errors.push({ platform: 'soop', source: 'profile', message: profileResult.reason?.message || String(profileResult.reason) });\n\n  const live = {\n    ...liveBase,\n    categoryId: liveBase.categoryId || profile.categoryId || '',\n    categoryName: liveBase.categoryName || profile.categoryName || '',\n    followerCount: Number.isFinite(liveBase.followerCount) ? liveBase.followerCount : profile.followerCount,\n    fanclubCount: Number.isFinite(liveBase.fanclubCount) ? liveBase.fanclubCount : profile.fanclubCount,\n    profileSource: profile.source || ''\n  };"
          new="  if (profileResult.status === 'rejected') errors.push({ platform: 'soop', source: 'profile', message: profileResult.reason?.message || String(profileResult.reason) });\n\n  const externalSoop = externalResult.status === 'fulfilled'\n    ? externalResult.value\n    : { source: '', fieldSources: {}, sources: [], currentViewerCount: null, followerCount: null, averageViewers: null, maxViewers: null, minViewers: null, airtimeMinutes: null };\n  if (externalResult.status === 'rejected') errors.push({ platform: 'soop', source: 'external', message: externalResult.reason?.message || String(externalResult.reason) });\n\n  const mergedMetrics = mergeSoopMetricSources(liveBase, profile, externalSoop);\n  const live = {\n    ...liveBase,\n    viewerCount: mergedMetrics.viewerCount,\n    categoryId: liveBase.categoryId || profile.categoryId || '',\n    categoryName: liveBase.categoryName || profile.categoryName || '',\n    followerCount: mergedMetrics.followerCount,\n    fanclubCount: mergedMetrics.fanclubCount,\n    profileSource: profile.source || '',\n    metricSources: mergedMetrics.fieldSources\n  };"
          assert old in s
          s=s.replace(old,new,1)

          old="  const sessionStore = readSessions();\n  const sessions = Array.isArray(sessionStore?.sessions) ? sessionStore.sessions : [];\n  const soopAnalytics = buildSoopAnalytics(sessions, snapshots?.snapshots || [], live, now);\n  const successfulSoop = [vodResult, clipsResult, liveResult, profileResult].some(result => result.status === 'fulfilled');"
          new="  const sessionStore = readSessions();\n  const measuredSessions = Array.isArray(sessionStore?.sessions) ? sessionStore.sessions : [];\n  const sessions = mergeExternalSessions(measuredSessions, soopExternalHistory.sessions || [], soopExternalHistory.cutoffKst || '');\n  const soopAnalytics = buildSoopAnalytics(sessions, snapshots?.snapshots || [], live, now);\n  const externalSummary = soopExternalHistory.sourceSummary || {};\n  soopAnalytics.overview.knownTotalMinutes = soopAnalytics.overview.measuredTotalMinutes;\n  soopAnalytics.overview.externalAverageViewers = mergedMetrics.averageViewers ?? externalSummary.recent30DayAverageViewers ?? null;\n  soopAnalytics.overview.externalMaxViewers = mergedMetrics.maxViewers ?? externalSummary.recent30DayPeakViewers ?? null;\n  soopAnalytics.overview.externalMinViewers = mergedMetrics.minViewers ?? null;\n  soopAnalytics.overview.externalAirtimeMinutes = mergedMetrics.airtimeMinutes ?? externalSummary.recent30DayAirtimeMinutes ?? null;\n  soopAnalytics.overview.externalFieldSources = mergedMetrics.fieldSources;\n  const successfulSoop = [vodResult, clipsResult, liveResult, profileResult, externalResult].some(result => result.status === 'fulfilled');"
          assert old in s
          s=s.replace(old,new,1)

          old="        categoryReference: soopExternalHistory.categoryReference || null\n      },"
          new="        categoryReference: soopExternalHistory.categoryReference || null,\n        currentFallback: externalSoop\n      },"
          assert old in s
          s=s.replace(old,new,1)

          old="module.exports.extractSoopPublicMetricsFromHtml = extractSoopPublicMetricsFromHtml;"
          new="module.exports.extractSoopPublicMetricsFromHtml = extractSoopPublicMetricsFromHtml;\nmodule.exports.extractExternalSoopStatsFromHtml = extractExternalSoopStatsFromHtml;\nmodule.exports.mergeExternalSessions = mergeExternalSessions;\nmodule.exports.mergeSoopMetricSources = mergeSoopMetricSources;\nmodule.exports.fetchExternalSoopStats = fetchExternalSoopStats;"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Patch telemetry fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/collect-soop-telemetry.mjs')
          s=p.read_text()
          s=s.replace("const { fetchSoopLive, fetchSoopChannelProfile } = require('../lib/chunbong-data.js');", "const { fetchSoopLive, fetchSoopChannelProfile, fetchExternalSoopStats, mergeSoopMetricSources } = require('../lib/chunbong-data.js');")
          old="  const [liveResult, profileResult] = await Promise.allSettled([fetchSoopLive(), fetchSoopChannelProfile()]);"
          new="  const [liveResult, profileResult, externalResult] = await Promise.allSettled([fetchSoopLive(), fetchSoopChannelProfile(), fetchExternalSoopStats()]);"
          assert old in s
          s=s.replace(old,new,1)
          old="  const profile = profileResult.status === 'fulfilled'\n    ? profileResult.value\n    : { followerCount: null, fanclubCount: null, categoryId: '', categoryName: '' };\n  return normalizeSample({\n    ...live,\n    capturedAt,\n    categoryId: live.categoryId || profile.categoryId || '',\n    categoryName: live.categoryName || profile.categoryName || '',\n    followerCount: numberOrNull(live.followerCount) ?? numberOrNull(profile.followerCount),\n    fanclubCount: numberOrNull(live.fanclubCount) ?? numberOrNull(profile.fanclubCount)\n  });"
          new="  const profile = profileResult.status === 'fulfilled'\n    ? profileResult.value\n    : { followerCount: null, fanclubCount: null, categoryId: '', categoryName: '' };\n  const external = externalResult.status === 'fulfilled' ? externalResult.value : {};\n  const merged = mergeSoopMetricSources(live, profile, external);\n  return normalizeSample({\n    ...live,\n    capturedAt,\n    viewerCount: merged.viewerCount,\n    categoryId: live.categoryId || profile.categoryId || '',\n    categoryName: live.categoryName || profile.categoryName || '',\n    followerCount: merged.followerCount,\n    fanclubCount: merged.fanclubCount\n  });"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/chunbong-data.js scripts/collect-soop-telemetry.mjs
          git commit -m "feat: integrate external SOOP fallback sources"
          git push origin HEAD:feat/chunbong-soop-analytics
