name: Schedule diagnostic

on:
  push:
    branches: [fix/schedule-live-refresh]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Schedule live refresh regression
        run: node tests/schedule-live-refresh-regression.mjs
      - name: Probe current Notion reducer collection query
        run: |
          node <<'NODE'
          const PAGE_ID='2c059c07-cee4-8093-8952-ffaf573b8c99';
          const SOURCE='https://fire-space-8c8.notion.site/2c059c07cee480938952ffaf573b8c99?pvs=74';
          const headers={'content-type':'application/json','accept':'application/json,text/plain,*/*','referer':SOURCE,'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'};
          const unwrap = entry => { let x=entry; while(x&&typeof x==='object'&&x.value&&typeof x.value==='object'&&!x.id&&!x.type&&!x.schema&&!x.page_sort) x=x.value; return x; };
          (async()=>{
            const pageRes=await fetch('https://www.notion.so/api/v3/loadPageChunk',{method:'POST',headers,body:JSON.stringify({pageId:PAGE_ID,limit:100,cursor:{stack:[]},chunkNumber:0,verticalColumns:false})});
            const page=await pageRes.json();
            const collectionEntry=Object.values(page.recordMap?.collection||{})[0];
            const viewEntry=Object.values(page.recordMap?.collection_view||{})[0];
            const collection=unwrap(collectionEntry)||{};
            const view=unwrap(viewEntry)||{};
            const query=view.query2||view.query||{};
            const loader={
              type:'reducer',
              reducers:{
                collection_group_results:{type:'results',limit:100,loadContentCover:true},
                'table:uncategorized:title:count':{type:'aggregation',aggregation:{property:'title',aggregator:'count'}}
              },
              ...query,
              searchQuery:'',
              userTimeZone:'Asia/Seoul'
            };
            const body={collection:{id:collection.id},collectionView:{id:view.id},loader};
            console.log('QUERY_REQUEST='+JSON.stringify(body));
            const response=await fetch('https://www.notion.so/api/v3/queryCollection',{method:'POST',headers,body:JSON.stringify(body)});
            console.log('QUERY_HTTP='+response.status);
            const text=await response.text();
            console.log('QUERY_BODY='+text.slice(0,30000));
            if(!response.ok) process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
