name: Schedule diagnostic

on:
  push:
    branches: [fix/schedule-live-refresh]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Schedule live refresh regression
        run: node tests/schedule-live-refresh-regression.mjs
      - name: Probe Notion page-sort record values
        run: |
          node <<'NODE'
          const PAGE_ID='2c059c07-cee4-8093-8952-ffaf573b8c99';
          const SOURCE='https://fire-space-8c8.notion.site/2c059c07cee480938952ffaf573b8c99?pvs=74';
          const headers={'content-type':'application/json','accept':'application/json,text/plain,*/*','referer':SOURCE,'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'};
          const unwrap = entry => { let x=entry; while(x&&typeof x==='object'&&x.value&&typeof x.value==='object'&&!x.id&&!x.type&&!x.schema&&!x.page_sort) x=x.value; return x; };
          (async()=>{
            const pageRes=await fetch('https://www.notion.so/api/v3/loadPageChunk',{method:'POST',headers,body:JSON.stringify({pageId:PAGE_ID,limit:100,cursor:{stack:[]},chunkNumber:0,verticalColumns:false})});
            const page=await pageRes.json();
            const viewEntry=Object.values(page.recordMap?.collection_view||{})[0];
            const view=unwrap(viewEntry)||{};
            const ids=(view.page_sort||[]).slice(-30);
            console.log('PAGE_SORT_COUNT='+(view.page_sort||[]).length);
            console.log('PROBE_IDS='+ids.join(','));
            const recordRes=await fetch('https://www.notion.so/api/v3/getRecordValues',{method:'POST',headers,body:JSON.stringify({requests:ids.map(id=>({id,table:'block'}))})});
            console.log('RECORD_HTTP='+recordRes.status);
            const text=await recordRes.text();
            console.log('RECORD_BODY='+text.slice(0,20000));
            if(!recordRes.ok) process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
