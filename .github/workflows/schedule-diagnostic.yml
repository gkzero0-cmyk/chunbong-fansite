name: Schedule diagnostic

on:
  push:
    branches: [fix/schedule-live-refresh]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Notion record wrappers
        run: |
          set -euo pipefail
          NOTION_PAGE_ID='2c059c07-cee4-8093-8952-ffaf573b8c99'
          NOTION_SOURCE='https://fire-space-8c8.notion.site/2c059c07cee480938952ffaf573b8c99?pvs=74'
          curl -sS 'https://www.notion.so/api/v3/loadPageChunk' \
            -H 'content-type: application/json' \
            -H 'accept: application/json,text/plain,*/*' \
            -H "referer: $NOTION_SOURCE" \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            --data-binary "{\"pageId\":\"$NOTION_PAGE_ID\",\"limit\":100,\"cursor\":{\"stack\":[]},\"chunkNumber\":0,\"verticalColumns\":false}" \
            -o /tmp/notion.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/notion.json','utf8'));
          const rm = data.recordMap || {};
          const firstEntries = Object.entries(rm.block || {}).slice(0,4);
          for (const [id,entry] of firstEntries) {
            console.log('BLOCK_ID=' + id);
            console.log('BLOCK_ENTRY_KEYS=' + Object.keys(entry || {}).join(','));
            console.log('BLOCK_RAW=' + JSON.stringify(entry));
          }
          for (const [id,entry] of Object.entries(rm.collection || {}).slice(0,1)) {
            console.log('COLLECTION_ID=' + id);
            console.log('COLLECTION_ENTRY_KEYS=' + Object.keys(entry || {}).join(','));
            console.log('COLLECTION_RAW=' + JSON.stringify(entry));
          }
          for (const [id,entry] of Object.entries(rm.collection_view || {}).slice(0,1)) {
            console.log('VIEW_ID=' + id);
            console.log('VIEW_ENTRY_KEYS=' + Object.keys(entry || {}).join(','));
            console.log('VIEW_RAW=' + JSON.stringify(entry));
          }
          NODE
