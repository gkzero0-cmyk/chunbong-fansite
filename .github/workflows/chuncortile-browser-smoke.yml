name: Chuncortile browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'chuncortile.html'
      - 'chuncortile.css'
      - 'game-layout.css'
      - 'chuncortile.js'
      - 'chuncortile-core.js'
      - 'chuncortile-ranking-core.js'
      - 'chuncortile-postgame-ranking.js'
      - 'lib/chuncortile-ranking-api.js'
      - 'api/content.js'
      - 'assets/chuncortile/tiles-user.webp'
      - 'mobile-minigames.css'
      - 'mobile-minigames.js'
      - '.github/workflows/chuncortile-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'chuncortile.html'
      - 'chuncortile.css'
      - 'game-layout.css'
      - 'chuncortile.js'
      - 'chuncortile-core.js'
      - 'chuncortile-ranking-core.js'
      - 'chuncortile-postgame-ranking.js'
      - 'lib/chuncortile-ranking-api.js'
      - 'api/content.js'
      - 'assets/chuncortile/tiles-user.webp'
      - 'mobile-minigames.css'
      - 'mobile-minigames.js'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/chuncortile-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/chuncortile.html >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Verify gameplay, combo, pause, ranking and responsive layout
        env: { BASE_URL: 'http://127.0.0.1:4173' }
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1280,height:800},{width:390,height:844}]){
              const page=await browser.newPage({viewport});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              const rankingEntries=[{rank:1,nickname:'테스트랭커',score:150,maxCombo:8,misses:1}];
              await page.route('**/api/content?type=chuncortile-ranking**',async route=>{
                const req=route.request();
                if(req.method()==='POST'){
                  const body=JSON.parse(req.postData()||'{}');
                  await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({mode:'classic',updated:true,personalBest:{nickname:body.nickname,score:body.score,maxCombo:body.maxCombo,misses:body.misses},entries:[{rank:1,nickname:body.nickname,score:body.score,maxCombo:body.maxCombo,misses:body.misses}]})});
                  return;
                }
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({mode:'classic',entries:rankingEntries})});
              });

              await page.goto(process.env.BASE_URL+'/chuncortile.html?_smoke='+Date.now(),{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>Boolean(window.ChuncortileApp?.debugFindMove&&window.ChuncortilePostgameRanking));
              assert.equal(await page.locator('.ct-cell').count(),450);
              assert.equal(await page.locator('.ct-cell.is-tile').count(),200);
              assert.equal(await page.locator('.ct-face').count()>=200,true);
              const markerCount=await page.locator('.ct-tile[data-mark]').count();
              assert.equal(markerCount,0,'symbol marker badges must stay removed');

              if(viewport.width<=390){
                await page.locator('#ct-start').click();
                assert.ok(await page.locator('[data-mobile-landscape-gate]').isVisible(),'portrait start must show the landscape rotation guide');
                assert.equal(await page.locator('#chuncortile').getAttribute('data-game-status'),'start','portrait start must wait for landscape');
                await page.setViewportSize({width:844,height:390});
                await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='playing',{timeout:5000});
                assert.equal(await page.locator('body').evaluate(el=>el.classList.contains('mobile-landscape-game-ready')),true,'Chuncortile landscape class missing');
                const boardBox=await page.locator('#ct-board-wrap').boundingBox();
                assert.ok(boardBox&&boardBox.width>=460&&boardBox.height>=260,'landscape Chuncortile board is too small');
              }else{
                await page.locator('#ct-start').click();
                await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='playing',{timeout:5000});
              }

              let move=await page.evaluate(()=>window.ChuncortileApp.debugFindMove());
              assert.ok(move&&move.matches.length>=2);
              await page.locator('.ct-cell').nth(move.index).hover();
              assert.equal(await page.locator('.ct-cell.is-preview-match').count(),0,'normal hover must not reveal removal targets');
              assert.equal(await page.locator('.ct-cell.is-preview-valid').count(),0,'normal hover must not reveal valid cells');
              await page.locator('#ct-hint').click();
              assert.ok(await page.locator('.ct-cell.is-hint').count()>=1,'hint button must mark one playable empty cell');
              assert.ok(await page.locator('.ct-cell.is-preview-match').count()>=2,'hint button must preview the matched tiles');
              let before=await page.evaluate(()=>window.ChuncortileApp.getSnapshot().score);
              const firstRemoved=move.matches.length;
              await page.locator('.ct-cell').nth(move.index).click();
              await page.waitForFunction(before=>window.ChuncortileApp.getSnapshot().score>before,before);
              let state=await page.evaluate(()=>window.ChuncortileApp.getSnapshot());
              assert.equal(state.combo,1);
              const firstPop=page.locator('.ct-score-pop').last();
              assert.ok(await firstPop.count()>0,'clear score effect missing');
              assert.match(await firstPop.innerText(),new RegExp(firstRemoved+'개 제거'),'clear popup must show removed tile count');
              const burstCount=await page.locator('.ct-burst').count();
              assert.ok(burstCount>0&&burstCount<=firstRemoved*4,'clear particles exceeded performance cap');
              await page.waitForTimeout(950);
              assert.ok(await firstPop.isVisible(),'clear count must remain readable for about one second');
              move=await page.evaluate(()=>window.ChuncortileApp.debugFindMove());
              assert.ok(move&&move.matches.length>=2);
              before=state.score;
              await page.locator('.ct-cell').nth(move.index).click();
              await page.waitForFunction(before=>window.ChuncortileApp.getSnapshot().score>before,before);
              state=await page.evaluate(()=>window.ChuncortileApp.getSnapshot());
              assert.ok(state.combo>=2,'quick consecutive clears must create combo');
              assert.match(await page.locator('#ct-combo-pop').innerText(),/COMBO/);

              if(viewport.width<=390){
                await page.setViewportSize({width:390,height:844});
                await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='paused',{timeout:3000});
                assert.ok(await page.locator('[data-mobile-landscape-gate]').isVisible(),'portrait transition must show the rotation guide');
                const orientationPaused=await page.evaluate(()=>window.ChuncortileApp.getSnapshot().remainingMs);
                await page.waitForTimeout(500);
                const orientationStill=await page.evaluate(()=>window.ChuncortileApp.getSnapshot().remainingMs);
                assert.ok(Math.abs(orientationStill-orientationPaused)<120,'orientation pause must freeze the timer');
                await page.setViewportSize({width:844,height:390});
                await page.waitForFunction(()=>!document.querySelector('[data-mobile-landscape-resume]')?.hidden,{timeout:3000});
                await page.locator('[data-mobile-landscape-resume]').click();
                await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='playing',{timeout:3000});
              }

              const beforePause=state.remainingMs;
              await page.locator('#ct-pause').click();
              await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='paused');
              assert.ok(await page.locator('#ct-pause-overlay').isVisible());
              assert.ok(await page.locator('#ct-pause-overlay .ct-return-minigames').isVisible());
              await page.waitForTimeout(250);
              const pausedTime=await page.evaluate(()=>window.ChuncortileApp.getSnapshot().remainingMs);
              assert.ok(Math.abs(pausedTime-beforePause)<600,'pause must freeze timer');
              await page.locator('#ct-resume').click();
              await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='playing');

              await page.evaluate(()=>window.ChuncortileApp.debugFinishGame());
              await page.waitForFunction(()=>document.querySelector('#chuncortile')?.dataset.gameStatus==='gameover');
              if(viewport.width<=390){
                await page.waitForFunction(()=>!document.body.classList.contains('mobile-landscape-game-session'));
                assert.equal(await page.locator('[data-mobile-landscape-gate]').isVisible(),false,'game over must restore the normal page');
                assert.ok(await page.locator('.site-header').isVisible(),'normal fan-site header must return after game over');
              }
              assert.ok(await page.locator('#ct-over-overlay .ct-return-minigames').isVisible());
              assert.ok(await page.locator('#ct-ranking-register').isVisible());
              await page.locator('#ct-ranking-register').click();
              await page.locator('#ct-ranking-nickname').fill('테스트유저');
              await page.locator('#ct-ranking-submit').click();
              await page.waitForFunction(()=>document.querySelector('#ct-ranking-submit-status')?.dataset.state==='success');
              assert.match(await page.locator('#ct-ranking-register').innerText(),/등록 완료/);

              await page.locator('#ct-over-ranking').click();
              await page.waitForFunction(()=>!document.querySelector('#ct-ranking-modal')?.hidden);
              assert.ok(await page.locator('#ct-ranking-list li').count()>=1);
              await page.locator('#ct-ranking-close').click();

              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),true,'horizontal overflow');
              assert.deepEqual(errors,[]);
              await page.close();
            }
          }finally{await browser.close();}
          EOF_NODE
