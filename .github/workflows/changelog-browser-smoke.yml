name: Changelog browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'changelog.html'
      - 'changelog.css'
      - 'changelog.js'
      - 'changelog-data.js'
      - 'changelog-auto-summary.js'
      - 'content.js'
      - 'site-shell.js'
      - 'theme.css'
      - 'lib/changelog-history-api.js'
      - 'api/content.js'
      - '.github/workflows/changelog-browser-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'changelog.html'
      - 'changelog.css'
      - 'changelog.js'
      - 'changelog-data.js'
      - 'changelog-auto-summary.js'
      - 'content.js'
      - 'site-shell.js'
      - 'theme.css'
      - 'lib/changelog-history-api.js'
      - 'api/content.js'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/changelog-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/changelog.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/changelog-http.log
          exit 1
      - name: Verify index ordering and unread gear
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1280,height:800}});
          const page=await context.newPage();
          const latestSha='1234567890abcdef';
          const archive={
            siteStartedAt:'2026-08-30',
            latest:{sha:latestSha,shortSha:'1234567',date:'2026-09-20',time:'2026-09-20T01:00:00Z',title:'add tarot card journal',rawTitle:'feat: add tarot card journal',type:'new'},
            groups:[
              {date:'2026-09-20',items:[
                {sha:latestSha,shortSha:'1234567',date:'2026-09-20',time:'2026-09-20T01:00:00Z',title:'add tarot card journal',rawTitle:'feat: add tarot card journal',type:'new',url:'#'},
                {sha:'fix-tarot',shortSha:'fix-tar',date:'2026-09-20',time:'2026-09-20T00:50:00Z',title:'repair tarot reveal',rawTitle:'fix: repair tarot reveal',type:'fixed',url:'#'},
                {sha:'pwa-new',shortSha:'pwa-new',date:'2026-09-20',time:'2026-09-20T00:40:00Z',title:'improve PWA offline cache',rawTitle:'perf: improve PWA offline cache',type:'improved',url:'#'},
                {sha:'test-only',shortSha:'test-on',date:'2026-09-20',time:'2026-09-20T00:30:00Z',title:'tarot regression only',rawTitle:'test: tarot regression only',type:'improved',url:'#'}
              ]},
              {date:'2026-09-19',items:[
                {sha:'d995917165b259f262fa3af6a47e56cefb0019a0',shortSha:'d995917',date:'2026-09-19',time:'2026-09-19T14:20:38Z',title:'타로 효과음 단일 컨트롤러 정리',rawTitle:'refactor: 타로 효과음 단일 컨트롤러 정리',type:'improved',url:'#'}
              ]}
            ]
          };

          await page.route('**/api/content?type=changelog-history**',async route=>{
            const url=new URL(route.request().url());
            const body=url.searchParams.get('summary')==='1'
              ? {siteStartedAt:'2026-08-30',latest:archive.latest}
              : archive;
            await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
          });

          await page.goto(process.env.BASE_URL+'/index.html?_changelog='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.changelog-button'));
          await page.waitForFunction(()=>document.querySelector('.changelog-unread-dot')?.hidden===false);
          assert.match(await page.locator('.changelog-button').getAttribute('aria-label'),/새 업데이트 있음/);

          await page.goto(process.env.BASE_URL+'/changelog.html?_changelog='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.changelog-day')?.dataset.changelogDate==='2026-09-20');
          assert.equal(await page.locator('.changelog-day').first().getAttribute('data-changelog-date'),'2026-09-20','automatic main update must become the newest changelog date');
          assert.equal(await page.locator('.changelog-day').last().getAttribute('data-changelog-date'),'2026-08-30');
          assert.ok(await page.locator('#changelog-index-list a[data-changelog-index-date="2026-09-20"]').isVisible(),'automatic date index missing');
          assert.ok(await page.locator('#changelog-index-list a[data-changelog-index-date="2026-09-19"]').isVisible(),'curated date index missing');
          assert.ok(await page.getByText('타로 기능 추가',{exact:true}).count(),'automatic Tarot summary missing from timeline');
          assert.ok(await page.getByText('PWA·앱 설치 경험 개선',{exact:true}).count(),'automatic PWA summary missing from timeline');
          assert.equal(await page.getByText('add tarot card journal',{exact:true}).count(),0,'raw developer title must not render');
          assert.equal(await page.getByText('repair tarot reveal',{exact:true}).count(),0,'raw fix title must not render');
          assert.ok(await page.getByText('미니게임 콘텐츠 확장',{exact:true}).count(),'curated Korean changelog item missing');
          assert.equal(((await page.locator('#changelog-sync-status').textContent())||'').trim(),'사용자에게 중요한 변경사항만 한글로 간단하게 정리했습니다.','technical automatic-sync status wording must stay hidden');
          assert.equal(await page.locator('.changelog-card.is-commit').count(),0,'developer commit cards must not render');
          assert.equal(await page.getByText(/GitHub/).count(),0,'GitHub source text must not render in changelog');
          await page.waitForFunction(key=>localStorage.getItem('chunbong-changelog-seen-v2')===key,latestSha);

          await page.goto(process.env.BASE_URL+'/index.html?_changelog_seen='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.changelog-button'));
          await page.waitForTimeout(150);
          assert.equal(await page.locator('.changelog-unread-dot').isHidden(),true,'red dot must clear after changelog was viewed');

          await page.setViewportSize({width:390,height:844});
          await page.goto(process.env.BASE_URL+'/changelog.html?_mobile='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.querySelector('.changelog-day')?.dataset.changelogDate==='2026-09-20');
          assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),true,'mobile changelog must not overflow horizontally');
          assert.ok(await page.locator('#changelog-index-list').isVisible(),'mobile date index missing');

          await browser.close();
          EOF_NODE

