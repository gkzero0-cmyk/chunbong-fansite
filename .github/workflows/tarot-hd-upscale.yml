name: Tarot HD upscale

on:
  push:
    branches: [fix/tarot-hd-2x]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install AVIF image tooling
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Generate 2x high-DPI tarot pairs
        run: python scripts/upscale-tarot-hd.py
      - name: Verify 2x tarot asset contract
        run: node tests/tarot-hd-assets-regression.mjs
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tarot/hd/pair-*.avif
          git diff --cached --quiet && { echo 'No generated asset changes'; exit 0; }
          git commit -m 'feat: regenerate tarot cards at 2x resolution'
          git push origin HEAD:fix/tarot-hd-2x
