name: Import Chuntris reactions

on:
  push:
    branches: [design/chuntris]
    paths:
      - '.github/workflows/chuntris-import-reactions.yml'

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chuntris
      - name: Download optimized reaction sprite
        run: |
          set -euo pipefail
          mkdir -p assets/chuntris
          RESPONSE=$(curl -fsS -X POST 'https://api.firestorage.ai/dev/file/shares/SbWS-HHhmn7X/files/01a09870de2775a6909af79112873cb8/download')
          DOWNLOAD_URL=$(printf '%s' "$RESPONSE" | jq -r '.downloadUrl')
          test -n "$DOWNLOAD_URL"
          test "$DOWNLOAD_URL" != 'null'
          curl -fsSL "$DOWNLOAD_URL" -o assets/chuntris/reactions.webp
          test "$(stat -c%s assets/chuntris/reactions.webp)" -gt 20000
          test "$(head -c4 assets/chuntris/reactions.webp)" = 'RIFF'
      - name: Commit sprite to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/chuntris/reactions.webp
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add optimized Chuntris reaction sprite'
          git push origin HEAD:design/chuntris
