name: Chuntris multiplayer preview smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'chuntris.html'
      - 'chuntris.js'
      - 'chuntris-multiplayer.js'
      - 'minigame-multiplayer.js'
      - 'minigame-multiplayer.css'
      - 'api/content.js'
      - 'lib/minigame-multiplayer-api.js'
      - '.github/workflows/chuntris-multiplayer-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  multiplayer-preview:
    if: ${{ github.head_ref != 'data/soop-telemetry' && !startsWith(github.head_ref, 'internal-') && !startsWith(github.head_ref, 'internal/') && !startsWith(github.head_ref, 'ci-') && !startsWith(github.head_ref, 'docs-') && !startsWith(github.head_ref, 'feat/') && !startsWith(github.head_ref, 'feature/') && !startsWith(github.head_ref, 'perf/') && !startsWith(github.head_ref, 'fix/') && !startsWith(github.head_ref, 'chore/') && !startsWith(github.head_ref, 'ci/') && !startsWith(github.head_ref, 'refactor/') && !startsWith(github.head_ref, 'test/') && !startsWith(github.head_ref, 'hotfix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve current Vercel Preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            comments=$(curl -fsS               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100")
            preview=$(printf '%s' "$comments" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const rows=JSON.parse(s).filter(x=>x.user?.login==="vercel[bot]");
                for(const row of rows.reverse()){
                  const m=String(row.body||"").match(/\[Preview\]\((https:\/\/[^)]+)\)/);
                  if(m){process.stdout.write(m[1]);return;}
                }
              });')
            if [ -n "$preview" ]; then
              stamp=$(date +%s)
              if curl -fsS "$preview/chuntris.html?_mp=$stamp" -o /tmp/chuntris.html &&                  curl -fsS "$preview/chuntris-multiplayer.js?_mp=$stamp" -o /tmp/chuntris-multiplayer.js &&                  grep -q 'data-chuntris-multiplayer' /tmp/chuntris.html &&                  grep -q 'data-mp-chuntris-mode="classic"' /tmp/chuntris-multiplayer.js && grep -q 'data-mp-chuntris-mode="sprint40"' /tmp/chuntris-multiplayer.js && grep -q 'data-mp-chuntris-mode="score180"' /tmp/chuntris-multiplayer.js && grep -q 'data-mp-chuntris-difficulty="extreme"' /tmp/chuntris-multiplayer.js && grep -Fq 'client.create(normalizeName(),selectedMode,selectedDifficulty)' /tmp/chuntris-multiplayer.js && grep -Fq "App.startMultiplayer?.(room.seed,room.mode,room.difficulty||'normal')" /tmp/chuntris-multiplayer.js; then
                echo "PREVIEW_BASE=$preview" >> "$GITHUB_ENV"
                echo "Multiplayer preview ready: $preview"
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Current multiplayer preview did not become ready.' >&2
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify two-player mode and difficulty matrix
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser=await chromium.launch({headless:true});
          const base=process.env.PREVIEW_BASE;
          const modes=['classic','sprint40','score180'];
          const difficulties=['normal','hard','extreme'];

          async function finishScoreAttack(page,score,lines){
            return page.evaluate(async ({score,lines})=>{
              const session=JSON.parse(localStorage.getItem('chuntris.multiplayer.session.v2')||'null');
              if(!session?.code||!session?.token)throw new Error('session missing');
              for(let attempt=0;attempt<8;attempt+=1){
                const response=await fetch('/api/content?type=minigame-multiplayer',{
                  method:'POST',
                  headers:{'content-type':'application/json'},
                  body:JSON.stringify({action:'progress',code:session.code,token:session.token,score,lines,timeMs:180000,status:'completed'})
                });
                const payload=await response.json();
                if(response.ok)return payload;
                if(payload.error!=='room_busy')throw new Error(payload.error||'finish failed');
                await new Promise(resolve=>setTimeout(resolve,180+attempt*90));
              }
              throw new Error('room_busy after retry');
            },{score,lines});
          }

          async function verify(mode,difficulty){
            const contextA=await browser.newContext({viewport:{width:1280,height:800}});
            const contextB=await browser.newContext({viewport:{width:1280,height:800}});
            const a=await contextA.newPage(),b=await contextB.newPage(),errors=[];
            a.on('pageerror',error=>errors.push('A '+mode+'/'+difficulty+': '+error.message));
            b.on('pageerror',error=>errors.push('B '+mode+'/'+difficulty+': '+error.message));
            try{
              await a.goto(base+'/chuntris.html?_mp='+mode+'_'+difficulty+'&_a='+Date.now(),{waitUntil:'domcontentloaded'});
              await a.waitForFunction(()=>Boolean(window.ChuntrisApp?.startMultiplayer&&window.MinigameMultiplayer));
              await a.locator('[data-chuntris-multiplayer]').click();
              await a.locator('[data-mp-nickname]').fill('멀티A'+mode+difficulty);
              await a.locator('[data-mp-chuntris-mode="'+mode+'"]').click();
              await a.locator('[data-mp-chuntris-difficulty="'+difficulty+'"]').click();
              await a.locator('[data-mp-create]').click();
              await a.waitForFunction(()=>/^[A-Z2-9]{6}$/.test(document.querySelector('[data-mp-room-code]')?.textContent?.trim()||''),{timeout:7000});
              const code=(await a.locator('[data-mp-room-code]').textContent()).trim();

              await b.goto(base+'/chuntris.html?room='+code+'&_b='+Date.now(),{waitUntil:'domcontentloaded'});
              await b.waitForFunction(()=>Boolean(window.ChuntrisApp?.startMultiplayer&&window.MinigameMultiplayer));
              await b.locator('[data-mp-nickname]').fill('멀티B'+mode+difficulty);
              await b.locator('[data-mp-join]').click();
              await Promise.all([
                a.waitForFunction(()=>document.querySelectorAll('.mp-player:not(.is-empty)').length===2,{timeout:7000}),
                b.waitForFunction(()=>document.querySelectorAll('.mp-player:not(.is-empty)').length===2,{timeout:7000})
              ]);
              const label=await a.locator('[data-mp-room-mode]').innerText();
              assert.match(label,new RegExp(mode==='classic'?'클래식':mode==='sprint40'?'40줄':'3분'));
              assert.match(label,new RegExp(difficulty==='normal'?'노말':difficulty==='hard'?'하드':'익스트림'));

              await a.locator('[data-mp-ready]').click();
              await b.locator('[data-mp-ready]').click();
              await Promise.all([
                a.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing',{timeout:10000}),
                b.waitForFunction(()=>document.querySelector('#chuntris-game')?.dataset.gameStatus==='playing',{timeout:10000})
              ]);
              assert.equal(await a.locator('#chuntris-game').getAttribute('data-mode'),mode);
              assert.equal(await b.locator('#chuntris-game').getAttribute('data-mode'),mode);
              assert.equal(await a.locator('#chuntris-game').getAttribute('data-difficulty'),difficulty);
              assert.equal(await b.locator('#chuntris-game').getAttribute('data-difficulty'),difficulty);

              const stateA=await a.evaluate(()=>window.ChuntrisApp.getGame().getSnapshot());
              const stateB=await b.evaluate(()=>window.ChuntrisApp.getGame().getSnapshot());
              assert.deepEqual(stateA.next,stateB.next,mode+'/'+difficulty+' same seed queue mismatch');
              if(difficulty==='extreme'){
                const seeds=await Promise.all([
                  a.evaluate(()=>window.ChuntrisApp.getGame().gimmickSeed),
                  b.evaluate(()=>window.ChuntrisApp.getGame().gimmickSeed)
                ]);
                assert.equal(seeds[0],seeds[1],'extreme gimmick seed mismatch');
              }

              if(mode==='sprint40'){
                await a.evaluate(()=>window.ChuntrisApp.getGame().applyClearEvent({lines:40},Date.now()));
              }else if(mode==='classic'){
                await a.evaluate(()=>{window.ChuntrisApp.getGame().state.status='gameover';window.ChuntrisApp.render();});
              }else{
                await finishScoreAttack(a,18000,52);
                await finishScoreAttack(b,17000,55);
              }

              await Promise.all([
                a.waitForFunction(()=>document.querySelector('.mp-result')&&!document.querySelector('.mp-result').hidden,{timeout:9000}),
                b.waitForFunction(()=>document.querySelector('.mp-result')&&!document.querySelector('.mp-result').hidden,{timeout:9000})
              ]);
              const resultA=await a.locator('.mp-result').innerText(),resultB=await b.locator('.mp-result').innerText();
              if(mode==='classic'){assert.match(resultA,/상대 승리/);assert.match(resultB,/승리/);}
              else {assert.match(resultA,/승리/);assert.match(resultB,/상대 승리/);}
              assert.deepEqual(errors,[]);
            }finally{await contextA.close();await contextB.close();}
          }

          try{
            for(const mode of modes)for(const difficulty of difficulties)await verify(mode,difficulty);
          }finally{await browser.close();}
          EOF_NODE
