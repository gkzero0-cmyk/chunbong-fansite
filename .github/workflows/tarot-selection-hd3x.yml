name: Tarot selection HD3x verification

on:
  push:
    branches: [fix/tarot-card-selection-hd3x]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AVIF tooling
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin
      - name: Generate 3x tarot assets from original pair sources
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          SOURCE_SHA=3247a55efbc9629b5707f975e779d3893d068ff5
          git fetch --depth=1 origin "$SOURCE_SHA"
          mkdir -p /tmp/tarot-source
          for index in $(seq -w 0 38); do
            git show "$SOURCE_SHA:assets/tarot/hd/pair-$index.avif" > "/tmp/tarot-source/pair-$index.avif"
          done
          TAROT_SOURCE_DIR=/tmp/tarot-source python scripts/upscale-tarot-hd.py
      - name: Syntax checks
        run: |
          node --check tarot.js
          node --check tarot-data.js
          python -m py_compile scripts/upscale-tarot-hd.py
      - name: Run targeted tarot tests
        run: |
          node tests/tarot-selection-modes-regression.mjs
          node tests/tarot-hd-assets-regression.mjs
      - name: Commit 3x tarot assets
        if: github.actor != 'github-actions[bot]'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tarot/hd/pair-*.avif scripts/upscale-tarot-hd.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: regenerate tarot cards at 3x resolution'
          git push origin HEAD:fix/tarot-card-selection-hd3x
