name: Tarot selection HD3x verification

on:
  push:
    branches: [fix/tarot-card-selection-hd3x]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        run: |
          node --check script.js
          node --check page.js
          node --check tarot-data.js
          node --check tarot.js
          for file in api/*.js; do node --check "$file"; done
          python -m py_compile scripts/upscale-tarot-hd.py
      - name: Run all regression tests
        run: |
          set -euo pipefail
          count=0
          for file in tests/*.mjs; do
            echo "=== $file ==="
            node "$file"
            count=$((count + 1))
          done
          echo "TOTAL_TEST_FILES=$count"
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify direct card selection in Chromium
        run: |
          set -euo pipefail
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/tarot-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1280, height: 1000 } });
            await page.goto('http://127.0.0.1:8000/tarot.html', { waitUntil: 'networkidle' });
            await page.locator('input[name="count"][value="3"]').check();
            await page.locator('input[name="selection-mode"][value="cards"]').check();
            const constraints = await page.locator('#tarot-number-inputs input').evaluateAll(inputs => inputs.map(input => ({ disabled: input.disabled, required: input.required })));
            assert.equal(constraints.length, 3);
            assert.ok(constraints.every(input => input.disabled && !input.required), JSON.stringify(constraints));
            await page.locator('#tarot-shuffle').click();
            await page.waitForFunction(() => document.querySelectorAll('#tarot-deck [data-card-index]').length === 78);
            assert.equal(await page.locator('#tarot-deck [data-card-index]').count(), 78);
            await page.locator('#tarot-deck [data-card-index]').nth(0).click();
            await page.locator('#tarot-deck [data-card-index]').nth(1).click();
            await page.locator('#tarot-deck [data-card-index]').nth(2).click();
            await page.waitForFunction(() => document.querySelector('#tarot-results')?.hidden === false);
            assert.equal(await page.locator('#tarot-reading-grid .tarot-card-result').count(), 3);
            assert.match(await page.locator('#tarot-selection-status').textContent(), /카드를 순서대로 펼치고|리딩이 준비/);
            console.log('CHROMIUM_DIRECT_SELECTION=PASS');
            console.log('CHROMIUM_DECK_COUNT=78');
            console.log('CHROMIUM_RESULT_COUNT=3');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Report 3x tarot asset size
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('assets/tarot/hd').glob('pair-*.avif'))
          total = sum(path.stat().st_size for path in files)
          print(f'HD_PAIR_COUNT={len(files)}')
          print(f'HD_TOTAL_BYTES={total}')
          print(f'HD_AVG_BYTES={total // len(files)}')
          PY
