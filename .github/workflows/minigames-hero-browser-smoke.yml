name: Minigames hero browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'minigames.html'
      - 'minigames.css'
      - 'assets/minigames-hero.svg'
      - 'tests/minigames-hero-regression.mjs'
      - '.github/workflows/minigames-hero-browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/minigames-hero.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/minigames.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/minigames-hero.log
          exit 1
      - name: Verify desktop right-side artwork and mobile stack
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const browser=await chromium.launch({headless:true});
          try{
            const desktop=await browser.newPage({viewport:{width:1440,height:900}});
            await desktop.goto(process.env.BASE_URL+'/minigames.html',{waitUntil:'networkidle'});
            const copy=await desktop.locator('.minigames-hero-copy').boundingBox();
            const art=await desktop.locator('.minigames-hero-art').boundingBox();
            const img=desktop.locator('.minigames-hero-art img');
            assert.ok(copy&&art,'desktop hero regions missing');
            assert.ok(copy.x+copy.width<art.x,'artwork must sit to the right of hero copy');
            assert.ok(art.width>=420,'desktop artwork is too small');
            assert.ok(Math.abs(art.width/art.height-(16/9))<0.03,'desktop artwork lost 16:9 ratio');
            assert.equal(await img.evaluate(el=>el.complete&&el.naturalWidth>0),true,'hero image failed to load');
            assert.ok(art.x>=0&&art.x+art.width<=1440&&art.y>=0&&art.y+art.height<=900,'desktop artwork clips viewport');
            await desktop.close();

            const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await mobile.goto(process.env.BASE_URL+'/minigames.html',{waitUntil:'networkidle'});
            const mobileCopy=await mobile.locator('.minigames-hero-copy').boundingBox();
            const mobileArt=await mobile.locator('.minigames-hero-art').boundingBox();
            assert.ok(mobileCopy&&mobileArt,'mobile hero regions missing');
            assert.ok(mobileArt.y>mobileCopy.y+mobileCopy.height-2,'mobile artwork must stack below hero copy');
            assert.ok(mobileArt.x>=0&&mobileArt.x+mobileArt.width<=390,'mobile artwork clips horizontally');
            assert.ok(await mobile.evaluate(()=>document.documentElement.scrollWidth<=document.documentElement.clientWidth+1),'minigames page has horizontal overflow');
            await mobile.close();
          } finally {
            await browser.close();
          }
          EOF_NODE
