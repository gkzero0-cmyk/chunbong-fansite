name: Patch SOOP metric recursion

on:
  push:
    branches: [feat/chunbong-soop-analytics]
    paths: [.github/workflows/chunbong-soop-metrics-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbong-soop-analytics
      - name: Patch recursive public metric lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('lib/chunbong-data.js')
          text = path.read_text()
          old = """function metricValue(root, keys) {
            const value = deepFirst(root, keys);
            return value === undefined ? null : value;
          }
          """
          new = """function metricValue(root, keys) {
            const wanted = new Set(keys);
            const seen = new Set();
            let found = null;
            const walk = node => {
              if (found !== null || !node || typeof node !== 'object' || seen.has(node)) return;
              seen.add(node);
              if (!Array.isArray(node)) {
                for (const [key, value] of Object.entries(node)) {
                  if (wanted.has(key) && value !== undefined && value !== null && value !== '') {
                    found = value;
                    return;
                  }
                }
              }
              for (const child of Array.isArray(node) ? node : Object.values(node)) {
                walk(child);
                if (found !== null) return;
              }
            };
            walk(root);
            return found;
          }
          """
          if old not in text:
              raise SystemExit('metricValue block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/chunbong-data.js
          git commit -m 'fix: recursively find SOOP public metrics'
          git push origin HEAD:feat/chunbong-soop-analytics
