name: Mobile site browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-site.css'
      - 'mobile-site.js'
      - 'site-shell.js'
      - 'index.html'
      - 'schedule.html'
      - 'notice.html'
      - 'vod.html'
      - 'clips.html'
      - 'fanart.html'
      - 'youtube.html'
      - 'tarot.html'
      - 'minigames.html'
      - 'history.html'
      - 'data.html'
      - 'changelog.html'
      - 'personal-hub.js'
      - 'personal-hub.css'
      - 'myhub.html'
      - '.github/workflows/mobile-site-browser-smoke.yml'

jobs:
  mobile-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobile-site-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mobile-site-http.log
          exit 1
      - name: Verify mobile layouts
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const pages=['index.html','schedule.html','notice.html','vod.html','clips.html','fanart.html','youtube.html','tarot.html','minigames.html','history.html','data.html','changelog.html','myhub.html'];
          const viewports=[{width:360,height:800},{width:390,height:844},{width:412,height:915}];
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of viewports){
              for(const path of pages){
                const page=await browser.newPage({viewport,isMobile:true,hasTouch:true});
                const errors=[];
                page.on('pageerror',error=>errors.push(error.message));
                await page.goto(process.env.BASE_URL+'/'+path+'?_mobile_smoke=1',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(180);

                const metrics=await page.evaluate(()=>({
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                  headerHeight:document.querySelector('.site-header')?.getBoundingClientRect().height||0,
                  css:[...document.styleSheets].some(sheet=>String(sheet.href||'').includes('mobile-site.css'))
                }));
                assert.ok(metrics.css,path+' mobile-site.css not loaded');
                assert.ok(metrics.scrollWidth<=metrics.clientWidth+1,`${path} horizontal overflow at ${viewport.width}: ${metrics.scrollWidth} > ${metrics.clientWidth}`);
                assert.ok(metrics.headerHeight<=60,`${path} header too tall on mobile: ${metrics.headerHeight}`);

                const tabbar=page.locator('[data-pwa-app-tabbar]');
                await tabbar.waitFor({state:'visible'});
                assert.equal(await tabbar.locator(':scope > *').count(),5,path+' mobile tabbar must expose five controls');
                const tabBox=await tabbar.boundingBox();
                assert.ok(tabBox&&tabBox.x>=0&&tabBox.x+tabBox.width<=viewport.width+1&&tabBox.y+tabBox.height<=viewport.height+1,path+' mobile tabbar clips viewport');

                const toggle=page.locator('.nav-toggle');
                if(await toggle.count())assert.equal(await toggle.isVisible(),false,path+' hamburger should yield to the mobile bottom navigation');

                if(path==='schedule.html'){
                  const shell=page.locator('.schedule-calendar-scroll');
                  if(await shell.count()) assert.equal(await shell.evaluate(el=>getComputedStyle(el).overflowX),'auto');
                }
                if(path==='data.html'){
                  const table=page.locator('.data-detail-table').first();
                  if(await table.count()) assert.ok(['auto','scroll'].includes(await table.evaluate(el=>getComputedStyle(el).overflowX)));
                }
                if(path==='fanart.html'){
                  const grid=page.locator('.fanart-grid');
                  assert.ok(await grid.count(),path+' gallery missing');
                }
                if(path==='minigames.html'){
                  const cards=page.locator('.minigame-card');
                  assert.equal(await cards.count(),4,'minigames mobile portal must keep all four games');
                }

                assert.deepEqual(errors,[],path+' page errors: '+errors.join(' | '));
                await page.close();
              }
            }

            const appPage=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const appErrors=[];
            appPage.on('pageerror',error=>appErrors.push(error.message));
            await appPage.goto(process.env.BASE_URL+'/?source=pwa',{waitUntil:'domcontentloaded'});
            await appPage.waitForSelector('[data-pwa-app-tabbar]');
            assert.equal(await appPage.locator('[data-pwa-app-tabbar] > *').count(),5,'PWA app tabbar missing five controls');
            assert.equal(await appPage.locator('[data-pwa-app-tab="home"]').getAttribute('aria-current'),'page','PWA home tab is not active');
            assert.equal(await appPage.locator('.nav-toggle').isVisible(),false,'PWA app mode should hide the hamburger menu');
            const tabBox=await appPage.locator('[data-pwa-app-tabbar]').boundingBox();
            assert.ok(tabBox&&tabBox.x>=0&&tabBox.x+tabBox.width<=390&&tabBox.y+tabBox.height<=844,'PWA app tabbar clips viewport');
            await appPage.locator('[data-pwa-app-more-toggle]').click();
            assert.ok(await appPage.locator('[data-pwa-app-more]').isVisible(),'PWA more sheet did not open');
            assert.ok(await appPage.locator('[data-pwa-app-more] [data-more-page="notice"]').isVisible(),'PWA more sheet missing notice');
            assert.ok(await appPage.locator('[data-pwa-app-more] [data-more-page="data"]').isVisible(),'PWA more sheet missing data');
            assert.ok(await appPage.locator('[data-pwa-app-more] [data-more-page="myhub"]').isVisible(),'PWA more sheet missing My Hub');
            assert.equal(await appPage.locator('[data-pwa-app-more] [data-more-page="timeline"]').count(),0,'retired timeline must not appear in PWA more sheet');
            await appPage.keyboard.press('Escape');
            assert.equal(await appPage.locator('[data-pwa-app-more]').isVisible(),false,'PWA more sheet did not close');
            assert.deepEqual(appErrors,[],'PWA app mode page errors: '+appErrors.join(' | '));
            await appPage.close();
          }finally{
            await browser.close();
          }
          EOF_NODE
