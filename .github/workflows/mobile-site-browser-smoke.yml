name: Mobile site browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-site.css'
      - 'mobile-site.js'
      - 'index.html'
      - 'schedule.html'
      - 'notice.html'
      - 'vod.html'
      - 'clips.html'
      - 'fanart.html'
      - 'youtube.html'
      - 'tarot.html'
      - 'minigames.html'
      - 'history.html'
      - 'data.html'
      - 'changelog.html'
      - '.github/workflows/mobile-site-browser-smoke.yml'

jobs:
  mobile-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobile-site-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mobile-site-http.log
          exit 1
      - name: Verify mobile layouts
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const pages=['index.html','schedule.html','notice.html','vod.html','clips.html','fanart.html','youtube.html','tarot.html','minigames.html','history.html','data.html','changelog.html'];
          const viewports=[{width:360,height:800},{width:390,height:844},{width:412,height:915}];
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of viewports){
              for(const path of pages){
                const page=await browser.newPage({viewport,isMobile:true,hasTouch:true});
                const errors=[];
                page.on('pageerror',error=>errors.push(error.message));
                await page.goto(process.env.BASE_URL+'/'+path+'?_mobile_smoke=1',{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(180);

                const metrics=await page.evaluate(()=>({
                  scrollWidth:document.documentElement.scrollWidth,
                  clientWidth:document.documentElement.clientWidth,
                  headerHeight:document.querySelector('.site-header')?.getBoundingClientRect().height||0,
                  css:[...document.styleSheets].some(sheet=>String(sheet.href||'').includes('mobile-site.css'))
                }));
                assert.ok(metrics.css,path+' mobile-site.css not loaded');
                assert.ok(metrics.scrollWidth<=metrics.clientWidth+1,`${path} horizontal overflow at ${viewport.width}: ${metrics.scrollWidth} > ${metrics.clientWidth}`);
                assert.ok(metrics.headerHeight<=60,`${path} header too tall on mobile: ${metrics.headerHeight}`);

                const toggle=page.locator('.nav-toggle');
                if(await toggle.count()){
                  await toggle.click();
                  const nav=page.locator('#main-nav');
                  assert.ok(await nav.isVisible(),path+' mobile nav did not open');
                  const box=await nav.boundingBox();
                  assert.ok(box&&box.x>=0&&box.x+box.width<=viewport.width+1,path+' mobile nav clips horizontally');
                  assert.ok(box&&box.y>=0&&box.y+box.height<=viewport.height+1,path+' mobile nav clips vertically');
                  await page.keyboard.press('Escape');
                  assert.equal(await nav.isVisible(),false,path+' mobile nav did not close with Escape');
                }

                if(path==='schedule.html'){
                  const shell=page.locator('.schedule-calendar-scroll');
                  if(await shell.count()) assert.equal(await shell.evaluate(el=>getComputedStyle(el).overflowX),'auto');
                }
                if(path==='data.html'){
                  const table=page.locator('.data-detail-table').first();
                  if(await table.count()) assert.ok(['auto','scroll'].includes(await table.evaluate(el=>getComputedStyle(el).overflowX)));
                }
                if(path==='fanart.html'){
                  const grid=page.locator('.fanart-grid');
                  assert.ok(await grid.count(),path+' gallery missing');
                }
                if(path==='minigames.html'){
                  const cards=page.locator('.minigame-card');
                  assert.equal(await cards.count(),4,'minigames mobile portal must keep all four games');
                }

                assert.deepEqual(errors,[],path+' page errors: '+errors.join(' | '));
                await page.close();
              }
            }
          }finally{
            await browser.close();
          }
          EOF_NODE
