name: Align PWA revision temp

on:
  push:
    branches:
      - improve/site-hardening-round2-20261001
    paths:
      - '.github/workflows/align-pwa-revision-temp.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/site-hardening-round2-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore current regressions and align PWA revision only
        run: |
          git fetch origin main
          git checkout origin/main -- tests/accessibility-final-regression.mjs tests/daily-fortune-regression.mjs tests/personal-hub-regression.mjs
          sed -i 's/runtime-v33/runtime-v34/g' tests/accessibility-final-regression.mjs tests/daily-fortune-regression.mjs tests/personal-hub-regression.mjs
          if grep -RIn 'runtime-v33' tests test; then
            echo 'stale runtime-v33 assertion remains' >&2
            exit 1
          fi
          node tests/accessibility-final-regression.mjs
          node tests/daily-fortune-regression.mjs
          node tests/personal-hub-regression.mjs
          node tests/pwa-regression.mjs
          node --test test/pwa-cache-contract.test.js
      - name: Commit aligned regressions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/accessibility-final-regression.mjs tests/daily-fortune-regression.mjs tests/personal-hub-regression.mjs
          git diff --cached --check
          git commit -m 'test: align remaining PWA revision assertions'
          git push origin HEAD:improve/site-hardening-round2-20261001
