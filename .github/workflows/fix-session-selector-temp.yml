name: Fix session selector temp

on:
  push:
    branches:
      - improve/site-hardening-round2-20261001
    paths:
      - '.github/workflows/fix-session-selector-temp.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/site-hardening-round2-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix actual session revoke selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('operator-redis-diagnostics.js')
          s=p.read_text()
          old="'[data-session-revoke]'"
          new="'[data-revoke-session]'"
          if old not in s:
              raise SystemExit('expected stale selector not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check operator-redis-diagnostics.js
          node --test test/operator-redis-degraded-mode.test.js
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add operator-redis-diagnostics.js
          git diff --cached --check
          git commit -m 'fix: lock actual session revoke control'
          git push origin HEAD:improve/site-hardening-round2-20261001
