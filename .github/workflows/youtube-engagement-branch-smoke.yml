name: YouTube engagement branch smoke

on:
  push:
    branches: [feat/youtube-engagement-rankings]
    paths:
      - '.github/workflows/youtube-engagement-branch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Trace YouTube metric payloads
        run: |
          node <<'NODE'
          const youtube = require('./api/youtube');
          async function main() {
            const HEADERS = {
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              accept: 'text/html,application/xhtml+xml',
              'accept-language': 'ko-KR,ko;q=0.9,en;q=0.8'
            };
            const videos = await youtube.fetchAllChannelItems('videos', { maxPages: 2 });
            const first = videos[0];
            if (!first?.id) throw new Error('No diagnostic video found');
            console.log('VIDEO=' + JSON.stringify(first));

            const watchRes = await fetch(`https://www.youtube.com/watch?v=${first.id}&hl=ko&gl=KR`, { headers: HEADERS });
            const watchHtml = await watchRes.text();
            for (const marker of ['ytInitialPlayerResponse', '"videoDetails"', '"viewCount"']) {
              const index = watchHtml.indexOf(marker);
              console.log(`WATCH_SNIPPET_${marker.replace(/\W/g, '_')}=` + (index >= 0 ? watchHtml.slice(Math.max(0, index - 220), index + 620).replace(/\s+/g, ' ') : 'NOT_FOUND'));
            }

            const tabRes = await fetch(`${youtube.CHANNEL}/videos?hl=ko&gl=KR`, { headers: HEADERS });
            const tabHtml = await tabRes.text();
            const config = youtube.extractInnertubeConfig(tabHtml);
            if (!config.apiKey || !config.clientVersion) throw new Error('Missing innertube config');
            const apiHeaders = {
              ...HEADERS,
              accept: 'application/json',
              'content-type': 'application/json',
              'x-youtube-client-name': String(config.clientName || 1),
              'x-youtube-client-version': config.clientVersion
            };
            const context = { client: { clientName: 'WEB', clientVersion: config.clientVersion, hl: 'ko', gl: 'KR', ...(config.visitorData ? { visitorData: config.visitorData } : {}) } };
            const callNext = body => fetch(`https://www.youtube.com/youtubei/v1/next?key=${encodeURIComponent(config.apiKey)}&prettyPrint=false`, {
              method: 'POST', headers: apiHeaders, body: JSON.stringify(body)
            }).then(async response => ({ response, payload: await response.json().catch(() => ({})) }));

            const firstNext = await callNext({ context, videoId: first.id });
            const continuationCandidates = [];
            const seen = new Set();
            const walk = (node, path = '') => {
              if (!node || typeof node !== 'object' || seen.has(node)) return;
              seen.add(node);
              const token = node?.continuationCommand?.token || node?.continuationEndpoint?.continuationCommand?.token || node?.continuationItemRenderer?.continuationEndpoint?.continuationCommand?.token;
              if (token) {
                const text = JSON.stringify(node);
                continuationCandidates.push({ token, path, commentish: /comment|댓글|engagement-panel-comments-section/i.test(text), sample: text.slice(0, 700) });
              }
              if (Array.isArray(node)) node.forEach((child, index) => walk(child, `${path}[${index}]`));
              else Object.entries(node).forEach(([key, child]) => walk(child, path ? `${path}.${key}` : key));
            };
            walk(firstNext.payload);
            console.log('CONTINUATIONS=' + JSON.stringify(continuationCandidates.slice(0, 30)));
            const commentCandidate = continuationCandidates.find(item => item.commentish) || continuationCandidates[0];
            if (!commentCandidate) throw new Error('No next continuation candidate');
            console.log('COMMENT_CONTINUATION_PATH=' + commentCandidate.path);

            const commentNext = await callNext({ context, continuation: commentCandidate.token });
            const matches = [];
            const strings = [];
            const seen2 = new Set();
            const walk2 = node => {
              if (!node || typeof node !== 'object' || seen2.has(node)) return;
              seen2.add(node);
              if (!Array.isArray(node)) {
                for (const [key, value] of Object.entries(node)) {
                  if (/commentCount|commentsCount|countText|titleText|headerText/i.test(key)) {
                    const serialized = typeof value === 'object' ? JSON.stringify(value) : String(value);
                    if (/comment|댓글|\d/.test(serialized)) matches.push({ key, value: serialized.slice(0, 500) });
                  }
                  if (typeof value === 'string' && /댓글|comment|개$/.test(value) && strings.length < 40) strings.push(value.slice(0, 300));
                }
              }
              for (const child of Array.isArray(node) ? node : Object.values(node)) walk2(child);
            };
            walk2(commentNext.payload);
            console.log('COMMENT_NEXT=' + JSON.stringify({ status: commentNext.response.status, matches: matches.slice(0, 40), strings: strings.slice(0, 40) }));
          }
          main().catch(error => { console.error(error); process.exit(1); });
          NODE
