name: YouTube engagement branch smoke

on:
  push:
    branches: [feat/youtube-engagement-rankings]
    paths:
      - '.github/workflows/youtube-engagement-branch-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect complete YouTube engagement cache
        run: node scripts/update-youtube-engagement-cache.mjs
      - name: Verify collected cache
        run: |
          node <<'NODE'
          const cache = require('./data/youtube-engagement-cache.json');
          const items = Array.isArray(cache.items) ? cache.items : [];
          const views = items.filter(item => Number.isFinite(item.viewCount)).length;
          const comments = items.filter(item => Number.isFinite(item.commentCount)).length;
          const published = items.filter(item => /^20\d{2}-\d{2}-\d{2}/.test(String(item.publishedAt || ''))).length;
          const positiveComments = items.filter(item => Number.isFinite(item.commentCount) && item.commentCount > 0).length;
          const summary = {
            itemCount: items.length,
            views,
            comments,
            positiveComments,
            published,
            capturedAt: cache.capturedAt,
            viewCoverage: items.length ? Math.round((views / items.length) * 1000) / 10 : 0,
            commentCoverage: items.length ? Math.round((comments / items.length) * 1000) / 10 : 0,
            publishedCoverage: items.length ? Math.round((published / items.length) * 1000) / 10 : 0
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!(items.length >= 150 && views > 0 && comments > 0 && positiveComments > 0 && published > 0)) process.exit(1);
          NODE
