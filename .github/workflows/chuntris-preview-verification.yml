name: Chuntris preview verification

on:
  push:
    branches: [design/chuntris]
    paths:
      - '.github/workflows/chuntris-preview-verification.yml'

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify last successful Chuntris preview
        env:
          CHUNTRIS_URL: https://chunbong-fansite-git-design-chuntris-gkzero0-9465.vercel.app/chuntris.html
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { chromium } = require('playwright');
          const url = process.env.CHUNTRIS_URL;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
              const errors = [];
              page.on('pageerror', e => errors.push(e.message));
              const response = await page.goto(url, { waitUntil: 'domcontentloaded' });
              assert.equal(response.status(), 200);
              await page.waitForFunction(() => Boolean(window.ChuntrisApp?.getGame?.()));
              assert.equal(await page.title(), '춘트리스 | 춘봉 팬사이트');
              await page.locator('[data-chuntris-mode="classic"]').click();
              await page.locator('#chuntris-start').click();
              await page.keyboard.press('ArrowLeft');
              await page.keyboard.press('KeyX');
              await page.keyboard.press('Space');
              await page.waitForTimeout(100);
              assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
              assert.match(await page.locator('#chuntris-reaction').evaluate(el => getComputedStyle(el).backgroundImage), /reactions\.webp/);
              await page.locator('#chuntris-pause').click();
              assert.equal(await page.locator('#chuntris-game').getAttribute('data-game-status'), 'paused');
              await page.locator('[data-chuntris-mode="sprint40"]').click();
              await page.locator('#chuntris-start').click();
              assert.equal(await page.locator('#chuntris-game').getAttribute('data-mode'), 'sprint40');
              assert.deepEqual(errors, []);

              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
              const mobileErrors = [];
              mobile.on('pageerror', e => mobileErrors.push(e.message));
              const mobileResponse = await mobile.goto(url, { waitUntil: 'domcontentloaded' });
              assert.equal(mobileResponse.status(), 200);
              await mobile.waitForFunction(() => Boolean(window.ChuntrisApp?.getGame?.()));
              await mobile.locator('#chuntris-start').click();
              assert.equal(await mobile.locator('#chuntris-mobile-controls').isVisible(), true);
              await mobile.locator('[data-chuntris-action="left"]').click();
              await mobile.locator('[data-chuntris-action="hard-drop"]').click();
              assert.equal(await mobile.locator('#chuntris-game').getAttribute('data-game-status'), 'playing');
              assert.deepEqual(mobileErrors, []);
              console.log('Chuntris preview Chromium verification passed');
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
