name: Chunbak navigation bootstrap

on:
  push:
    branches: [feat/chunbak-minigame-20260917]
    paths:
      - '.github/workflows/chunbak-nav-bootstrap.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chunbak-minigame-20260917
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Replace legacy direct Chuntris nav with minigames hub
        run: |
          node --input-type=module <<'EOF_NODE'
          import fs from 'node:fs';
          const pages = ['index','schedule','notice','vod','clips','fanart','tarot','youtube','data','history','chuntris','minigames'];
          const legacy = '<a data-nav="chuntris" href="chuntris.html">춘트리스</a>';
          const link = '<a data-nav="minigames" href="minigames.html">미니게임</a>';
          const tarot = '<a data-nav="tarot" href="tarot.html">TAROT</a>';
          for (const page of pages) {
            const path = `${page}.html`;
            let html = fs.readFileSync(path, 'utf8');
            html = html.split(legacy).join(link);
            if (!html.includes(link)) {
              if (!html.includes(tarot)) throw new Error(`${path}: nav insertion anchor missing`);
              html = html.replace(tarot, `${tarot}${link}`);
            }
            if (page === 'index' && !html.includes('<strong>미니게임</strong>')) {
              const marker = '</div><div class="official-strip reveal">';
              const portalStart = html.indexOf('<div class="portal-grid">');
              const markerIndex = html.indexOf(marker, portalStart);
              if (portalStart < 0 || markerIndex < 0) throw new Error('index.html: portal grid insertion point missing');
              const card = '<a class="portal-card reveal" href="minigames.html"><small>10 / MINIGAMES</small><strong>미니게임</strong><p>춘트리스와 춘박게임을 한곳에서 즐깁니다.</p><b>→</b></a>';
              html = html.slice(0, markerIndex) + card + html.slice(markerIndex);
            }
            fs.writeFileSync(path, html);
          }
          EOF_NODE
          node tests/minigames-navigation-regression.mjs
          node tests/multipage-smoke.mjs
      - name: Commit navigation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html schedule.html notice.html vod.html clips.html fanart.html tarot.html youtube.html data.html history.html chuntris.html minigames.html
          if git diff --cached --quiet; then
            echo 'Navigation already up to date.'
            exit 0
          fi
          git commit -m 'feat: route site navigation through minigames hub'
          git push origin HEAD:feat/chunbak-minigame-20260917
