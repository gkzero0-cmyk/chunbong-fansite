name: Chuntris immersive feature CI

on:
  push:
    branches: ['feat/chuntris-immersive-ui-20260917']

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check syntax
        run: |
          node --check chuntris.js
          node --check chuntris-audio.js
      - name: Run immersive Chuntris regressions
        run: |
          node tests/chuntris-immersive-ui-regression.mjs
          node tests/chuntris-ui-regression.mjs
          node tests/chuntris-flow-regression.mjs
          node tests/chuntris-modal-pause-regression.mjs
          node tests/chuntris-audio-effects-regression.mjs
          node tests/chuntris-effects-regression.mjs
