name: Chunbong data production probe

on:
  push:
    branches: [feat/chunbong-soop-analytics]
    paths: ['.github/workflows/chunbong-data-production-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact production SOOP dashboard release
        run: |
          set -e
          BASE='https://chunbong-fansite.vercel.app'
          curl -fsSL "$BASE/data.html" -o /tmp/data.html
          curl -fsSL "$BASE/data.js" -o /tmp/data.js
          grep -q 'data-platform-tab="soop"' /tmp/data.html
          grep -q 'data-platform-tab="youtube"' /tmp/data.html
          grep -q 'data-soop-view-tab="daily"' /tmp/data.html
          grep -q 'data-soop-view-tab="monthly"' /tmp/data.html
          grep -q 'data-soop-view-tab="calendar"' /tmp/data.html
          grep -q 'sourceChip' /tmp/data.js
          grep -q '외부 30일 참고' /tmp/data.js
          grep -q 'monthUniqueViewers' /tmp/data.js
          curl -fsSL "$BASE/api/content?type=data" -o /tmp/data.json
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const p = JSON.parse(fs.readFileSync('/tmp/data.json','utf8'));
          assert.equal(p.fallback, false);
          assert.ok(p.soop?.overview, 'missing SOOP overview');
          assert.ok(Array.isArray(p.soop?.daily), 'missing SOOP daily');
          assert.ok(Array.isArray(p.soop?.monthlyStats), 'missing SOOP monthlyStats');
          assert.ok(Array.isArray(p.soop?.categories), 'missing SOOP categories');
          assert.ok(p.soop?.externalHistory && Object.prototype.hasOwnProperty.call(p.soop.externalHistory, 'currentFallback'), 'missing current external fallback');
          assert.ok(Object.prototype.hasOwnProperty.call(p.soop.overview, 'subscriberCount'), 'missing expanded subscriber metric');
          assert.ok(Object.prototype.hasOwnProperty.call(p.soop.overview, 'monthUniqueViewers'), 'missing expanded monthly unique viewers');
          assert.ok(Object.prototype.hasOwnProperty.call(p.soop.overview, 'cumulativeUpCount'), 'missing expanded cumulative UP metric');
          assert.ok(p.youtube?.channel, 'missing YouTube channel');
          console.log(`PROD_DAILY=${p.soop.daily.length}`);
          console.log(`PROD_MONTHLY=${p.soop.monthlyStats.length}`);
          console.log(`PROD_CATEGORIES=${p.soop.categories.length}`);
          console.log(`PROD_SESSIONS=${p.soop.recentSessions?.length || 0}`);
          console.log(`PROD_EXTERNAL_SOURCE=${p.soop.externalHistory.currentFallback?.source || 'none'}`);
          console.log(`PROD_ERRORS=${p.errors?.length || 0}`);
          NODE
