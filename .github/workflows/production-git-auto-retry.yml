name: Production Git auto retry

on:
  schedule:
    # Check hourly. The job's 25-hour rate-limit guard still prevents premature redeploy attempts.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: read

concurrency:
  group: production-git-auto-retry
  cancel-in-progress: false

jobs:
  retry-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check production commit and Vercel cooldown
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git reset --hard origin/main

          EXPECTED="$(git rev-parse HEAD)"
          COMMIT_TS="$(git show -s --format=%ct HEAD)"
          NOW_TS="$(date +%s)"
          AGE_SECONDS="$((NOW_TS - COMMIT_TS))"
          BASE='https://chunbong-fansite.vercel.app'

          BODY="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'cache-control: no-cache' "${BASE}/api/version?_ts=$(date +%s)" || true)"
          ACTUAL="$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).sha||'')}catch{}})")"

          RATE_LIMIT_CREATED_AT="$(
            node --input-type=module <<'NODE'
          const headers = {
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            accept: 'application/vnd.github+json',
            'x-github-api-version': '2022-11-28'
          };
          const repository = process.env.GITHUB_REPOSITORY;
          const commitsResponse = await fetch(`https://api.github.com/repos/${repository}/commits?sha=main&per_page=100`, { headers });
          if (!commitsResponse.ok) throw new Error(`commit lookup failed: ${commitsResponse.status}`);
          const commits = await commitsResponse.json();

          const nowMs = Date.now();
          const scanWindowMs = (90000 + 7200) * 1000;

          for (const commit of commits) {
            const commitTime = Date.parse(commit?.commit?.committer?.date || commit?.commit?.author?.date || '');
            if (Number.isFinite(commitTime) && nowMs - commitTime > scanWindowMs) break;
            const statusResponse = await fetch(
              `https://api.github.com/repos/${repository}/commits/${commit.sha}/status`,
              { headers }
            );
            if (!statusResponse.ok) throw new Error(`status lookup failed: ${statusResponse.status}`);
            const combined = await statusResponse.json();
            const rateLimited = (combined.statuses || []).find(status =>
              status.context === 'Vercel' &&
              /rate limited/i.test(String(status.description || ''))
            );
            if (rateLimited?.created_at) {
              process.stdout.write(rateLimited.created_at);
              break;
            }
          }
          NODE
          )"

          RATE_LIMIT_AGE_SECONDS=999999999
          if [[ -n "$RATE_LIMIT_CREATED_AT" ]]; then
            RATE_LIMIT_TS="$(date -d "$RATE_LIMIT_CREATED_AT" +%s)"
            RATE_LIMIT_AGE_SECONDS="$((NOW_TS - RATE_LIMIT_TS))"
          fi

          echo "expected=$EXPECTED"
          echo "actual=${ACTUAL:-missing}"
          echo "main_age_seconds=$AGE_SECONDS"
          echo "last_rate_limit_at=${RATE_LIMIT_CREATED_AT:-none}"
          echo "rate_limit_age_seconds=$RATE_LIMIT_AGE_SECONDS"

          if [[ "$ACTUAL" == "$EXPECTED" ]]; then
            echo "needs_retry=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "needs_retry=true" >> "$GITHUB_OUTPUT"
          elif [[ "$AGE_SECONDS" -ge 72000 && "$RATE_LIMIT_AGE_SECONDS" -ge 90000 ]]; then
            echo "needs_retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_retry=false" >> "$GITHUB_OUTPUT"
            echo "Production is pending, but the main-age or Vercel 25-hour cooldown guard has not elapsed; skip this scheduled retry."
          fi

      - name: Trigger a fresh Vercel Git deployment
        if: steps.sync.outputs.needs_retry == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'chore: retry Vercel production deployment'
          git push origin HEAD:main
          echo 'Created one empty main commit to retrigger the Vercel Git integration.'

      - name: Already synced or cooling down
        if: steps.sync.outputs.needs_retry != 'true'
        run: echo 'Production already matches main or the safe retry window has not opened; no retry commit was created.'
