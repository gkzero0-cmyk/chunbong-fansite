name: Background push dispatch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: background-push-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request GitHub OIDC token and dispatch push checks
        env:
          AUDIENCE: chunbong-fansite-push
          PUSH_URL: https://chunbong-fansite.vercel.app/api/content?type=push-dispatch
          ARCHIVE_SYNC_URL: https://chunbong-fansite.vercel.app/api/content?type=content-archive-auto-sync
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "$ACTIONS_ID_TOKEN_REQUEST_URL" == *'?'* ]]; then separator='&'; fi
          response="$(
            curl -fsS               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${AUDIENCE}"
          )"
          token="$(
            printf '%s' "$response" | node -e "
              let input='';
              process.stdin.on('data',chunk=>input+=chunk);
              process.stdin.on('end',()=>{
                const value=JSON.parse(input).value||'';
                if(!value)process.exit(2);
                process.stdout.write(value);
              });
            "
          )"
          curl -fsS --retry 1 --retry-delay 2 --max-time 55             -H "Authorization: Bearer $token"             -H "User-Agent: chunbong-github-actions-push"             "$PUSH_URL"
          echo

          minute="$(date -u +%M)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$minute" == "00" || "$minute" == "30" ]]; then
            curl -fsS --retry 1 --retry-delay 2 --max-time 55               -X POST               -H "Authorization: Bearer $token"               -H "Origin: https://github.com"               -H "Content-Type: application/json"               -H "User-Agent: chunbong-github-actions-archive-sync"               -d '{}'               "$ARCHIVE_SYNC_URL"
            echo
          else
            echo "Archive auto-sync skipped on this push tick; 30-minute safety sync remains active."
          fi
