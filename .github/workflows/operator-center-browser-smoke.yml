name: Operator center browser smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'operator.html'
      - 'operator.js'
      - 'operator.css'
      - 'lib/operator-center-api.js'
      - 'api/content.js'
      - 'site-analytics.js'
      - 'feedback-widget.js'
      - 'feedback-widget.css'
      - '.github/workflows/operator-center-browser-smoke.yml'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/operator-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/operator.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/operator-http.log
          exit 1
      - name: Verify protected dashboard UI with mocked owner session
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'EOF_NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];page.on('pageerror',error=>errors.push(error.message));
            const feedback=[{id:'FB-20260921-ABC123',category:'feature',nickname:'째비테스트',message:'모바일 일정이 더 편해졌어요.',status:'new',operatorMemo:'',createdAt:'2026-09-21T08:00:00.000Z',updatedAt:'2026-09-21T08:00:00.000Z',page:'/schedule.html',device:'mobile',viewport:'390x844',pwa:true,theme:'dark',siteSha:'1234567890abcdef'}];

            await page.route('**/api/content?type=*',async route=>{
              const url=new URL(route.request().url()),type=url.searchParams.get('type');
              const json=value=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(value)});
              if(type==='operator-auth-config')return json({authenticated:true,provider:'github',providers:{github:false,email:false},storage:true,ownerRegistered:true});
              if(type==='operator-session')return json({authenticated:true,provider:'github',expiresAt:'2027-09-21T00:00:00.000Z',activeSessions:2,currentSessionId:'session-current-1234',sessions:[{id:'session-current-1234',current:true,provider:'github',createdAt:'2026-09-21T08:00:00.000Z',expiresAt:'2027-09-21T00:00:00.000Z'},{id:'session-other-5678',current:false,provider:'email',createdAt:'2026-09-20T08:00:00.000Z',expiresAt:'2027-09-20T00:00:00.000Z'}],owner:{githubLogin:'gkzero0-cmyk',githubId:322299248,emailRegistered:true}});
              if(type==='operator-analytics')return json({collectionStartedAt:'2026-09-21T08:00:00.000Z',activeNow:3,visitors:42,sessions:55,newVisitors:24,returningVisits:96,averageDailyVisitors:14,pageviews:120,averageActiveSeconds:185,topPages:[{key:'/schedule.html',value:50}],topMenus:[{key:'방송 일정',value:31}],topFeatures:[{key:'game_start:chungwagame',value:8}],devices:[{key:'device:mobile',value:80}],daily:[{date:'2026-09-21',visitors:42,sessions:55,pageviews:120}],hourly:[{key:'20',value:44}],funnel:{game:{start:10,finish:8},tarot:{start:6,finish:5},feedback:{start:4,finish:1}},comparison:{visitorsPct:12.5,sessionsPct:10,pageviewsPct:-5,averageActiveSecondsPct:3.2},feedbackCounts:{new:1}});
              if(type==='operator-feedback-update'){const body=JSON.parse(route.request().postData()||'{}');Object.assign(feedback[0],body.status?{status:body.status}:{},body.memo!==undefined?{operatorMemo:body.memo}:{});return json({ok:true,item:feedback[0]});}
              if(type==='operator-feedback')return json({items:feedback});
              if(type==='operator-system-status')return json({checkedAt:'2026-09-21T12:00:00.000Z',deployment:{environment:'production',sha:'1234567890abcdef',url:'chunbong-fansite.vercel.app',mainSha:'1234567890abcdef',synced:true},storage:{redisConfigured:true,redisOk:true,analyticsRecordedDays:20,feedbackTotal:5},services:{githubAuth:true,emailAuth:true,push:true,analytics:true,feedback:true},traffic:{visitors:12,sessions:15,pageviews:39,activeNow:2},repository:{sizeKb:12345,updatedAt:'2026-09-21T11:00:00.000Z'},vercelUsage:{available:false}});
              if(type==='operator-session-revoke')return json({ok:true,current:false});
              if(type==='operator-logout'||type==='operator-logout-all')return json({ok:true});
              return route.fulfill({status:404,contentType:'application/json',body:'{}'});
            });

            await page.goto(process.env.BASE_URL+'/operator.html',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>!document.querySelector('#operator-dashboard')?.hidden);
            assert.match(await page.locator('#operator-login').textContent(),/1년/,'1-year login persistence copy missing');
            assert.equal((await page.locator('#metric-active').textContent())?.trim(),'3');
            assert.equal((await page.locator('#metric-visitors').textContent())?.trim(),'42');
            assert.equal((await page.locator('#metric-pageviews').textContent())?.trim(),'120');
            assert.equal((await page.locator('#metric-sessions').textContent())?.trim(),'55');
            assert.equal((await page.locator('#metric-new').textContent())?.trim(),'24');
            assert.equal((await page.locator('#metric-returning').textContent())?.trim(),'96');
            assert.match((await page.locator('#metric-visitors-delta').textContent())||'',/12\.5%/);
            assert.equal(await page.locator('#operator-hourly .operator-hour').count(),24,'hourly chart must render all 24 hours');
            assert.match((await page.locator('#operator-funnel').textContent())||'',/미니게임/);
            assert.match((await page.locator('#metric-duration').textContent())||'',/3분 5초/);
            assert.equal(await page.locator('[data-days]').count(),4,'period buttons missing');
            await page.locator('[data-days="all"]').click();
            assert.ok(await page.locator('[data-days="all"]').evaluate(el=>el.classList.contains('active')),'all-time period did not activate');

            await page.locator('[data-operator-tab="feedback"]').click();
            await page.locator('[data-feedback-id="FB-20260921-ABC123"]').click();
            assert.equal((await page.locator('#feedback-id').textContent())?.trim(),'FB-20260921-ABC123');
            assert.equal((await page.locator('#feedback-message').textContent())?.trim(),'모바일 일정이 더 편해졌어요.');
            await page.locator('#feedback-status').selectOption('reviewing');
            await page.locator('#feedback-memo').fill('다음 업데이트에 반영');
            await page.locator('#feedback-memo-save').click();
            await page.waitForFunction(()=>document.querySelector('#feedback-memo')?.value==='다음 업데이트에 반영');
            await page.locator('#operator-feedback-search').fill('째비테스트');
            assert.equal(await page.locator('[data-feedback-id]').count(),1);
            await page.locator('#operator-feedback-status-filter').selectOption('done');
            assert.equal(await page.locator('[data-feedback-id]').count(),0);
            await page.locator('#operator-feedback-status-filter').selectOption('all');

            await page.locator('[data-operator-tab="system"]').click();
            await page.waitForFunction(()=>document.querySelector('#system-sync')?.textContent?.includes('동기화'));
            assert.match((await page.locator('#system-production').textContent())||'',/READY/);
            assert.match((await page.locator('#system-storage').textContent())||'',/정상/);
            assert.equal((await page.locator('#system-visitors').textContent())?.trim(),'12');

            await page.locator('[data-operator-tab="security"]').click();
            assert.equal((await page.locator('#security-github').textContent())?.trim(),'gkzero0-cmyk');
            assert.match((await page.locator('#security-sessions').textContent())||'',/2개/);
            assert.equal(await page.locator('#operator-session-list article').count(),2,'active session list missing');
            assert.equal(await page.locator('[data-revoke-session]').count(),1,'other session revoke control missing');
            assert.deepEqual(errors,[],errors.join(' | '));
          }finally{await browser.close();}
          EOF_NODE
