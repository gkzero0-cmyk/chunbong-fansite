name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Inspect share route ids and API base
        run: |
          python - <<'PY'
          import re,urllib.request
          base='https://firestorage.ai'; page=base+'/ja/f/cLTpO1ZreAps'
          def text(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          html=text(page)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          js='\n'.join(text(base+s) for s in scripts if s.startswith('/_next/static/chunks/'))
          for needle in ['https://api.firestorage.ai/prod/file/','async function v()','let w=','let g=','shareEndpoint','/shares/']:
            p=js.find(needle);print('\n===',needle,p,'===');print(js[max(0,p-2500):p+6000] if p>=0 else 'not found')
          for pat in [r'/shares/[^"\']+',r'publicId[^,;}]{0,300}',r'shareId[^,;}]{0,300}',r'fileId[^,;}]{0,300}']:
            vals=[]
            for m in re.finditer(pat,html,re.I): vals.append(m.group(0))
            print('HTML',pat,vals[:30])
          PY
