name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Inspect temporary share app
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://firestorage.ai'
          share=base+'/ja/f/cLTpO1ZreAps'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          html=get(share)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          targets=[s for s in scripts if 'app/(files)' in s or '4899-' in s or '8437-' in s or '5841-' in s]
          print('targets',targets)
          for src in targets:
              js=get(base+src if src.startswith('/') else src)
              print('SCRIPT',src,'bytes',len(js))
              vals=sorted(set(re.findall(r'["\']([^"\']*(?:api|download|share|file)[^"\']*)["\']',js,re.I)))
              for v in vals[:120]: print('value',v[:1500])
          PY
