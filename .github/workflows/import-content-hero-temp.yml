name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Trace temporary share download API
        run: |
          python - <<'PY'
          import re, urllib.request
          base='https://firestorage.ai'
          share=base+'/ja/f/cLTpO1ZreAps'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          html=get(share)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          src=next(s for s in scripts if '4899-' in s)
          js=get(base+src)
          for needle in ['async function v()','async function ez(e)','let f=','/download','shareEndpoint']:
              pos=js.find(needle)
              print('\nNEEDLE',needle,'POS',pos)
              if pos>=0: print(js[max(0,pos-1800):pos+3500])
          PY
