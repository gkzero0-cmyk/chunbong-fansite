name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Inspect exact share route parser
        run: |
          python - <<'PY'
          import re,urllib.request
          base='https://firestorage.ai'; page=base+'/ja/f/cLTpO1ZreAps'
          def text(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=30) as r:return r.read().decode('utf-8','replace')
          html=text(page)
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          src=next(s for s in scripts if '4899-' in s)
          js=text(base+src)
          p=js.find('function b(e,a){return"ready"')
          print('module bytes',len(js),'function b pos',p)
          print(js[max(0,p-12000):p+3000])
          PY
