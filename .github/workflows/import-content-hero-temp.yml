name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Download exact high-resolution hero
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          share='cLTpO1ZreAps'
          candidates=[
            f'https://api.firestorage.ai/prod/file/shares/{share}',
            f'https://api.firestorage.ai/prod/shares/{share}',
          ]
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def request(url,method='GET'):
            req=urllib.request.Request(url,headers=headers,method=method)
            with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read(); return r.status,r.headers,raw
          payload=None;base=None
          for url in candidates:
            try:
              status,h,raw=request(url)
              print('candidate',url,'status',status,'type',h.get('content-type'),'bytes',len(raw))
              text=raw.decode('utf-8','replace')
              print(text[:2000])
              data=json.loads(text)
              files=(data.get('files') or data.get('data',{}).get('files') or data.get('share',{}).get('files') or []) if isinstance(data,dict) else []
              if files:
                payload=data;base=url;break
            except Exception as e: print('candidate failed',url,repr(e))
          if payload is None: raise SystemExit('share metadata endpoint not found')
          files=(payload.get('files') or payload.get('data',{}).get('files') or payload.get('share',{}).get('files') or [])
          target=next((f for f in files if f.get('fileName')=='hero-q88.webp'),files[0])
          file_id=target.get('fileId') or target.get('id')
          if not file_id: raise SystemExit('file id missing')
          download_url=base.rstrip('/')+f'/files/{file_id}/download'
          print('download endpoint',download_url)
          status,h,raw=request(download_url)
          ctype=(h.get('content-type') or '').lower()
          print('download response',status,ctype,len(raw),raw[:200])
          if 'json' in ctype or raw[:1] in (b'{',b'['):
            data=json.loads(raw.decode('utf-8'))
            signed=data.get('downloadUrl') or data.get('url') or data.get('signedUrl') or data.get('data',{}).get('downloadUrl') or data.get('data',{}).get('url')
            if not signed: raise SystemExit('signed download URL missing')
            status,h,raw=request(signed)
            print('signed download',status,h.get('content-type'),len(raw))
          if len(raw)<150000 or raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP':
            raise SystemExit(f'invalid webp payload size={len(raw)} head={raw[:16]!r}')
          path='assets/chunbong-content-hero-20261002.webp'
          with open(path,'wb') as f:f.write(raw)
          print('saved',path,len(raw))
          PY
      - name: Commit exact hero asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/chunbong-content-hero-20261002.webp
          if git diff --cached --quiet; then echo 'asset unchanged'; exit 0; fi
          git commit -m 'asset: import exact high-resolution Chunbong content hero'
          git push origin HEAD:fix/finalize-content-hero-header-shell-20261002
