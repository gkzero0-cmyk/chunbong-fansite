name: Import content hero temporary

on:
  push:
    branches:
      - fix/finalize-content-hero-header-shell-20261002

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finalize-content-hero-header-shell-20261002
      - name: Download exact high-resolution hero
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://api.firestorage.ai/dev/file'
          share='cLTpO1ZreAps'
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}
          def req(url,method='GET',body=None):
            data=None if body is None else json.dumps(body).encode()
            h=dict(headers)
            if data:h['Content-Type']='application/json'
            request=urllib.request.Request(url,data=data,headers=h,method=method)
            with urllib.request.urlopen(request,timeout=30) as r:return r.status,r.headers,r.read()
          status,h,raw=req(f'{base}/shares/{share}/files?maxResults=1000')
          payload=json.loads(raw.decode())
          files=payload.get('files') or []
          print('metadata',status,'files',len(files),'payload keys',list(payload))
          for row in files: print('file',row)
          target=next((row for row in files if row.get('fileName')=='hero-q88.webp'),None)
          if not target: raise SystemExit('hero-q88.webp missing from share')
          file_id=target.get('fileId') or target.get('id')
          if not file_id: raise SystemExit('fileId missing')
          endpoint=f'{base}/shares/{share}/files/{file_id}/download'
          try:
            status,h,raw=req(endpoint,'POST',{})
          except Exception:
            status,h,raw=req(endpoint,'GET')
          ctype=(h.get('content-type') or '').lower()
          print('download endpoint',status,ctype,'bytes',len(raw))
          if 'json' in ctype or raw[:1] in (b'{',b'['):
            data=json.loads(raw.decode())
            print('download keys',list(data) if isinstance(data,dict) else type(data))
            signed=(data.get('downloadUrl') or data.get('url') or data.get('signedUrl') or
                    (data.get('data') or {}).get('downloadUrl') or (data.get('data') or {}).get('url'))
            if not signed: raise SystemExit('signed URL missing')
            request=urllib.request.Request(signed,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(request,timeout=60) as r: raw=r.read(); print('signed asset',r.status,r.headers.get('content-type'),len(raw))
          if len(raw)<150000 or raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP':
            raise SystemExit(f'invalid webp size={len(raw)} head={raw[:16]!r}')
          path='assets/chunbong-content-hero-20261002.webp'
          with open(path,'wb') as out: out.write(raw)
          print('saved',path,len(raw))
          PY
      - name: Commit exact hero asset
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/chunbong-content-hero-20261002.webp
          if git diff --cached --quiet; then echo 'asset unchanged'; exit 0; fi
          git commit -m 'asset: import exact high-resolution Chunbong content hero'
          git push origin HEAD:fix/finalize-content-hero-header-shell-20261002
