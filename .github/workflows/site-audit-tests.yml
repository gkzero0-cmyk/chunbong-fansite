name: Site audit regression tests

on:
  push:
    branches:
      - fix/site-audit-20260930
  pull_request:
    paths:
      - 'lib/soop-analytics.js'
      - 'lib/soop-session-hygiene.js'
      - 'test/**'
      - 'package.json'
      - 'data/chunbong-contents.json'
      - 'data/chunbong-schedule.json'
      - 'tarot.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
