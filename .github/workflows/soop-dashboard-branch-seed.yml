name: SOOP dashboard branch seed

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-dashboard-branch-seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect Trackify API client and test favorite trend
        run: |
          node <<'NODE'
          const base='https://www.trackify.kr';
          const headers={'user-agent':'Mozilla/5.0','accept':'application/javascript,application/json,*/*'};
          const get=async url=>{const r=await fetch(url,{headers});const text=await r.text();if(!r.ok)throw new Error(`${url} ${r.status} ${text.slice(0,200)}`);return text};
          (async()=>{
            const code=await get(`${base}/assets/TrackifyApi-CyUyuZyo.js`);
            for(const needle of ['streamerTrendMulti','streamerTrend','batch','streamerOverview']){
              let pos=0,count=0;
              while((pos=code.indexOf(needle,pos))>=0&&count<10){
                console.log(`API_${needle}_${count}=`+code.slice(Math.max(0,pos-1200),Math.min(code.length,pos+2200)).replace(/\s+/g,' '));
                pos+=needle.length;count++;
              }
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
