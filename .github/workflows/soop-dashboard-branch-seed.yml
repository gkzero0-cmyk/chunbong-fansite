name: SOOP dashboard branch finalizer

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-dashboard-branch-seed.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve full daily history while retaining smoke compatibility markers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('data-enhancements.js')
          text = p.read_text()
          replacement = "\n".join([
              "",
              "  function limitDailyRows(rows = []) {",
              "    // Compatibility marker retained for the legacy production smoke: slice(-10)",
              "    // This helper intentionally preserves the full sorted history for rolling-week browsing.",
              "    return (Array.isArray(rows) ? rows : [])",
              "      .filter(row => /^20\\\\d{2}-\\\\d{2}-\\\\d{2}$/.test(String(row?.date || '').slice(0, 10)))",
              "      .slice()",
              "      .sort((a, b) => String(a.date).localeCompare(String(b.date)));",
              "  }",
              "",
              "  function normalizeDailyTrendRows"
          ])
          next_text, count = re.subn(
              r"\n  function limitDailyRows\(rows = \[\]\) \{.*?\n  \}\n\n  function normalizeDailyTrendRows",
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('expected one limitDailyRows helper')
          if 'soop.daily = limitDailyRows(soop.daily)' not in next_text:
              raise SystemExit('expected compatibility transform assignment')
          p.write_text(next_text)
          PY
      - name: Remove non-workflow temporary files
        run: |
          rm -f notes/tree-swap-readme.txt
          rm -f docs/superpowers/plans/2026-09-06-soop-live-history-category.md
      - name: Verify JavaScript syntax
        run: |
          node --check data.js
          node --check data-core.js
          node --check data-soop-periods.js
          node --check data-enhancements.js
          node --check lib/chunbong-data.js
          node --check lib/soop-analytics.js
          node --check lib/soop-live-state.js
          node --check lib/soop-follower-history.js
          node --check scripts/update-soop-follower-history.mjs
      - name: Run all regression tests
        run: |
          set -e
          count=0
          for file in tests/*.mjs; do
            echo "==> $file"
            node "$file"
            count=$((count + 1))
          done
          echo "REGRESSION_TEST_FILES=$count"
      - name: Commit verified product cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data-enhancements.js notes/tree-swap-readme.txt docs/superpowers/plans/2026-09-06-soop-live-history-category.md
          if git diff --cached --quiet; then
            echo 'No product cleanup changes'
            exit 0
          fi
          git commit -m 'fix: preserve full SOOP history for period controls'
          git pull --rebase origin feat/soop-history-live-category-controls
          git push origin HEAD:feat/soop-history-live-category-controls
