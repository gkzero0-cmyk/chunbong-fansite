name: SOOP dashboard branch seed

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-dashboard-branch-seed.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe Trackify favorite daily trend
        run: |
          node <<'NODE'
          const url=new URL('https://www.trackify.kr/api/v1/p/soop/streamer/chunbongtv/trend');
          url.searchParams.set('metrics','favorite');
          url.searchParams.set('granularity','day');
          url.searchParams.set('count','500');
          url.searchParams.set('from','2025-09-01');
          url.searchParams.set('to','2026-09-07');
          fetch(url,{headers:{'user-agent':'Mozilla/5.0','accept':'application/json'}}).then(async r=>{
            const text=await r.text();
            console.log('TREND_STATUS='+r.status);
            console.log('TREND_BYTES='+text.length);
            let j;try{j=JSON.parse(text)}catch{console.log('TREND_TEXT='+text.slice(0,4000));process.exit(1)}
            console.log('TREND_TOP_KEYS='+JSON.stringify(Object.keys(j||{})));
            console.log('TREND_JSON='+JSON.stringify(j).slice(0,16000));
          }).catch(e=>{console.error(e);process.exit(1)});
          NODE
