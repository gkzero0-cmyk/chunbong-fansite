name: SOOP dashboard branch seed

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-dashboard-branch-seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect exact Trackify favorite history
        run: node scripts/update-soop-follower-history.mjs
      - name: Verify current structured SOOP live parser
        run: |
          node <<'NODE'
          const { fetchSoopStructuredLive } = require('./lib/soop-live-state.js');
          fetchSoopStructuredLive().then(value=>{
            console.log('SOOP_LIVE_RESULT='+JSON.stringify(value));
            if(value.live !== true) process.exit(2);
          }).catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Commit seeded history
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/soop-follower-history.json; then
            echo 'Follower history unchanged'
            exit 0
          fi
          git add data/soop-follower-history.json
          git commit -m 'data: seed Trackify favorite history'
          git pull --rebase origin feat/soop-history-live-category-controls
          git push origin HEAD:feat/soop-history-live-category-controls
