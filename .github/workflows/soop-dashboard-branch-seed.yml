name: SOOP dashboard branch seed

on:
  push:
    branches: [feat/soop-history-live-category-controls]
    paths:
      - '.github/workflows/soop-dashboard-branch-seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/soop-history-live-category-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Seed exact follower history
        run: node scripts/update-soop-follower-history.mjs
      - name: Probe structured SOOP live state
        run: |
          node <<'NODE'
          const { fetchSoopStructuredLive } = require('./lib/soop-live-state.js');
          fetchSoopStructuredLive().then(value => console.log('SOOP_STRUCTURED_LIVE=' + JSON.stringify(value)))
            .catch(error => console.log('SOOP_STRUCTURED_LIVE_ERROR=' + (error?.message || String(error))));
          NODE
      - name: Discover Trackify time-series API from frontend assets
        run: |
          node <<'NODE'
          const headers={'user-agent':'Mozilla/5.0','accept':'text/html,application/javascript,*/*'};
          const base='https://www.trackify.kr';
          const get=async url=>{const r=await fetch(url,{headers});if(!r.ok)throw new Error(`${url} ${r.status}`);return r.text()};
          (async()=>{
            const html=await get(`${base}/soop/chunbongtv`);
            const entry=[...html.matchAll(/<script[^>]+src=["']([^"']+\.js[^"']*)["']/g)].map(m=>new URL(m[1],base).href);
            const queue=[...entry];
            const seen=new Set();
            const candidates=[];
            for(let cursor=0;cursor<queue.length&&seen.size<100;cursor++){
              const url=queue[cursor]; if(seen.has(url)) continue; seen.add(url);
              let code=''; try{code=await get(url)}catch{continue}
              if(/fanCount|favorite|follower|granularity|category-distribution|monthAvgViewer/.test(code)){
                const api=[...code.matchAll(/(?:["'`])([^"'`\n]{0,180}(?:\/api\/v1\/p\/soop|\/streamer\/)[^"'`\n]{0,220})(?:["'`])/g)].map(m=>m[1]);
                candidates.push({asset:url.split('/').at(-1),api:[...new Set(api)].slice(0,40)});
              }
              for(const match of code.matchAll(/["'`]([^"'`\n]*\/assets\/[^"'`\n]+\.js)["'`]/g)){
                try{const asset=new URL(match[1],base).href;if(!seen.has(asset)&&!queue.includes(asset))queue.push(asset)}catch{}
              }
              for(const match of code.matchAll(/["'`]([^"'`\n]*_id_[^"'`\n]+\.js)["'`]/g)){
                try{const asset=new URL(match[1],url).href;if(!seen.has(asset)&&!queue.includes(asset))queue.push(asset)}catch{}
              }
            }
            console.log('TRACKIFY_ENTRY='+JSON.stringify(entry));
            console.log('TRACKIFY_ASSET_COUNT='+seen.size);
            console.log('TRACKIFY_API_CANDIDATES='+JSON.stringify(candidates));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit seeded follower history
        run: |
          set -euo pipefail
          if git diff --quiet -- data/soop-follower-history.json; then
            echo 'No follower history change'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/soop-follower-history.json
          git commit -m 'data: seed SOOP favorite history'
          git pull --rebase origin feat/soop-history-live-category-controls
          git push origin HEAD:feat/soop-history-live-category-controls
